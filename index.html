                    <div style={{ fontSize: 52, marginBottom: 12 }}>📦</div>
                    <div style={{ fontSize: 16, marginBottom: 8 }}>{pagoPendOnly ? 'No hay pedidos por cobrar' : loversMissingOnly ? 'No hay cajas de Lovers sin piezas' : 'No hay pedidos activos'}</div>
                    <div style={{ fontSize: 13, color: '#ccc', maxWidth: 300, margin: '0 auto' }}>
                      Los pedidos de Square y WhatsApp aparecen aquí automáticamente.
                    </div>
                  </div>
                ) : (
                  <div>
                    {(pagoPendOnly ? [...ACTIVE_STATES, 'Entregado'] : ACTIVE_STATES).map(estado => {
                      const grupo = activeOrders.filter(o => (o.estado || 'Nuevo') === estado);
                      if (grupo.length === 0) return null;
                      return (
                        <div key={estado} style={{ marginBottom: 24 }}>
                          <div style={{ fontWeight: 700, fontSize: 12, color: '#7A6880', letterSpacing: 1, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 8 }}>
                            <span style={{ background: STATE_COLORS[estado], color: 'white', padding: '3px 10px', borderRadius: 99, fontSize: 11 }}>{estado}</span>
                            <span>{grupo.length} pedido{grupo.length !== 1 ? 's' : ''}</span>
                          </div>
                          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(300px,1fr))', gap: 14 }}>
                            {grupo.map(o => (
                              <OrderCard key={o.id} {...cardProps(o)} />
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )
              )}

              {/* Vista: Tablero de preparación (26 nov) */}
              {ordersView === 'board' && (
                <FulfillmentBoard products={products} onMove={changeOrderState} onPrint={list => setSlipOrders(list)}
                  orders={liveOrders.filter(o => (!loteOnly || o.lote) && orderMatchesSearch(o, histSearch))} />
              )}

              {/* Vista: Archivados (wave 1) — ocultos de todo lo demás, se pueden restaurar */}
              {ordersView === 'archived' && (
                <div data-testid="archivedView">
                  <p style={{ fontSize: 12, color: '#7A6880', marginBottom: 12, lineHeight: 1.5 }}>Los pedidos archivados no cuentan en ventas, clientas ni pendientes. Al archivar se devolvió su stock; al restaurar se vuelve a descontar.</p>
                  {archivedOrders.length === 0 ? (
                    <div style={{ textAlign: 'center', padding: '60px 0', color: '#767676', fontSize: 14 }}>No hay pedidos archivados.</div>
                  ) : (
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(300px,1fr))', gap: 14 }}>
                      {archivedOrders.map(o => <OrderCard key={o.id} {...cardProps(o)} />)}
                    </div>
                  )}
                </div>
              )}

              {/* Vista: Historial */}
              {ordersView === 'history' && (
                <div>
                  {/* Barra de búsqueda + fechas */}
                  <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap', alignItems: 'center' }}>
                    <span style={{ fontSize: 13, color: '#7A6B85' }}>Fechas:</span>
                    <input type="date" value={histFrom} onChange={e => setHistFrom(e.target.value)}
                      style={{ padding: '9px 12px', border: '1.5px solid #e4e4e4', borderRadius: 10, fontSize: 13, outline: 'none', fontFamily: 'inherit', color: histFrom ? '#1A1118' : '#7A6B85' }} />
                    <span style={{ color: '#7A6B85', fontSize: 13 }}>→</span>
                    <input type="date" value={histTo} onChange={e => setHistTo(e.target.value)}
                      style={{ padding: '9px 12px', border: '1.5px solid #e4e4e4', borderRadius: 10, fontSize: 13, outline: 'none', fontFamily: 'inherit', color: histTo ? '#1A1118' : '#7A6B85' }} />
                    {(histFrom || histTo) && (
                      <button onClick={() => { setHistFrom(''); setHistTo(''); }}
                        style={{ padding: '9px 14px', background: '#F3EFF5', color: '#7A6880', border: 'none', borderRadius: 10, fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>
                        Limpiar
                      </button>
                    )}
                  </div>

                  {/* Resumen */}
                  {histFiltered.length > 0 && (
                    <div style={{ display: 'flex', gap: 12, marginBottom: 16, flexWrap: 'wrap' }}>
                      <div style={{ background: '#F0FDF4', border: '1px solid #BBF7D0', borderRadius: 10, padding: '8px 16px', fontSize: 13 }}>
                        <span style={{ color: '#6B7280' }}>Pedidos: </span><strong style={{ color: '#065F46' }}>{histFiltered.length}</strong>
                      </div>
                      <div style={{ background: '#FDF2F8', border: '1px solid #FBCFE8', borderRadius: 10, padding: '8px 16px', fontSize: 13 }}>
                        <span style={{ color: '#6B7280' }}>Total cobrado (sin cancelados): </span><strong data-testid="histTotal" style={{ color: '#9D174D' }}>${histTotal.toFixed(2)}</strong>
                      </div>
                    </div>
                  )}

                  {histOrders.length === 0 ? (
                    <div style={{ textAlign: 'center', padding: '80px 0', color: '#767676' }}>
                      <div style={{ fontSize: 52, marginBottom: 12 }}>📋</div>
                      <div style={{ fontSize: 16 }}>{histSearch ? 'Ningún pedido del historial coincide con la búsqueda' : 'No hay pedidos completados aún'}</div>
                    </div>
                  ) : histFiltered.length === 0 ? (
                    <div style={{ textAlign: 'center', padding: '60px 0', color: '#767676', fontSize: 14 }}>
                      No hay resultados para esa búsqueda.
                    </div>
                  ) : (
                    <div>
                      {DONE_STATES.map(estado => {
                        const grupo = histFiltered.filter(o => (o.estado || 'Nuevo') === estado);
                        if (grupo.length === 0) return null;
                        return (
                          <div key={estado} style={{ marginBottom: 24 }}>
                            <div style={{ fontWeight: 700, fontSize: 12, color: '#7A6880', letterSpacing: 1, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 8 }}>
                              <span style={{ background: STATE_COLORS[estado], color: 'white', padding: '3px 10px', borderRadius: 99, fontSize: 11 }}>{estado}</span>
                              <span>{grupo.length} pedido{grupo.length !== 1 ? 's' : ''}</span>
                            </div>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(300px,1fr))', gap: 14 }}>
                              {grupo.map(o => (
                                <OrderCard key={o.id} {...cardProps(o)} />
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })()}

        {/* ── Ventas / Clientas (26 nov) ── */}
        {activeTab === 'ventas' && <SalesTab orders={liveOrders} products={products} />}
        {activeTab === 'clientas' && <CustomersTab orders={liveOrders} />}
        {slipOrders && <PackingSlipView orders={slipOrders} products={products} onClose={() => setSlipOrders(null)} />}

        {/* ── Landing tab ── */}
        {activeTab === 'landing' && (
          <LandingTab home={home} setHome={setHome} products={products} setDirty={setDirty} texts={texts} setTexts={setTexts} />
        )}

        {/* ── Cacusa Lovers (contenido de la página) tab ── */}
        {activeTab === 'lovers-page' && (
          <LoversPageTab lovers={lovers} setLovers={setLovers} setDirty={setDirty} />
        )}

        {/* ── Pages tab ── */}
        {activeTab === 'pages' && (
          <PagesTab pages={pages} setPages={setPages} setDirty={setDirty} />
        )}

        {/* ── Mercado tab ── */}
        {activeTab === 'mercado' && (
          <MercadoTab products={products} token={session.token} />
        )}

        {/* ── Gift Cards tab ── */}
        {activeTab === 'giftcards' && <GiftCardsTab token={session.token} />}

        {/* ── Cupones tab ── */}
        {activeTab === 'cupones' && <CouponsTab token={session.token} />}

        {/* ── Leads 10% tab ── */}
        {activeTab === 'leads' && <LeadsTab token={session.token} />}

        {/* ── Marketing por correo tab ── */}
        {activeTab === 'marketing' && <MarketingTab token={session.token} products={products} />}

        {/* ── Carritos abandonados tab ── */}
        {activeTab === 'carts' && <AbandonedCartsTab token={session.token} orders={orders} />}

        {/* ── Cacusa Lovers tab ── */}
        {activeTab === 'lovers' && <LoversTab products={products} token={session.token} />}

        {/* ── Settings tab ── */}
        {activeTab === 'settings' && (
          <div data-testid="whatsappSetting" style={{ background: 'white', borderRadius: 14, padding: '14px 16px', marginBottom: 16, boxShadow: '0 1px 6px rgba(0,0,0,.05)' }}>
            <label htmlFor="whatsappNum" style={{ display: 'block', fontSize: 13, fontWeight: 800, color: '#1A1118', marginBottom: 4 }}>WhatsApp para pedidos</label>
            <div id="whatsappHelp" style={{ fontSize: 12, color: '#7A6880', marginBottom: 8 }}>El número al que la tienda manda los pedidos y consultas. Se sube con "Publicar cambios".</div>
            <input id="whatsappNum" value={whatsappNum} onChange={e => { setWhatsappNum(e.target.value); setDirty(true); }} aria-describedby="whatsappHelp"
              placeholder="+1 786 555 0123" inputMode="tel"
              style={{ width: '100%', maxWidth: 360, height: 44, padding: '0 12px', border: '1.5px solid #E5DDEA', borderRadius: 10, fontSize: 15, outline: 'none', color: '#333' }} />
          </div>
        )}
        {activeTab === 'settings' && (
          <SettingsTab
            categories={categories} setCategories={setCategories}
            materials={materials} setMaterials={setMaterials}
            shipping={shipping} setShipping={setShipping}
            texts={texts} setTexts={setTexts}
            campaign={campaign} setCampaign={setCampaign}
            products={products} setProducts={setProducts}
            setDirty={setDirty}
          />
        )}
        {activeTab === 'settings' && <MarginSetting token={session.token} margin={margin} onSaved={setMargin} />}

        {/* ── Modals ── */}
        {pubConflict && (
          <Modal onClose={() => setPubConflict(null)} labelledBy="pubConflictTitle" boxStyle={{ maxWidth: 440 }}>
            <div data-testid="pubConflict">
              <div id="pubConflictTitle" style={{ fontWeight: 800, fontSize: 17, color: '#1A1118', marginBottom: 8 }}>Otra persona publicó cambios mientras editabas</div>
              <p style={{ fontSize: 13, color: '#5B4A63', lineHeight: 1.5, marginBottom: 16 }}>
                No se publicó nada, para no borrar lo que publicó la otra persona. Puedo traer su versión y volver a aplicar encima tus cambios (productos nuevos, editados o borrados y los ajustes que tocaste). Después revisas y publicas.
              </p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <button type="button" onClick={reapplyMyChanges} data-testid="pubReapply"
                  style={{ minHeight: 48, borderRadius: 99, background: 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', fontWeight: 800, fontSize: 14 }}>Recargar y volver a aplicar mis cambios</button>
                <button type="button" onClick={() => setPubConflict(null)}
                  style={{ minHeight: 44, borderRadius: 99, background: 'white', color: '#5B3F8A', border: '1.5px solid #D9C9EE', fontWeight: 700, fontSize: 13 }}>Ahora no (mis cambios siguen aquí)</button>
              </div>
            </div>
          </Modal>
        )}
        {showNtfyModal && <NtfyModal token={session.token} onClose={() => setShowNtfyModal(false)} />}
        {showOrderModal && <NewOrderModal open={showOrderModal} onClose={() => setShowOrderModal(false)} onSave={o => {
          apiOrderManual(session.token, o)
            .then(res => setOrders(prev => [res.order || o, ...prev]))
            .catch(e => { console.warn('order manual:', e); setSyncMsg('❌ No se pudo guardar el pedido: ' + e.message); });
        }} />}
        {showModal && <ProductModal product={editProduct} token={session.token} categories={categories} materials={materials} fbSurcharges={fbSurcharges} fbMarkets={fbMarkets} allProducts={products} skuSeq={skuSeq} onSave={saveProduct} onClose={() => { setShowModal(false); setEditProd(null); }}
          stockQty={editProduct ? (pendingStock[String(editProduct.id)] != null ? pendingStock[String(editProduct.id)] : stockOf(stock, editProduct.id)) : undefined} costInfo={editProduct ? costs[String(editProduct.id)] : undefined} margin={margin}
          onDupStock={(p, from, to) => { setStock(prev => ({ ...(prev || {}), [String(p.id)]: to })); setSyncMsg('✅ ' + (normalizeSku(p.sku) || p.name) + ': stock ' + from + ' → ' + to); setTimeout(() => setSyncMsg(''), 6000); }}
          onEnroll={p => { setEnrollOnly(String(p.id)); setShowEnroll(true); }} />}
        {showBatch && <BatchIntakeModal token={session.token} products={products} categories={categories} materials={materials} costs={costs} margin={margin}
          onCreate={createBatchProduct} onPendingStock={addPendingStock} onCostsSaved={costsSaved}
          onStockAdded={(p, from, to) => setStock(prev => ({ ...(prev || {}), [String(p.id)]: to }))}
          onClose={() => setShowBatch(false)} />}
        {prePub && <PrePublishModal items={prePub} onReview={() => setPrePub(null)} onPublish={() => { setPrePub(null); publish(); }}
          onEdit={p => { setPrePub(null); setEditProd(p); setShowModal(true); setActiveTab('products'); }} />}
        {showLabels && <LabelsModal products={products} categories={categories} stock={stock} onClose={() => setShowLabels(false)} />}
        {showEnroll && !enrollOnly && <EnrollPhotosModal products={products} token={session.token} onClose={() => setShowEnroll(false)} />}
        {showEnroll && enrollOnly && <EnrollPhotosModal products={products} token={session.token} onlyId={enrollOnly} onClose={() => { setShowEnroll(false); setEnrollOnly(null); }} />}

        {delConfirm && (
          <div style={{ position: 'fixed', inset: 0, background: 'rgba(26,17,36,.65)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
            <div style={{ background: 'white', borderRadius: 22, padding: 32, maxWidth: 340, width: '100%', textAlign: 'center', boxShadow: '0 24px 60px rgba(0,0,0,.3)', animation: 'fadeIn .3s ease' }}>
              <div style={{ fontSize: 48, marginBottom: 14 }}>🗑️</div>
              <div style={{ fontSize: 18, fontWeight: 800, marginBottom: 8 }}>¿Eliminar producto?</div>
              <div style={{ color: '#666', marginBottom: 24, fontSize: 14, lineHeight: 1.5 }}>"{delConfirm.name}" se eliminará de la tienda. Esta acción se aplica al publicar cambios.</div>
              <div style={{ display: 'flex', gap: 10 }}>
                <button onClick={() => setDelConfirm(null)} style={{ flex: 1, padding: 13, border: '1.5px solid #e0e0e0', borderRadius: 99, fontWeight: 600, color: '#666', fontSize: 14, cursor: 'pointer', background: 'white' }}>Cancelar</button>
                <button onClick={() => deleteProd(delConfirm)} style={{ flex: 1, padding: 13, background: '#DC2626', color: 'white', borderRadius: 99, fontWeight: 700, fontSize: 14, border: 'none', cursor: 'pointer' }}>Eliminar</button>
              </div>
            </div>
          </div>
        )}

      </div>
      </main>
      </div>

      {/* ── Teléfono: barra de cambios sin publicar (sobre la barra inferior), solo si hay cambios ── */}
      {isMobile && dirty && (
        <div data-testid="pendingBar" role="region" aria-label="Cambios sin publicar"
          style={{ position: 'fixed', left: 8, right: 8, bottom: 'calc(66px + env(safe-area-inset-bottom))', zIndex: 255, background: '#1A1124', color: 'white', borderRadius: 14, padding: '6px 6px 6px 14px', display: 'flex', alignItems: 'center', gap: 10, boxShadow: '0 8px 24px rgba(26,17,36,.35)', animation: 'sheetUp .2s ease' }}>
          <span role="status" aria-live="polite" style={{ flex: 1, minWidth: 0, fontSize: 13, fontWeight: 700, lineHeight: 1.3 }}>
            <span aria-hidden="true" style={{ color: '#FBBF24' }}>● </span>{syncing ? (syncMsg || 'Publicando…') : pendingText}
          </span>
          <button type="button" onClick={requestPublish} disabled={syncing} aria-label={syncing ? undefined : 'Publicar cambios'}
            style={{ minHeight: 44, padding: '0 18px', borderRadius: 99, background: 'linear-gradient(135deg,#E8508A,#9B5DE5)', color: 'white', fontWeight: 800, fontSize: 14, flexShrink: 0, opacity: syncing ? .7 : 1 }}>
            {syncing ? 'Publicando…' : 'Publicar'}
          </button>
        </div>
      )}

      {/* ── Teléfono: "+ Nuevo producto" flotante en Productos ── */}
      {isMobile && activeTab === 'products' && !bulkMode && !sortMode && (
        <button type="button" onClick={openNewProduct} data-testid="fabNew"
          style={{ position: 'fixed', right: 14, bottom: `calc(${dirty ? 132 : 74}px + env(safe-area-inset-bottom))`, zIndex: 250, minHeight: 52, padding: '0 20px', borderRadius: 99, background: 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', fontWeight: 800, fontSize: 14.5, boxShadow: '0 8px 22px rgba(155,93,229,.45)' }}>
          + Nuevo producto
        </button>
      )}

      {/* ── Hoja "Más" (teléfono) ── */}
      {showMore && (
        <Sheet title="Más secciones" onClose={() => setShowMore(false)} mobile={isMobile} testid="moreSheet">
          {NAV_GROUPS.map(g => (
            <div key={g.title} role="group" aria-label={g.title}>
              <div style={SHEET_GROUP_H}>{g.title}</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                {g.items.map(([t, l, gl]) => (
                  <button key={t} type="button" onClick={() => go(t)} aria-current={activeTab === t ? 'page' : undefined}
                    style={{ ...SHEET_ITEM, fontSize: 13, padding: '8px 10px', background: activeTab === t ? '#FCE7F0' : '#FAF7FB', color: activeTab === t ? '#C0336E' : '#1A1118' }}>
                    <span aria-hidden="true" style={SHEET_GLYPH}>{gl}</span>
                    <span style={{ flex: 1, minWidth: 0, lineHeight: 1.25 }}>{l}</span>
                    <NavBadge n={navBadge[t]} light />
                  </button>
                ))}
              </div>
            </div>
          ))}
        </Sheet>
      )}

      {/* ── Hoja "Herramientas" (Productos) ── */}
      {showTools && (
        <Sheet title="Herramientas" onClose={() => setShowTools(false)} mobile={isMobile} testid="toolsSheet">
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <button type="button" style={SHEET_ITEM} data-testid="batchOpen" onClick={() => { setShowTools(false); setShowBatch(true); }}>
              <span aria-hidden="true" style={SHEET_GLYPH}>✦</span><span style={{ flex: 1 }}>Ingreso por lote<span style={{ display: 'block', fontSize: 11.5, fontWeight: 500, color: '#7A6880' }}>Muchas fotos a la vez: agrupa por pieza, suma stock o prepara borradores</span></span>
            </button>
            <button type="button" style={SHEET_ITEM} onClick={() => { setShowTools(false); setShowLabels(true); }}>
              <span aria-hidden="true" style={SHEET_GLYPH}>◈</span><span style={{ flex: 1 }}>Etiquetas con QR<span style={{ display: 'block', fontSize: 11.5, fontWeight: 500, color: '#7A6880' }}>Imprimir etiquetas por pieza o categoría</span></span>
            </button>
            <button type="button" style={SHEET_ITEM} data-testid="bulkToggle" aria-pressed={bulkMode} onClick={() => { setBulkMode(v => !v); setBulkSel([]); setBulkMsg(''); setSortMode(false); setShowTools(false); }}>
              <span aria-hidden="true" style={SHEET_GLYPH}>✓</span><span style={{ flex: 1 }}>{bulkMode ? 'Salir de selección múltiple' : 'Selección múltiple'}<span style={{ display: 'block', fontSize: 11.5, fontWeight: 500, color: '#7A6880' }}>Precio, oferta, pausar o stock de varias a la vez</span></span>
            </button>
            <button type="button" style={SHEET_ITEM} data-testid="refsSummary" onClick={() => { setShowTools(false); openEnroll(); }}>
              <span aria-hidden="true" style={SHEET_GLYPH}>◇</span><span style={{ flex: 1 }}>Registrar fotos<span style={{ display: 'block', fontSize: 11.5, fontWeight: 500, color: '#7A6880' }}>{refsWith == null ? 'Fotos reales para el identificador' : `${refsWith} de ${refsPool.length} piezas con fotos reales`}</span></span>
            </button>
            <button type="button" style={{ ...SHEET_ITEM, opacity: recoBusy ? .7 : 1 }} data-testid="updateSimilar" disabled={recoBusy} aria-busy={recoBusy} onClick={() => { setShowTools(false); updateSimilar(); }}>
              <span aria-hidden="true" style={SHEET_GLYPH}>✦</span><span style={{ flex: 1 }}>{recoBusy ? 'Calculando recomendaciones…' : 'Actualizar recomendaciones'}<span style={{ display: 'block', fontSize: 11.5, fontWeight: 500, color: '#7A6880' }}>"También te puede gustar" en la tienda</span></span>
            </button>
            <button type="button" style={SHEET_ITEM} data-testid="sortToggle" aria-pressed={sortMode} onClick={() => { setSortMode(v => !v); setBulkMode(false); setBulkSel([]); setShowTools(false); }}>
              <span aria-hidden="true" style={SHEET_GLYPH}>⇅</span><span style={{ flex: 1 }}>{sortMode ? 'Terminar de ordenar' : 'Ordenar productos'}<span style={{ display: 'block', fontSize: 11.5, fontWeight: 500, color: '#7A6880' }}>Cambiar el orden en que salen en la tienda</span></span>
            </button>
            {/* TikTok Shop: carga masiva */}
            <div data-testid="tiktokBlock" style={{ background: '#FAF7FB', borderRadius: 12, padding: '12px 14px', marginTop: 4 }}>
              <div style={{ fontSize: 11, fontWeight: 800, color: '#7A6880', marginBottom: 6, letterSpacing: '.06em' }}>TIKTOK SHOP — CARGA MASIVA</div>
              <div style={{ fontSize: 12, color: '#555', marginBottom: 8, lineHeight: 1.4 }}>
                {tiktokMeta
                  ? `Última exportación: ${tiktokMeta.lastCount} producto(s) · ${new Date(tiktokMeta.lastGeneratedAt).toLocaleString('es-EC')}`
                  : 'Se genera automáticamente cada noche (solo productos nuevos/cambiados). Descárgalo y súbelo a mano en Seller Center → Bulk actions → Upload in bulk.'}
              </div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                <button onClick={triggerTiktokExport} disabled={tiktokExportBusy}
                  style={{ minHeight: 40, padding: '0 16px', background: tiktokExportBusy ? '#ccc' : '#1A1118', color: 'white', border: 'none', borderRadius: 99, fontSize: 12, fontWeight: 700, cursor: tiktokExportBusy ? 'wait' : 'pointer' }}>
                  {tiktokExportBusy ? 'Disparando…' : 'Generar ahora'}
                </button>
                <button onClick={loadTiktokStatus}
                  style={{ minHeight: 40, padding: '0 16px', background: 'white', color: '#555', border: '1.5px solid #ddd', borderRadius: 99, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>
                  Actualizar
                </button>
                {tiktokDownloadUrl && (
                  <a href={tiktokDownloadUrl} target="_blank" rel="noopener noreferrer"
                    style={{ minHeight: 40, padding: '0 16px', background: 'white', color: '#9B5DE5', border: '1.5px solid #9B5DE5', borderRadius: 99, fontSize: 12, fontWeight: 700, textDecoration: 'none', display: 'inline-flex', alignItems: 'center' }}>
                    Descargar Excel
                  </a>
                )}
              </div>
              {tiktokExportMsg && <div role="status" aria-live="polite" style={{ fontSize: 12, marginTop: 8, color: tiktokExportMsg.startsWith('✅') ? '#065F46' : '#DC2626', fontWeight: 500 }}>{tiktokExportMsg}</div>}
            </div>
          </div>
        </Sheet>
      )}

      {/* ── Menú "⋯" de una fila de la lista ── */}
      {rowMenu && (() => {
        const p = products.find(x => x.id === rowMenu.id) || rowMenu;
        const active = p.available !== false;
        return (
          <Sheet title={p.name} onClose={() => setRowMenu(null)} mobile={isMobile} testid="rowMenuSheet" maxWidth={420}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <button type="button" style={SHEET_ITEM} onClick={() => { setRowMenu(null); setEditProd(p); setShowModal(true); }}>
                <span aria-hidden="true" style={SHEET_GLYPH}>✎</span>Editar
              </button>
              <button type="button" style={SHEET_ITEM} onClick={() => { toggleProd(p); setRowMenu(null); }}>
                <span aria-hidden="true" style={SHEET_GLYPH}>{active ? '❙❙' : '▷'}</span>{active ? 'Pausar (ocultar de la tienda)' : 'Activar (mostrar en la tienda)'}
              </button>
              <button type="button" style={{ ...SHEET_ITEM, color: '#B91C1C', background: '#FEF2F2' }} onClick={() => { setRowMenu(null); setDelConfirm(p); }}>
                <span aria-hidden="true" style={{ ...SHEET_GLYPH, color: '#B91C1C' }}>✕</span>Eliminar
              </button>
            </div>
          </Sheet>
        );
      })()}
    </div>
  );
}

// Si un componente revienta (ej. dato inesperado de Firebase), mostrar un aviso en vez de pantalla en blanco
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch(error, info) { console.error('Error en el panel:', error, info && info.componentStack); }
  render() {
    if (!this.state.hasError) return this.props.children;
    return (
      <div role="alert" style={{ maxWidth: 420, margin: '80px auto', padding: 24, background: 'white', borderRadius: 16, boxShadow: '0 8px 32px rgba(0,0,0,.1)', textAlign: 'center', fontFamily: 'inherit' }}>
        <div style={{ fontSize: 22, color: '#EE6FA8', marginBottom: 8 }}>✦</div>
        <p style={{ fontSize: 14, color: '#333', margin: '0 0 16px' }}>Algo falló al mostrar esta sección — recarga la página</p>
        <button onClick={() => window.location.reload()}
          style={{ padding: '10px 22px', background: '#EE6FA8', color: 'white', border: 'none', borderRadius: 99, fontWeight: 700, fontSize: 14, cursor: 'pointer' }}>
          Recargar
        </button>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /><LightboxHost /></ErrorBoundary>);

// Service worker para Web Push (notificaciones de pedidos nuevas, sin apps de terceros).
// Scope explícito a esta carpeta para no chocar con el /sw.js (solo caché) de la tienda.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { scope: '/' })
    .catch(err => console.error('No se pudo registrar el Service Worker de push:', err));
}
</script>
