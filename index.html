              <div className="sp-check"><span>☐ Piezas correctas</span><span>☐ Personalización revisada</span><span>☐ Empacado</span></div>
            </section>
          );
        })}
      </div>
    </div>,
    host
  );
}

// ── Edición masiva de productos ──
// Precio/oferta/categoría/disponible cambian el formulario (setProducts) y se suben con "Publicar
// cambios" como cualquier edición. El stock va al Worker al instante (/stock/set por producto).
// La tienda solo entiende promo.price, promo.label y promo.endsAt (sin fecha de inicio): la oferta
// empieza cuando se publica.
const BULK_ACTIONS = [
  ['price', 'Cambiar precio'], ['promo', 'Poner oferta'], ['unpromo', 'Quitar oferta'],
  ['category', 'Cambiar categoría'], ['available', 'Activar / pausar'], ['stock', 'Fijar stock'],
];
function bulkRound(x, mode) {
  if (mode === '00') return Math.round(x);
  if (mode === '99') return Math.max(0.99, Math.round(x + 0.01) - 0.01);
  return x;
}
function money2(x) { return Math.round(x * 100) / 100; }
function promoIsActive(p, now = new Date()) { return !!(p && p.promo && p.promo.price && !(p.promo.endsAt && new Date(p.promo.endsAt) < now)); }
function computeBulk(action, prm, products, stock) {
  const today = localDayKey(Date.now());
  let globalErr = '';
  const num = v => (v === '' || v == null ? NaN : Number(v));
  if (action === 'price' && !Number.isFinite(num(prm.amount))) globalErr = 'Escribe cuánto cambia el precio.';
  if (action === 'promo') {
    if (!Number.isFinite(num(prm.amount)) || num(prm.amount) <= 0) globalErr = prm.kind === 'pct' ? 'Escribe el % de descuento.' : 'Escribe el precio de oferta.';
    else if (prm.kind === 'pct' && num(prm.amount) >= 100) globalErr = 'El descuento tiene que ser menor que 100 %.';
    else if (prm.endsAt && prm.endsAt < today) globalErr = 'La fecha de fin ya pasó.';
  }
  if (action === 'category' && !prm.category) globalErr = 'Elige la categoría.';
  if (action === 'stock' && !(Number.isInteger(num(prm.qty)) && num(prm.qty) >= 0 && num(prm.qty) <= 9999)) globalErr = 'El stock es un entero de 0 a 9999.';
  const rows = products.map(p => {
    const price = Number(p.price);
    const row = { p, before: '', after: '', patch: null, skip: '' };
    if (globalErr) return row;
    if (action === 'price') {
      row.before = fmtUsd(price);
      if (!(price > 0)) { row.skip = 'Sin precio válido'; return row; }
      const a = num(prm.amount);
      const raw = prm.kind === 'pct' ? price * (1 + a / 100) : price + a;
      const np = money2(bulkRound(raw, prm.round));
      row.after = fmtUsd(np);
      if (!(np > 0)) { row.skip = 'Quedaría en $0 o menos'; return row; }
      if (promoIsActive(p) && np <= Number(p.promo.price)) { row.skip = 'Quedaría ≤ su oferta activa (' + fmtUsd(p.promo.price) + ')'; return row; }
      if (np === price) { row.skip = 'Sin cambio'; return row; }
      row.patch = { price: np };
    } else if (action === 'promo') {
      row.before = promoIsActive(p) ? 'Oferta ' + fmtUsd(p.promo.price) + ' (precio ' + fmtUsd(price) + ')' : fmtUsd(price);
      if (!(price > 0)) { row.skip = 'Sin precio válido'; return row; }
      const a = num(prm.amount);
      const pp = money2(bulkRound(prm.kind === 'pct' ? price * (1 - a / 100) : a, prm.round));
      row.after = 'Oferta ' + fmtUsd(pp) + (prm.endsAt ? ' hasta ' + prm.endsAt : '');
      if (!(pp > 0)) { row.skip = 'La oferta quedaría en $0'; return row; }
      if (pp >= price) { row.skip = 'La oferta no es menor que el precio'; return row; }
      row.patch = { promo: { price: pp, label: String(prm.label || '').trim() || 'Oferta', endsAt: prm.endsAt || null } };
    } else if (action === 'unpromo') {
      row.before = p.promo && p.promo.price ? 'Oferta ' + fmtUsd(p.promo.price) + (p.promo.endsAt ? ' hasta ' + p.promo.endsAt : '') : 'Sin oferta';
      row.after = 'Sin oferta · ' + fmtUsd(price);
      if (!(p.promo && p.promo.price)) { row.skip = 'No tiene oferta'; return row; }
      row.patch = { promo: null };
    } else if (action === 'category') {
      row.before = p.category || '—'; row.after = prm.category;
      if (p.category === prm.category) { row.skip = 'Ya está en esa categoría'; return row; }
      row.patch = { category: prm.category };
    } else if (action === 'available') {
      const on = prm.available !== 'paused';
      row.before = p.available !== false ? 'Activo' : 'Pausado'; row.after = on ? 'Activo' : 'Pausado';
      if ((p.available !== false) === on) { row.skip = 'Sin cambio'; return row; }
      row.patch = { available: on };
    } else if (action === 'stock') {
      const cur = stock ? stockOf(stock, p.id) : null, q = num(prm.qty);
      row.before = cur == null ? '?' : String(cur); row.after = String(q);
      if (cur === q) { row.skip = 'Sin cambio'; return row; }
      row.patch = { stock: q };
    }
    return row;
  });
  return { rows, globalErr, changes: rows.filter(r => r.patch) };
}
function BulkEditModal({ products, categories, stock, onApply, onSaveStock, onClose }) {
  const [action, setAction] = useState('price');
  const [prm, setPrm] = useState({ kind: 'pct', amount: '', round: 'none', label: 'Oferta', endsAt: '', category: '', available: 'active', qty: '' });
  const [progress, setProgress] = useState(null); // stock: { done, total, failed: [] , finished }
  const set = (k, v) => setPrm(x => ({ ...x, [k]: v }));
  const res = computeBulk(action, prm, products, stock);
  const lbl = { display: 'block', fontSize: 11, fontWeight: 700, color: '#5B4A63', marginBottom: 4 };
  const inp = { padding: '8px 10px', border: '1.5px solid #E5DDEA', borderRadius: 8, fontSize: 13, outline: 'none', width: '100%', fontFamily: 'inherit', background: 'white' };
  const pill = on => ({ fontSize: 12, fontWeight: 700, padding: '6px 11px', borderRadius: 99, cursor: 'pointer', border: on ? '1.5px solid #9B5DE5' : '1.5px solid #E5DDEA', background: on ? '#F1EAFB' : 'white', color: on ? '#5B3F8A' : '#5B4A63' });
  const busy = progress && !progress.finished;
  const apply = async () => {
    if (!res.changes.length || busy) return;
    if (action !== 'stock') { onApply(res.changes.map(r => ({ id: r.p.id, patch: r.patch })), action); return; }
    const total = res.changes.length, failed = [];
    setProgress({ done: 0, total, failed, finished: false });
    for (let i = 0; i < total; i++) {
      const r = res.changes[i];
      try { await onSaveStock(r.p.id, r.patch.stock); } catch (e) { failed.push((normalizeSku(r.p.sku) || r.p.name) + ': ' + ((e && e.message) || 'error')); }
      setProgress({ done: i + 1, total, failed: [...failed], finished: false });
    }
    setProgress({ done: total, total, failed, finished: true });
  };
  const roundSel = (
    <div>
      <label htmlFor="bulkRound" style={lbl}>Redondeo</label>
      <select id="bulkRound" value={prm.round} onChange={e => set('round', e.target.value)} style={inp}>
        <option value="none">Sin redondear (centavos)</option><option value="00">A dólar entero (.00)</option><option value="99">Terminado en .99</option>
      </select>
    </div>

  return (
    <Modal onClose={() => { if (!busy) onClose(); }} labelledBy="bulkTitle" closeOnOverlayClick={!busy}

      </div>
      <div style={lbl} id="bulkActionLbl">¿Qué cambias?</div>
      <div role="group" aria-labelledby="bulkActionLbl" style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12 }}>
        {BULK_ACTIONS.map(([k, t]) => <button type="button" key={k} aria-pressed={action === k} disabled={busy} onClick={() => { setAction(k); setProgress(null); }} style={pill(action === k)}>{t}</button>)}
      </div>
      {action === 'price' && (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(160px,1fr))', gap: 10, marginBottom: 10 }}>
          <div>
            <label htmlFor="bulkKind" style={lbl}>Tipo de cambio</label>
            <select id="bulkKind" value={prm.kind} onChange={e => set('kind', e.target.value)} style={inp}><option value="pct">Porcentaje (%)</option><option value="fixed">Monto fijo (USD)</option></select>
          </div>
          <div>
            <label htmlFor="bulkAmount" style={lbl}>{prm.kind === 'pct' ? '% (negativo para bajar)' : 'USD (negativo para bajar)'}</label>
            <input id="bulkAmount" type="number" step="0.01" value={prm.amount} onChange={e => set('amount', e.target.value)} placeholder={prm.kind === 'pct' ? '10 o -15' : '5 o -3'} style={inp} />
          </div>
          {roundSel}
        </div>
      )}
      {action === 'promo' && (
        <>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(160px,1fr))', gap: 10, marginBottom: 10 }}>
            <div>
              <label htmlFor="bulkKind" style={lbl}>Precio de oferta</label>
              <select id="bulkKind" value={prm.kind} onChange={e => set('kind', e.target.value)} style={inp}><option value="pct">% de descuento</option><option value="fixed">Precio fijo (USD)</option></select>
            </div>
            <div>
              <label htmlFor="bulkAmount" style={lbl}>{prm.kind === 'pct' ? '% de descuento' : 'Precio de oferta USD'}</label>
              <input id="bulkAmount" type="number" min="0" step="0.01" value={prm.amount} onChange={e => set('amount', e.target.value)} placeholder={prm.kind === 'pct' ? '20' : '29.99'} style={inp} />
            </div>
            {roundSel}
            <div>
              <label htmlFor="bulkLabel" style={lbl}>Etiqueta</label>
              <input id="bulkLabel" value={prm.label} onChange={e => set('label', e.target.value)} placeholder="Oferta" style={inp} />
            </div>
            <div>
              <label htmlFor="bulkEnds" style={lbl}>Válida hasta (opcional)</label>

            </div>

          <div role="note" style={{ fontSize: 11, color: '#5B4A63', background: '#F7F3FA', borderRadius: 8, padding: '6px 10px', marginBottom: 10 }}>
            La oferta empieza al publicar: la tienda todavía no entiende una fecha de inicio. Si un producto ya tiene oferta, se reemplaza.
          </div>
        </>
      )}
      {action === 'category' && (
        <div style={{ marginBottom: 10 }}>
          <label htmlFor="bulkCat" style={lbl}>Nueva categoría</label>
          <select id="bulkCat" value={prm.category} onChange={e => set('category', e.target.value)} style={inp}>
            <option value="">Elige…</option>{(categories || []).map(c => <option key={c}>{c}</option>)}
          </select>
          <div style={{ fontSize: 11, color: '#7A6880', marginTop: 4 }}>Los códigos (AN001…) no cambian al mover de categoría.</div>
        </div>
      )}
      {action === 'available' && (
        <div role="group" aria-label="Estado" style={{ display: 'flex', gap: 6, marginBottom: 10 }}>
          {[['active', 'Activar (se ven en la tienda)'], ['paused', 'Pausar (ocultar)']].map(([k, t]) => <button type="button" key={k} aria-pressed={prm.available === k} onClick={() => set('available', k)} style={pill(prm.available === k)}>{t}</button>)}
        </div>
      )}
      {action === 'stock' && (
        <div style={{ marginBottom: 10 }}>
          <label htmlFor="bulkQty" style={lbl}>Stock para todas las elegidas</label>
          <input id="bulkQty" type="number" min="0" max="9999" step="1" inputMode="numeric" value={prm.qty} onChange={e => set('qty', e.target.value)} disabled={busy} style={{ ...inp, maxWidth: 160 }} />
          <div role="note" style={{ fontSize: 12, color: '#92400E', background: '#FEF3C7', borderRadius: 8, padding: '6px 10px', marginTop: 8 }}>
            El stock se guarda al instante en el servidor al confirmar (no espera a "Publicar cambios") y la tienda lo usa enseguida.
          </div>
        </div>
      )}
      {res.globalErr && <div role="alert" style={{ fontSize: 12, color: '#B91C1C', marginBottom: 8 }}>{res.globalErr}</div>}
      {!res.globalErr && (
        <>
          <div style={{ fontSize: 12, fontWeight: 700, color: '#5B4A63', margin: '4px 0 6px' }} data-testid="bulkSummary">Vista previa: cambian {res.changes.length} de {products.length}{res.changes.length < products.length ? ' (las demás se saltan)' : ''}</div>
          <div style={{ maxHeight: 260, overflow: 'auto', border: '1px solid #F0EAF3', borderRadius: 8, marginBottom: 12 }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }} data-testid="bulkPreview">

          {progress.finished ? (progress.failed.length ? 'Stock guardado en ' + (progress.total - progress.failed.length) + ' de ' + progress.total + '. No se guardó: ' + progress.failed.join(' · ') : '✓ Stock guardado en ' + progress.total + ' producto' + (progress.total === 1 ? '' : 's') + '.') : 'Guardando stock… ' + progress.done + ' de ' + progress.total}

        <button type="button" onClick={onClose} disabled={busy} style={{ flex: 1, minWidth: 120, padding: 11, border: '1.5px solid #e0e0e0', borderRadius: 99, fontWeight: 600, color: '#666', background: 'white' }}>{progress && progress.finished ? 'Listo' : 'Cancelar'}</button>

            {busy ? 'Guardando…' : action === 'stock' ? 'Guardar stock de ' + res.changes.length + ' ya' : 'Aplicar a ' + res.changes.length + ' (luego Publicar)'}
          </button>
        )}
      </div>
    </Modal>
  );
}

const MOBILE_MQ = '(max-width: 767px)';
function useIsMobile() {
  const get = () => { try { return window.matchMedia(MOBILE_MQ).matches; } catch (_) { return window.innerWidth < 768; } };
  const [m, setM] = useState(get);
  useEffect(() => {
    let mq; try { mq = window.matchMedia(MOBILE_MQ); } catch (_) { return; }
    const f = () => setM(mq.matches);
    if (mq.addEventListener) mq.addEventListener('change', f); else mq.addListener(f);
    return () => { if (mq.removeEventListener) mq.removeEventListener('change', f); else mq.removeListener(f); };
  }, []);
  return m;
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }

// Lo que necesita atención hoy (Inicio). Todo sale de datos ya cargados.
const PREP_STATES = ['Nuevo', 'Confirmado', 'En proceso'];
const LOW_SOLD_DAYS = 30;
function computeAttention(orders, products, stock, now = new Date()) {
  const prep = { Nuevo: 0, Confirmado: 0, 'En proceso': 0 };
  let loversMissing = 0;
  for (const o of orders || []) {
    const st = o.estado || 'Nuevo';
    if (!PREP_STATES.includes(st)) continue;
    prep[st]++;
    if (loversMissingPieces(o) > 0) loversMissing++;
  }
  // Vendidas en los últimos 30 días (para "Se están acabando": stock 1 de piezas que se venden)
  const since = now.getTime() - LOW_SOLD_DAYS * 86400000;
  const sold = new Set();
  for (const o of orders || []) {
    if (!orderIsSale(o)) continue;
    const t = orderTime(o);
    if (!(t >= since)) continue;
    for (const l of o.productos || []) if (l && l.id != null && !l.isCombo) sold.add(String(l.id));
  }
  const active = (products || []).filter(p => p.available !== false);
  const outIds = stock ? active.filter(p => stockOf(stock, p.id) <= 0).map(p => String(p.id)) : [];
  const lowIds = stock ? active.filter(p => stockOf(stock, p.id) === 1 && sold.has(String(p.id))).map(p => String(p.id)) : [];
  return { prep, prepTotal: prep.Nuevo + prep.Confirmado + prep['En proceso'], loversMissing, outIds, lowIds, stockReady: !!stock };
}

// Stock con − / + (lista de productos): guarda como movimiento (/stock/adjust, wave 1) un instante
// después del último toque (varios toques seguidos = un solo movimiento).
function StockStepper({ productId, name, sku, qty, onSave, hintId }) {
  const [val, setVal] = useState(qty);
  const [state, setState] = useState(''); // '' | 'saving' | 'ok' | error
  const timer = useRef(null), dirtyV = useRef(false), startQ = useRef(qty);
  useEffect(() => { if (!dirtyV.current) setVal(qty); }, [qty]);
  useEffect(() => () => clearTimeout(timer.current), []);
  // Wave 1: se manda el MOVIMIENTO (n − valor al empezar a tocar), no el número en pantalla: si entra
  // una venta mientras tanto, se suma en el servidor y el valor que vuelve ya la incluye.
  const begin = () => { if (!dirtyV.current) startQ.current = qty; dirtyV.current = true; };
  const commit = async n => {
    dirtyV.current = false;
    const delta = n - startQ.current;
    if (!delta) { setState(''); setVal(qty); return; }
    setState('saving');
    try { await onSave(productId, n, { delta }); setState('ok'); setTimeout(() => setState(s => s === 'ok' ? '' : s), 1500); }
    catch (e) { setState((e && e.message) || 'No se guardó'); setVal(qty); }
  };
  const schedule = n => { begin(); setVal(n); clearTimeout(timer.current); timer.current = setTimeout(() => commit(n), 600); };
  const step = d => schedule(Math.max(0, Math.min(9999, (Number(val) || 0) + d)));
  const out = Number(val) <= 0, low = Number(val) > 0 && Number(val) <= 2;
  const b = { width: 32, height: 44, borderRadius: 10, background: '#F3EFF5', color: '#5B3F8A', fontSize: 20, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 };
  const inputId = 'stock-' + productId;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 2, position: 'relative' }} onClick={e => e.stopPropagation()}>
      <button type="button" style={{ ...b, opacity: out ? .45 : 1 }} disabled={out} aria-label={'Restar 1 al stock de ' + name} onClick={() => step(-1)}>−</button>
      <label htmlFor={inputId} style={SR_ONLY}>Stock de {name}{sku ? ' · ' + sku : ''}</label>
      <input id={inputId} className="adm-nospin" type="number" inputMode="numeric" min={0} max={9999} value={val} aria-describedby={hintId}
        onChange={e => { const t = e.target.value; begin(); setVal(t === '' ? '' : Number(t)); clearTimeout(timer.current); }}
        onBlur={() => { const n = Number(val); if (val === '' || !Number.isInteger(n) || n < 0 || n > 9999) { setVal(qty); dirtyV.current = false; setState('Entero de 0 a 9999'); return; } if (dirtyV.current) { clearTimeout(timer.current); commit(n); } }}
        onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}
        style={{ width: 34, height: 34, textAlign: 'center', border: 'none', borderRadius: 8, fontSize: 15, padding: 0, fontWeight: 800, outline: 'none', MozAppearance: 'textfield', background: out ? '#FEE2E2' : low ? '#FEF3C7' : 'transparent', color: out ? '#B91C1C' : low ? '#92400E' : '#1A1118' }} />
      <button type="button" style={b} aria-label={'Sumar 1 al stock de ' + name} onClick={() => step(1)}>+</button>
      <span role="status" aria-live="polite" style={{ position: 'absolute', top: -4, right: -2, fontSize: 10, fontWeight: 800, color: state === 'ok' ? '#15803D' : state === 'saving' ? '#7A6880' : '#DC2626', pointerEvents: 'none', whiteSpace: 'nowrap' }}>
        {state === 'saving' ? '…' : state === 'ok' ? '✓' : state ? <span style={SR_ONLY}>{state}</span> : ''}
      </span>
      {state && state !== 'saving' && state !== 'ok' && <span aria-hidden="true" style={{ position: 'absolute', top: -6, right: -4, color: '#DC2626', fontWeight: 900 }} title={state}>!</span>}
    </div>
  );
}

  // Snapshot del español al cargar, para detectar cambios y re-traducir solo lo editado
  const snapRef = React.useRef({ texts: '', home: '', pages: '', lovers: '' });
  // Cambios sin publicar (27 nov): "dirty" sigue siendo la fuente de verdad (publish() no cambia);
  // esto solo cuenta CUÁNTOS cambios hay contra lo último cargado/publicado (piezas nuevas, editadas
  // o borradas, el orden, y cada bloque de configuración).
  const pubBaseRef = React.useRef(null);
  const resnapRef = React.useRef(false);
  const cfgNow = { whatsapp: whatsappNum, categories, materials, shipping, texts, campaign, home, lovers, pages, combos };
  const takePubSnap = () => {
    pubBaseRef.current = {
      prods: new Map(products.map(p => [String(p.id), JSON.stringify(p)])),
      order: products.map(p => String(p.id)),
      cfg: Object.fromEntries(Object.entries(cfgNow).map(([k, v]) => [k, JSON.stringify(v)]))
    };
  };
  useEffect(() => {
    if (rebaseRef.current) {
      // Después de volver a aplicar mis cambios sobre el catálogo nuevo: la base pasa a ser ESE
      // catálogo (así el contador muestra solo mis cambios), con mis bloques de config como pendientes.
      const rb = rebaseRef.current; rebaseRef.current = null; takePubSnap();
      pubBaseRef.current.prods = rb.prods; pubBaseRef.current.order = rb.order;
      for (const k of rb.cfgChanged) pubBaseRef.current.cfg[k] = rb.oldCfg[k];
      setBaseTick(t => t + 1);
    } else if (resnapRef.current) { resnapRef.current = false; takePubSnap(); }
  });
  const prevDirtyRef = React.useRef(false);
  useEffect(() => { if (prevDirtyRef.current && !dirty) takePubSnap(); prevDirtyRef.current = dirty; }, [dirty]);
  const pendingCount = React.useMemo(() => {
    const base = pubBaseRef.current;
    if (!dirty || !base) return 0;
    let n = 0;
    const ids = new Set();
    for (const p of products) { const id = String(p.id); ids.add(id); const b = base.prods.get(id); if (b == null || b !== JSON.stringify(p)) n++; }
    for (const id of base.prods.keys()) if (!ids.has(id)) n++;
    const common = products.map(p => String(p.id)).filter(id => base.prods.has(id)), baseCommon = base.order.filter(id => ids.has(id));
    if (common.join(',') !== baseCommon.join(',')) n++;
    for (const [k, v] of Object.entries(cfgNow)) if (base.cfg[k] !== JSON.stringify(v)) n++;
    return n;
  }, [dirty, products, whatsappNum, categories, materials, shipping, texts, campaign, home, lovers, pages, combos, baseTick]);
  latestRef.current = { products, skuSeq };
  const pendingText = pendingCount ? `Tienes ${pendingCount} cambio${pendingCount === 1 ? '' : 's'} sin publicar` : 'Tienes cambios sin publicar';

  useEffect(() => {
    (async () => {
      try {
        const [sr, mk] = await Promise.all([
          apiCall('pub/surcharges', {}),
          apiCall('pub/markets', {})
        ]);
        if (sr.surcharges && typeof sr.surcharges === 'object') setFbSurcharges(sr.surcharges);
        if (mk.markets   && typeof mk.markets   === 'object') setFbMarkets(mk.markets);
      } catch (_) {}
    })();
  }, []);

  // TikTok Shop: carga masiva nocturna (sin API — no hay Account Manager en
  // TikTok Partner Center). Un GitHub Action genera exports/tiktok_bulk_latest.xlsx
  // cada noche con los productos nuevos/cambiados; el archivo se sube a mano en
  // Seller Center → Bulk actions → Upload in bulk (TikTok exige resolver un
  // captcha ahí, no se puede saltar).
  const loadTiktokStatus = async () => {
    if (!session?.token) return;
    try {
      const res = await apiCall('tiktok/export-status', { token: session.token });
      if (res.ok) { setTiktokMeta(res.meta); setTiktokDownloadUrl(res.downloadUrl || ''); }
    } catch (_) {}
  };
  useEffect(() => { loadTiktokStatus(); }, [session?.token]);
  const triggerTiktokExport = async () => {
    setTiktokExportBusy(true); setTiktokExportMsg('');
    try {
      const res = await apiCall('tiktok/trigger-export', { token: session.token });
      setTiktokExportMsg(res.ok
        ? '✅ Disparado — tarda ~1 min, dale a "🔄 Actualizar" para ver el resultado'
        : '❌ ' + (res.error || 'No se pudo disparar la exportación'));
    } catch (e) {
      setTiktokExportMsg('❌ ' + (e.message || 'Error al conectar'));
    }
    setTiktokExportBusy(false);
  };

  useEffect(() => {
    if (session) {
      try { sessionStorage.setItem('cacusa_session', JSON.stringify(session)); } catch (_) {}
      loadData();
      loadStock();
      loadCosts();
      // Badge de suscriptoras de Lovers — requiere el token de sesión real, así que se
      // carga recién acá (post-login), no en el useEffect de montaje.
      (async () => {
        try {
          const r = await fetch(`${LOVERS_WEBHOOK_URL}/admin/lovers`, { headers: { 'X-Admin-Key': session.token } });
          if (r.ok) { const d = await r.json(); setLoversCount(d && d.subscribers ? Object.keys(d.subscribers).length : 0); }
        } catch (_) {}
      })();
    }
  }, [session]);

  // Auto-sync de la suscripción push apenas hay sesión — no solo cuando alguien
  // abre el modal de 🔔 (PushSection ya hace este mismo re-sync, pero solo al
  // montarse). También escucha al Service Worker: si pushsubscriptionchange
  // renueva la suscripción sola en segundo plano (sw.js), este mensaje es la
  // única forma de que ese dato nuevo llegue al servidor, porque el propio
  // Service Worker no tiene acceso al token de sesión guardado en la página.
  useEffect(() => {
    if (!session || !('serviceWorker' in navigator && 'PushManager' in window)) return;
    navigator.serviceWorker.ready
      .then(reg => reg.pushManager.getSubscription())
      .then(sub => { if (sub) apiCall('push/subscribe', { token: session.token, subscription: sub.toJSON() }).catch(() => {}); })
      .catch(() => {});
    const onSwMessage = (e) => {
      if (e.data && e.data.type === 'cacusa-push-resubscribed' && e.data.subscription) {
        apiCall('push/subscribe', { token: session.token, subscription: e.data.subscription }).catch(() => {});
      }
    };
    navigator.serviceWorker.addEventListener('message', onSwMessage);
    return () => navigator.serviceWorker.removeEventListener('message', onSwMessage);
  }, [session]);

  useEffect(() => {
    if (!session) return;
    const silent = () => loadData(true);
    const onVisible = () => { if (!document.hidden) silent(); };
    const iv = setInterval(silent, 30000);
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('focus', silent);
    return () => {
      clearInterval(iv);
      document.removeEventListener('visibilitychange', onVisible);
      window.removeEventListener('focus', silent);
    };
  }, [session]);

  const sessionExpired = () => {
    setSyncMsg('⚠️ Tu sesión expiró por seguridad. Cierra sesión y vuelve a entrar.');
  };

  // Aplica un catálogo (data/products.json) al panel. La usan la carga normal y "Recargar y volver
  // a aplicar mis cambios" (conflicto al publicar, wave 1).
  const applyCatalogData = data => {
    const prods = Array.isArray(data) ? data : (data.products || []);
    resnapRef.current = true; // base para contar los cambios sin publicar
    setProducts(prods.map(p => ({ ...p, available: p.available !== false })));
    if (Array.isArray(data.combos)) setCombos(data.combos);
    const cfg = (data.config || {});
    setSkuSeq((cfg.skuSeq && typeof cfg.skuSeq === 'object' && !Array.isArray(cfg.skuSeq)) ? cfg.skuSeq : {});
    setWhatsappNum(data.whatsapp || cfg.whatsapp || '');
    if (Array.isArray(cfg.categories) && cfg.categories.length) setCategories(cfg.categories);
    if (Array.isArray(cfg.materials)  && cfg.materials.length)  setMaterials(cfg.materials);
    if (cfg.shipping && typeof cfg.shipping === 'object') setShipping({ ...DEFAULT_SHIPPING, ...cfg.shipping });
    const mergedTexts = (cfg.texts && typeof cfg.texts === 'object') ? { ...DEFAULT_TEXTS, ...cfg.texts } : DEFAULT_TEXTS;
    setTexts(mergedTexts);
    // Campaña: se mezcla con los defaults y se conservan campos desconocidos (contrato con la tienda)
    setCampaign((cfg.campaign && typeof cfg.campaign === 'object' && !Array.isArray(cfg.campaign))
      ? { ...DEFAULT_CAMPAIGN, ...cfg.campaign } : DEFAULT_CAMPAIGN);
    const h = (cfg.home && typeof cfg.home === 'object') ? cfg.home : {};
    const mergedHome = {
      ...DEFAULT_HOME, ...h,
      stats: Array.isArray(h.stats) ? h.stats : DEFAULT_HOME.stats,
      person: (h.person && typeof h.person === 'object')
        ? { ...DEFAULT_HOME.person, ...h.person, steps: Array.isArray(h.person.steps) ? h.person.steps : DEFAULT_HOME.person.steps }
        : DEFAULT_HOME.person,
      testimonials: Array.isArray(h.testimonials) ? h.testimonials : DEFAULT_HOME.testimonials,
      footer: (h.footer && typeof h.footer === 'object') ? { ...DEFAULT_HOME.footer, ...h.footer } : DEFAULT_HOME.footer
    };
    setHome(mergedHome);
    const l = (cfg.lovers && typeof cfg.lovers === 'object') ? cfg.lovers : {};
    const mergedLovers = {
      ...DEFAULT_LOVERS, ...l,
      whatItems:   Array.isArray(l.whatItems)   ? l.whatItems   : DEFAULT_LOVERS.whatItems,
      planFeatures:Array.isArray(l.planFeatures)? l.planFeatures: DEFAULT_LOVERS.planFeatures,
      howSteps:    Array.isArray(l.howSteps)    ? l.howSteps    : DEFAULT_LOVERS.howSteps,
      conditions:  Array.isArray(l.conditions)  ? l.conditions  : DEFAULT_LOVERS.conditions,
      faq:         Array.isArray(l.faq)         ? l.faq         : DEFAULT_LOVERS.faq,
      shippingNotice: (l.shippingNotice && typeof l.shippingNotice === 'object') ? { ...DEFAULT_LOVERS.shippingNotice, ...l.shippingNotice } : DEFAULT_LOVERS.shippingNotice
    };
    setLovers(mergedLovers);
    const mergedPages = {
      envios:       { ...DEFAULT_PAGES.envios,       ...((cfg.pages && cfg.pages.envios)       || {}) },
      devoluciones: { ...DEFAULT_PAGES.devoluciones, ...((cfg.pages && cfg.pages.devoluciones) || {}) },
      cuidados:     { ...DEFAULT_PAGES.cuidados,     ...((cfg.pages && cfg.pages.cuidados)     || {}) }
    };
    setPages(mergedPages);
    // Preserva los bloques en inglés y guarda snapshot del español (para re-traducir solo lo editado)
    enRef.current = {
      translations: cfg.translations || null,
      texts_en:     cfg.texts_en     || null,
      home_en:      cfg.home_en      || null,
      pages_en:     cfg.pages_en     || null,
      lovers_en:    cfg.lovers_en    || null
    };
    snapRef.current = {
      texts:  JSON.stringify(mergedTexts),
      home:   JSON.stringify(mergedHome),
      pages:  JSON.stringify(mergedPages),
      lovers: JSON.stringify(mergedLovers)
    };
  };

  const loadData = async (silent = false) => {
    if (!silent) setLoading(true); setSyncMsg('');
    try {
      const res = await apiLoad(session.token);
      // ── Productos + configuración ──
      // 22 oct (auditoría): el auto-refresh (cada 30 s / al volver a la pestaña) NO pisa productos ni
      // textos si hay cambios sin publicar — antes se perdían en silencio. dirtyRef porque el intervalo
      // guarda el loadData del primer render.
      if (silent && dirtyRef.current) {
        // se salta productos/config; abajo se siguen agregando los pedidos nuevos
      } else if (res.products) {
        applyCatalogData(JSON.parse(res.products));
        setProductsSha(res.productsSha || null); // wave 1: base para detectar si otra persona publicó
      } else if (!silent) {
        setProducts([]);
        setSyncMsg('📦 No hay productos aún. Agrega tu primer producto y haz clic en "Publicar".');
      }
      // ── Pedidos: en silent/auto-refresh solo agregar pedidos nuevos, no pisar cambios locales ──
      if (res.orders) {
        try {
          const freshOrders = JSON.parse(res.orders).orders || [];
          // Wave 1: el refresco (30 s / al volver) agrega los nuevos Y reemplaza los que cambiaron en
          // otro teléfono (updatedAt más nuevo). Nunca pisa un pedido con un cambio propio en vuelo, ni
          // vuelve atrás uno que acabamos de guardar (orders_cache puede llegar unos segundos atrasada).
          setOrders(prev => {
            if (!silent || prev.length === 0) return freshOrders;
            const byId = new Map(freshOrders.map(o => [o.id, o]));
            const existingIds = new Set(prev.map(o => o.id));
            const newOnes = freshOrders.filter(o => !existingIds.has(o.id));
            let changed = newOnes.length > 0;
            const merged = prev.map(o => {
              const f = byId.get(o.id);
              if (!f || orderBusyRef.current.has(o.id)) return o;
              if (f.updatedAt && (!o.updatedAt || f.updatedAt > o.updatedAt)) { changed = true; return o.labelBase64 && !f.labelBase64 ? { ...f, labelBase64: o.labelBase64 } : f; }
              return o;
            });
            return changed ? [...newOnes, ...merged] : prev;
          });
        } catch (_) { if (!silent) setOrders([]); }
      } else { if (!silent) setOrders([]); }
      setDataState('ok');
    } catch (err) {
      setDataState(s => (s === 'ok' || s === 'stale') ? 'stale' : 'error');
      if (err.status === 401) sessionExpired();
      else setSyncMsg(silent ? '❌ Sin conexión con el servidor: los datos pueden no estar al día.' : '❌ Error cargando datos: ' + err.message);
    }
    setLoading(false);
  };

  // ✦ Actualizar recomendaciones (25 nov): para cada producto, hasta 8 parecidos por la huella v3 →
  // campo "similar" (la tienda los muestra en "También te puede gustar"). Con el botón sí se prepara
  // el identificador (y se baja la primera vez); al publicar solo si ya estaba preparado.
  const updateSimilar = async () => {
    if (recoBusy) return;
    setRecoBusy(true); setRecoMsg('Preparando las huellas del catálogo (la primera vez descarga ~55 MB)…');
    try {
      const r = await prepareCatalogShared(products);
      setRecoMsg('Aislando la pieza en cada foto (solo la primera vez para cada foto nueva)…');
      await preparePieceItems(r.items);
      const sim = computeSimilarMap(r.items);
      setProducts(ps => withSimilar(ps, sim)); setDirty(true);
      setRecoMsg(`✓ Recomendaciones listas para ${sim.size} productos. Publica los cambios para subirlas a la tienda.`);
    } catch (e) { setRecoMsg('No se pudieron calcular las recomendaciones: ' + ((e && e.message) || 'error')); }
    setRecoBusy(false);
  };
  const publish = async () => {
    const campProblems = campaignDateProblems(campaign);
    if (campProblems.length) {
      alert('Campaña de temporada (Ajustes): corrige estas fechas antes de publicar — el sitio no las mostraría como están en el panel.\n\n' + campProblems.join('\n'));
      return;
    }
    setSyncing(true); setSyncMsg('☁️ Guardando de forma segura…');
    try {
      // ── Traducción automática al inglés ──
      // Regenera un bloque solo si su versión en español cambió desde la carga; si no, preserva la traducción existente.
      let texts_en  = enRef.current.texts_en;
      let home_en   = enRef.current.home_en;
      let pages_en  = enRef.current.pages_en;
      let lovers_en = enRef.current.lovers_en;
      if (JSON.stringify(texts) !== snapRef.current.texts || !texts_en) {
        setSyncMsg('🌐 Traduciendo textos de la tienda…'); texts_en = await translateTextsBlock(texts);
      }
      if (JSON.stringify(home) !== snapRef.current.home || !home_en) {
        setSyncMsg('🌐 Traduciendo sección "Nosotros"…');  home_en = await translateHomeBlock(home);
      }
      if (JSON.stringify(lovers) !== snapRef.current.lovers || !lovers_en) {
        setSyncMsg('🌐 Traduciendo Cacusa Lovers…');       lovers_en = await translateLoversBlock(lovers);
      }
      if (JSON.stringify(pages) !== snapRef.current.pages || !pages_en) {
        setSyncMsg('🌐 Traduciendo páginas de ayuda…');    pages_en = await translatePagesBlock(pages);
      }
      // Rellena traducciones de productos que aún no las tengan (las nuevas ya se traducen al guardar)
      let prodsOut = products;
      const needTr = products.filter(p => p.name && (!p.name_en || !p.description_en));
      const failedTr = [];
      if (needTr.length) {
        setSyncMsg('🌐 Traduciendo productos al inglés…');
        prodsOut = [];
        for (const p of products) {
          if (p.name && (!p.name_en || !p.description_en)) {
            const tr = await translateProductEn(session.token, { name: p.name_en ? '' : p.name, description: p.description_en ? '' : (p.description || '') });
            const nRes = p.name_en ? { text: p.name_en, ok: true } : tr.name, dRes = p.description_en ? { text: p.description_en, ok: true } : tr.description;
            if (!nRes.ok || !dRes.ok) failedTr.push(p.name);
            prodsOut.push({ ...p, name_en: nRes.text, description_en: dRes.text });
          } else prodsOut.push(p);
        }
        setProducts(prodsOut);
      }
      if (failedTr.length) {
        alert('⚠️ No se pudo traducir automáticamente al inglés (texto muy largo para el traductor gratuito) en estos productos — quedaron con el texto en español como respaldo, revísalos y corrígelos a mano en "Nombre/descripción en inglés":\n\n' + failedTr.join('\n'));
      }
      // Código de producto: toda pieza sin código recibe el siguiente libre de su categoría, y
      // config.skuSeq guarda el número más alto entregado por prefijo (nunca se reusa).
      const asg = assignMissingSkus(prodsOut, skuSeq);
      if (asg.assigned) { prodsOut = asg.products; setProducts(prodsOut); }
      const seqOut = { ...asg.seq };
      prodsOut.forEach(p => { const s = normalizeSku(p.sku); if (SKU_RE.test(s)) { const k = s.slice(0, 2), n = parseInt(s.slice(2), 10); if (!(seqOut[k] >= n)) seqOut[k] = n; } });
      setSkuSeq(seqOut);
      // "similar" (También te puede gustar): solo si el identificador ya preparó el catálogo Y las
      // huellas de pieza en esta sesión (nunca se fuerza la descarga al publicar, y nunca se recalcula
      // con la foto entera: comparaba fondos); si no, quedan los valores que ya tenían.
      if (_prepLast && Array.isArray(_prepLast.items) && _prepLast.items.length > 1 && _prepLast.items.some(it => it.piece)) {
        prodsOut = withSimilar(prodsOut, computeSimilarMap(_prepLast.items)); setProducts(prodsOut);
      }
      setSyncMsg('☁️ Guardando de forma segura…');
      const json = JSON.stringify({
        version: '1.0',
        lastUpdated: new Date().toISOString(),
        updatedBy: session.username,
        whatsapp: whatsappNum,
        config: {
          whatsapp: whatsappNum, categories, materials, shipping,
          texts, texts_en, home, home_en, lovers, lovers_en, pages, pages_en,
          campaign,
          skuSeq: seqOut,
          translations: enRef.current.translations || undefined
        },
        products: prodsOut,
        combos
      }, null, 2);
      // Refresca el snapshot para no re-traducir lo mismo en la próxima publicación de esta sesión
      enRef.current = { translations: enRef.current.translations, texts_en, home_en, pages_en, lovers_en };
      snapRef.current = { texts: JSON.stringify(texts), home: JSON.stringify(home), pages: JSON.stringify(pages), lovers: JSON.stringify(lovers) };
      // Wave 1: se manda el sha sobre el que se editó; si otra persona publicó entretanto → 409.
      const sv = await apiCall('save', { token: session.token, path: PRODUCTS_PATH, content: json, message: `[Admin] Productos - ${session.username}`, ...(productsSha ? { baseSha: productsSha } : {}) });
      if (sv && sv.sha) setProductsSha(sv.sha);
      // Pedidos: ya no se resave acá — cada pedido se persiste al instante en su propia
      // llave (ver updateOrderRemote/deleteOrderRemote/apiOrderManual más arriba).
      setDirty(false);
      if (Object.keys(pendingStockRead()).length) [80000, 160000, 300000].forEach(ms => setTimeout(() => loadStock(), ms)); // stock de piezas nuevas, cuando la tienda ya las tenga
      setSyncMsg('✅ ¡Publicado en cacusabytaitus.com! La tienda se actualiza en 1–2 min.');
      setTimeout(() => setSyncMsg(''), 8000);
    } catch (e) {
      if (e.status === 409 && e.data && e.data.conflict && e.data.products) { setSyncMsg(''); setPubConflict({ sha: e.data.sha, products: e.data.products }); }
      else setSyncMsg(e.status === 401 ? '⚠️ Tu sesión expiró. Cierra sesión y vuelve a entrar (tus cambios siguen aquí).' : '❌ Error: ' + e.message);
    }
    setSyncing(false);
  };
  // Conflicto al publicar (wave 1): toma el catálogo que publicó la otra persona y le vuelve a
  // aplicar encima MIS cambios por producto (nuevos, editados, borrados), el orden si lo cambié y
  // los bloques de configuración que toqué. Nada se publica solo: queda para revisar y publicar.
  const reapplyMyChanges = () => {
    const conf = pubConflict; if (!conf) return;
    let data; try { data = JSON.parse(conf.products); } catch (_) { setSyncMsg('❌ El catálogo nuevo no se pudo leer. Recarga los datos.'); setPubConflict(null); return; }
    const base = pubBaseRef.current;
    const freshProds = (Array.isArray(data) ? data : (data.products || [])).map(p => ({ ...p, available: p.available !== false }));
    const freshMap = new Map(freshProds.map(p => [String(p.id), p]));
    const localMap = new Map(products.map(p => [String(p.id), p]));
    const changed = new Set(), deleted = new Set(), both = [];
    for (const p of products) { const id = String(p.id), b = base && base.prods.get(id); if (b == null || b !== JSON.stringify(p)) changed.add(id); }
    if (base) for (const id of base.prods.keys()) if (!localMap.has(id)) deleted.add(id);
    for (const id of changed) { const f = freshMap.get(id), b = base && base.prods.get(id); if (b != null && (!f || JSON.stringify(f) !== b)) both.push(localMap.get(id).name || id); }
    let result = freshProds.filter(p => !deleted.has(String(p.id))).map(p => changed.has(String(p.id)) ? localMap.get(String(p.id)) : p);
    for (const p of products) if (changed.has(String(p.id)) && !freshMap.has(String(p.id))) result.push(p);
    const localOrder = products.map(p => String(p.id));
    const orderChanged = base && localOrder.filter(id => base.prods.has(id)).join(',') !== base.order.filter(id => localMap.has(id)).join(',');
    if (orderChanged) {
      const pos = new Map(localOrder.map((id, i) => [id, i]));
      result = result.map((p, i) => ({ p, i })).sort((x, y) => (pos.has(String(x.p.id)) ? pos.get(String(x.p.id)) : 1e6 + x.i) - (pos.has(String(y.p.id)) ? pos.get(String(y.p.id)) : 1e6 + y.i)).map(x => x.p);
    }
    const cfgChanged = base ? Object.keys(cfgNow).filter(k => base.cfg[k] !== JSON.stringify(cfgNow[k])) : [];
    const has = k => cfgChanged.includes(k);
    const cfg = { ...(data.config || {}) };
    for (const k of ['categories', 'materials', 'shipping', 'texts', 'campaign', 'home', 'lovers', 'pages']) if (has(k)) cfg[k] = cfgNow[k];
    if (has('whatsapp')) cfg.whatsapp = whatsappNum;
    const seq = { ...((cfg.skuSeq && typeof cfg.skuSeq === 'object') ? cfg.skuSeq : {}) };
    for (const [k, v] of Object.entries(skuSeq || {})) if (!(seq[k] >= v)) seq[k] = v;
    cfg.skuSeq = seq;
    const merged = { ...data, products: result, combos: has('combos') ? combos : (Array.isArray(data.combos) ? data.combos : combos), whatsapp: has('whatsapp') ? whatsappNum : data.whatsapp, config: cfg };
    const oldSnap = snapRef.current, oldCfg = base ? { ...base.cfg } : {};
    applyCatalogData(merged);
    resnapRef.current = false;
    snapRef.current = oldSnap; // los bloques en español que cambié se vuelven a traducir al publicar
    rebaseRef.current = { prods: new Map(freshProds.map(p => [String(p.id), JSON.stringify(p)])), order: freshProds.map(p => String(p.id)), cfgChanged, oldCfg };
    setProductsSha(conf.sha || null);
    setDirty(true);
    setPubConflict(null);
    const n = changed.size + deleted.size + (orderChanged ? 1 : 0) + cfgChanged.length;
    setSyncMsg('✓ Volví a aplicar tus ' + n + ' cambio' + (n === 1 ? '' : 's') + ' sobre la versión más nueva. Revisa y vuelve a publicar.'
      + (both.length ? ' Ojo: la otra persona también cambió ' + both.slice(0, 5).join(', ') + (both.length > 5 ? '…' : '') + ' y quedó tu versión.' : ''));
  };

  // Producto aprobado en "Ingreso por lote": mismo resultado que "Nuevo producto" (código siguiente de su
  // categoría, sin reusar). Usa latestRef para que "Aprobar todo" no repita códigos entre piezas seguidas.
  const createBatchProduct = prod => {
    const cur = latestRef.current;
    let id = Date.now(); while (cur.products.some(x => x.id === id)) id++;
    const prefix = skuPrefixFor(prod.category, cur.products), n = skuMaxNumber(prefix, cur.products, cur.skuSeq) + 1;
    const out = { ...prod, id, sku: formatSku(prefix, n) };
    const seq = { ...cur.skuSeq, [prefix]: Math.max(n, Number.isInteger(cur.skuSeq[prefix]) ? cur.skuSeq[prefix] : 0) };
    latestRef.current = { products: [...cur.products, out], skuSeq: seq };
    setProducts(prev => [...prev, out]); setSkuSeq(seq); setDirty(true);
    return out;
  };
  // Antes de publicar: avisos (no bloquean) de los productos nuevos o cambiados.
  const requestPublish = () => {
    if (syncing) return;
    const base = pubBaseRef.current;
    const pieceItems = _prepLast && Array.isArray(_prepLast.items) && _prepLast.items.some(it => it.piece) ? _prepLast.items : null;
    let items = [];
    try { items = prePublishWarnings({ products, baseProds: base ? base.prods : null, stock, pendingStock, pieceItems }); } catch (e) { console.warn('revisión antes de publicar:', e && e.message); }
    if (items.length) setPrePub(items); else publish();
  };
  const saveProduct = async p => {
    const { surcharge, market, marketEC, marketUS, promoEnabled, promoPrice, promoLabel, promoEndsAt, _stock, _cost, cost: _c1, costCurrency: _c2, ...prodRaw } = p;
    // Stock y costo nunca entran al producto (data/products.json es público).
    const known = products.some(x => x.id === prodRaw.id) && pubBaseRef.current && pubBaseRef.current.prods.has(String(prodRaw.id));
    if (_stock !== undefined) {
      if (known) saveStock(prodRaw.id, _stock).catch(e => setSyncMsg('✕ No se guardó el stock (' + ((e && e.message) || 'error') + ').'));
      else addPendingStock(prodRaw.id, _stock);
    }
    if (_cost !== undefined) apiCall('cost/set', { token: session.token, items: [{ id: String(prodRaw.id), cost: _cost }] }).then(costsSaved).catch(e => setSyncMsg('✕ No se guardó el costo (' + ((e && e.message) || 'error') + ').'));
    // Código de producto: se conserva el que ya tiene (aunque cambie de categoría); una pieza
    // nueva recibe el siguiente número libre de su categoría (máximo existente + 1, nunca reusado).
    let prodData = prodRaw;
    if (SKU_RE.test(normalizeSku(prodRaw.sku))) prodData = { ...prodRaw, sku: normalizeSku(prodRaw.sku) };
    else {
      const others = products.filter(x => x.id !== prodRaw.id);
      const prefix = skuPrefixFor(prodRaw.category, others);
      const n = skuMaxNumber(prefix, others, skuSeq) + 1;
      prodData = { ...prodRaw, sku: formatSku(prefix, n) };
      setSkuSeq(s => ({ ...s, [prefix]: Math.max(n, Number.isInteger(s[prefix]) ? s[prefix] : 0) }));
    }
    setProducts(prev => {
      const i = prev.findIndex(x => x.id === prodData.id);
      return i > -1 ? prev.map((x, j) => j === i ? prodData : x) : [...prev, prodData];
    });
    const newSurcharges = { ...fbSurcharges };
    if (surcharge) newSurcharges[prodData.id] = true;
    else delete newSurcharges[prodData.id];
    setFbSurcharges(newSurcharges);
    const newMarkets = { ...fbMarkets };
    if (market && market !== 'both') newMarkets[prodData.id] = market;
    else delete newMarkets[prodData.id];
    setFbMarkets(newMarkets);
    try {
      await Promise.all([
        apiCall('surcharge/save', { token: session.token, surcharges: newSurcharges }),
        apiCall('market/save',    { token: session.token, markets: newMarkets })
      ]);
    } catch (_) {}
    setDirty(true); setShowModal(false); setEditProd(null);
  };
  // Persiste solo el cambio puntual de UN pedido (nunca el array completo — ver
  // auditoría de concurrencia, antes esto podía perder pedidos nuevos en silencio).
  // 22 oct (auditoría): si un cambio de pedido no se guarda, se avisa (antes solo console.warn y la
  // pantalla mostraba el cambio como si estuviera guardado).
  // Stock (18 nov): se lee del Worker (/stock/list) al entrar y al abrir Productos/Pedidos.
  const loadStock = async () => {
    try { const r = await apiCall('stock/list', { token: session.token }); if (r && r.stock) { setStock(r.stock); flushPendingStock(r.stock); } }
    catch (e) { if (e && e.status === 401) sessionExpired(); else console.warn('stock/list:', e && e.message); }
  };
  const loadCosts = async () => {
    try { const r = await apiCall('cost/list', { token: session.token }); if (r && r.costs) { setCosts(r.costs); if (r.margin) setMargin(r.margin); } }
    catch (e) { console.warn('cost/list:', e && e.message); } // Worker sin /cost/list todavía: el campo sigue, sin datos previos

  const addPendingStock = (id, qty) => setPendingStock(prev => { const n = { ...prev, [String(id)]: qty }; pendingStockWrite(n); return n; });
  const flushingRef = React.useRef(false);
  const flushPendingStock = async listed => {
    const pend = pendingStockRead();
    const ids = Object.keys(pend).filter(id => !listed || id in listed); // /stock/list solo trae los publicados
    if (!ids.length || flushingRef.current) return;
    flushingRef.current = true;
    const done = [];
    for (const id of ids) {
      try { await apiCall('stock/set', { token: session.token, id, qty: pend[id] }); done.push(id); setStock(prev => ({ ...(prev || {}), [id]: pend[id] })); }
      catch (e) { if (e && e.status === 401) break; }
    }
    flushingRef.current = false;
    if (done.length) setPendingStock(prev => { const n = { ...prev }; done.forEach(id => delete n[id]); pendingStockWrite(n); return n; });
  };
  // Wave 1: el stock se guarda como MOVIMIENTO (+2, −1) con /stock/adjust, no como el número que
  // había en pantalla: una venta que entra al mismo tiempo ya no se pierde. opts.delta = cuánto cambió
  // desde el valor que vio la persona; si no viene, contra el stock que el panel conoce. Con un Worker
  // viejo (sin /stock/adjust) cae a /stock/set como antes.
  const saveStock = async (id, qty, opts = {}) => {
    const sid = String(id);
    const delta = Number.isInteger(opts.delta) ? opts.delta : qty - stockOf(stock, sid);
    if (!delta) return qty;
    const body = { token: session.token, items: [{ id: sid, delta, reason: opts.reason || (delta > 0 ? 'Ajuste en el panel (+)' : 'Ajuste en el panel (−)') }], opId: newOpId() };
    try {
      let r;
      try {
        try { r = await apiCall('stock/adjust', body); }
        catch (e) { if (e && e.status) throw e; r = await apiCall('stock/adjust', body); } // corte de red: 1 reintento, mismo opId
      } catch (e) {
        if (!(e && e.status === 404)) throw e;
        await apiCall('stock/set', { token: session.token, id: sid, qty });
        r = { stock: { [sid]: qty } };
      }
      const after = r.stock && Number.isInteger(r.stock[sid]) ? r.stock[sid] : qty;
      setStock(prev => ({ ...(prev || {}), [sid]: after }));
      return after;
    } catch (e) { if (e && e.status === 401) sessionExpired(); throw e; }
  };
  // Wave 1 — cada cambio de pedido manda el updatedAt que la persona tenía en pantalla
  // (baseUpdatedAt). Si otra persona lo cambió mientras tanto, el Worker responde 409 con el pedido
  // actual: se reemplaza la tarjeta y se avisa "Este pedido cambió en otro teléfono". Los cambios de
  // UN mismo pedido van en cola (uno tras otro): si el anterior era nuestro, el siguiente usa la
  // versión que dejó ese cambio (no da un 409 falso por tocar dos cosas seguidas).
  const replaceOrder = o => setOrders(prev => prev.map(x => x.id === o.id ? (x.labelBase64 && !o.labelBase64 ? { ...o, labelBase64: x.labelBase64 } : o) : x));
  const noteOrder = (id, text) => {
    setOrderNotice(n => ({ ...n, [id]: text }));
    setTimeout(() => setOrderNotice(n => { if (n[id] !== text) return n; const c = { ...n }; delete c[id]; return c; }), 12000);
  };
  const sendOrderOp = (ord, body, optimistic) => {
    const id = ord.id, seen = ord.updatedAt || null;
    if (optimistic) setOrders(prev => prev.map(x => x.id === id ? optimistic(x) : x));
    orderBusyRef.current.add(id);
    const run = async () => {
      const vm = orderVerRef.current;
      let base = seen;
      for (let i = 0; i < 50 && vm.has(id + '|' + base); i++) base = vm.get(id + '|' + base);
      try {
        const res = await apiCall('order/update', { token: session.token, id, baseUpdatedAt: base, ...body });
        if (res && res.order) { vm.set(id + '|' + base, res.order.updatedAt || null); replaceOrder(res.order); }
        return res;
      } catch (e) {
        if (e && e.status === 409 && e.data && e.data.order) {
          replaceOrder(e.data.order);
          noteOrder(id, 'Este pedido cambió en otro teléfono. Ya ves cómo quedó; si hace falta, vuelve a hacer tu cambio.');
        } else if (e && e.status === 401) sessionExpired();
        else setSyncMsg('❌ No se guardó el último cambio de un pedido (' + (e && e.message || 'error de red') + '). Recarga los datos y vuelve a intentarlo.');
        throw e;
      }
    };

    const p = (q.get(id) || Promise.resolve()).then(run, run);
    const tail = p.catch(() => {}).then(() => { if (q.get(id) === tail) { q.delete(id); orderBusyRef.current.delete(id); } });
    q.set(id, tail);
    return p;

  const changeOrderState = (ord, newState) => { updateOrderRemote(ord, { estado: newState }); if (newState === 'Cancelado') setTimeout(loadStock, 1500); };
  const archiveOrder = ord => sendOrderOp(ord, { archive: true }, x => ({ ...x, archivado: true, archivedAt: new Date().toISOString() }))

  const restoreOrder = ord => sendOrderOp(ord, { restore: true }, x => { const c = { ...x }; delete c.archivado; delete c.archivedAt; return c; })
    .then(() => setTimeout(loadStock, 1500)).catch(() => {});
  const setPagoEstado = (ord, v) => updateOrderRemote(ord, { pagoEstado: v });
  const applyBulk = (changes, action) => {

    setDirty(true); setShowBulk(false);
    setBulkMsg('✓ ' + changes.length + ' producto' + (changes.length === 1 ? '' : 's') + ' cambiado' + (changes.length === 1 ? '' : 's') + ' en el panel. Revisa y pulsa "☁️ Publicar cambios" para subirlos a la tienda.');
  };
  const toggleProd = p => { setProducts(prev => prev.map(x => x.id === p.id ? { ...x, available: !x.available } : x)); setDirty(true); };
  const deleteProd = p => { setProducts(prev => prev.filter(x => x.id !== p.id)); setDelConfirm(null); setDirty(true); };
  const moveProd = (p, dir) => {
    setProducts(prev => {
      const idx = prev.findIndex(x => x.id === p.id);
      if (dir === 'up' && idx <= 0) return prev;
      if (dir === 'down' && idx >= prev.length - 1) return prev;
      const next = [...prev];
      const swap = dir === 'up' ? idx - 1 : idx + 1;
      [next[idx], next[swap]] = [next[swap], next[idx]];
      return next;
    });
    setDirty(true);
  };

  if (!session) return <LoginScreen onLogin={s => setSession(s)} />;

  const liveOrders = orders.filter(o => !o.archivado); // wave 1: archivados fuera de todo, salvo su vista
  const attention = computeAttention(liveOrders, products, stock);
  const outSet = new Set(attention.outIds), lowSet = new Set(attention.lowIds);
  const filtered = products.filter(p => {
    if (filter !== 'all' && p.category !== filter) return false;
    if (search && !productMatchesSearch(p, search)) return false;
    if (stockFilter === 'out' && !outSet.has(String(p.id))) return false;
    if (stockFilter === 'low' && !lowSet.has(String(p.id))) return false;
    return true;
  });
  const pendingOrders = liveOrders.filter(o => ['Nuevo', 'Confirmado', 'En proceso'].includes(o.estado || 'Nuevo')).length;
  const promoCount = products.filter(p => p.promo && p.promo.price && (!p.promo.endsAt || new Date(p.promo.endsAt) >= new Date())).length + combos.length;
  const navBadge = { orders: pendingOrders, descuentos: promoCount, lovers: loversCount };
  const go = tab => {
    if (tab === '@notif') { setShowMore(false); setShowNtfyModal(true); return; }

  };
  const openNewProduct = () => { setEditProd(null); setShowModal(true); };
  const openEnroll = () => { setEnrollOnly(null); setShowEnroll(true); };
  const homeGo = key => {
    if (key === 'prep') { setOrdersView('active'); setLoteOnly(false); setLoversMissingOnly(false); setPagoPendOnly(false); setHistSearch(''); go('orders'); }
    else if (key === 'cobrar') { setOrdersView('active'); setLoteOnly(false); setLoversMissingOnly(false); setPagoPendOnly(true); setHistSearch(''); go('orders'); }
    else if (key === 'lovers') { setOrdersView('active'); setLoteOnly(false); setLoversMissingOnly(true); setHistSearch(''); go('orders'); }

    else if (key === 'ventas') go('ventas');
    else if (key === 'new') { go('products'); openNewProduct(); }
    else if (key === 'addpiece') {
      setOrdersView('active'); setLoteOnly(false); setLoversMissingOnly(false); setHistSearch('');
      setOrdersHint('Elige el pedido y toca "+ Agregar pieza" para cargarla con la etiqueta QR, el código o una foto. Los pedidos de Lovers y los creados en el panel lo permiten.');
      go('orders');
    }
    else if (key === 'enroll') openEnroll();
    else if (key === 'board') { setOrdersView('board'); setLoversMissingOnly(false); go('orders'); }
  };
  const refsPool = products.filter(p => p.available !== false && productImageUrl(p));
  const refsWith = refCounts ? refsPool.filter(p => refCounts[String(p.id)]).length : null;
  const pillBtn = { minHeight: 44, padding: '0 16px', background: 'white', color: '#5B3F8A', border: '1.5px solid #D9C9EE', borderRadius: 99, fontWeight: 700, fontSize: 13, whiteSpace: 'nowrap', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6 };
  const sideBtn = (tab, label, glyph) => {
    const on = activeTab === tab;
    return (
      <button key={tab} type="button" onClick={() => go(tab)} aria-current={on ? 'page' : undefined}
        style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%', minHeight: 40, padding: '8px 10px', borderRadius: 10, fontSize: 13.5, fontWeight: on ? 800 : 600, color: on ? '#C0336E' : '#3F3346', background: on ? '#FCE7F0' : 'transparent', textAlign: 'left', fontFamily: 'inherit' }}>
        <span aria-hidden="true" style={{ width: 22, display: 'inline-flex', justifyContent: 'center', color: on ? '#C0336E' : '#9A8AA3', fontSize: 15 }}>{typeof glyph === 'string' ? glyph : glyph}</span>
        <span style={{ flex: 1, minWidth: 0 }}>{label}</span>
        <NavBadge n={navBadge[tab]} active={on} light />
      </button>
    );
  };
  const viewToggle = (
    <div role="group" aria-label="Vista de productos" style={{ display: 'inline-flex', background: '#F3EFF5', borderRadius: 12, padding: 3, flexShrink: 0 }}>
      {[['list', 'Lista'], ['grid', 'Cuadrícula']].map(([v, l]) => (
        <button key={v} type="button" onClick={() => setProdView(v)} aria-pressed={prodView === v} aria-label={l} title={l}
          style={{ minHeight: 38, minWidth: 44, padding: isMobile ? '0 10px' : '0 12px', borderRadius: 9, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6, fontSize: 13, fontWeight: 700,
            background: prodView === v ? 'white' : 'transparent', color: prodView === v ? '#C0336E' : '#7A6880', boxShadow: prodView === v ? '0 1px 4px rgba(0,0,0,.1)' : 'none' }}>
          <NavIcon name={v} size={18} />{!isMobile && <span aria-hidden="true">{l}</span>}
        </button>
      ))}
    </div>

  const toolsBtn = (
    <button type="button" onClick={() => setShowTools(true)} aria-haspopup="dialog" aria-expanded={showTools} data-testid="toolsBtn" style={{ ...pillBtn, flexShrink: 0 }}>
      <NavIcon name="tools" size={18} />Herramientas

  return (
    <div style={{ minHeight: '100vh', background: '#F0EFF5' }} onClick={() => showMenu && setShowMenu(false)}>

        <div style={{ fontFamily: 'Georgia,serif', fontWeight: 900, fontSize: 20, letterSpacing: '.15em', background: 'linear-gradient(135deg,#E85D8A,#C9A84C)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>CACUSA</div>
        <div style={{ color: 'rgba(255,255,255,.45)', fontSize: 12 }}>{isMobile ? (NAV_LABEL[activeTab] || '') : '/admin'}</div>

        <button onClick={e => { e.stopPropagation(); setShowMenu(s => !s); }} aria-label="Menú de la cuenta" aria-expanded={showMenu}

          onClick={e => e.stopPropagation()}>

      {/* ── Navegación del teléfono: barra inferior fija (va antes del contenido en el DOM) ── */}
      {isMobile && (
        <nav aria-label="Secciones del panel" data-testid="bottomNav"

          {[...NAV_PRIMARY, ['@more', 'Más']].map(([t, l]) => {

                {...(isMore ? { 'aria-haspopup': 'dialog', 'aria-expanded': showMore } : {})}
                style={{ flex: 1, minWidth: 0, minHeight: 58, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 2, color: on ? '#C0336E' : '#7A6880', fontSize: 11, fontWeight: on ? 800 : 600, fontFamily: 'inherit', position: 'relative' }}>
