                          </div>
                          <div>
                            <label htmlFor={'bk' + g.id} style={lbl}>Costo (opcional)</label>
                            <input id={'bk' + g.id} data-testid="groupCost" type="number" inputMode="decimal" min={0} step="0.01" value={g.cost} onChange={e => setGroup(g.id, { cost: e.target.value })} style={inp} />
                          </div>
                          {(g.nbPrice || costPrice) && (
                            <div data-testid="groupPriceHints" style={{ gridColumn: 'span 2', display: 'flex', gap: 6, flexWrap: 'wrap', fontSize: 12 }}>
                              <span style={{ color: '#7A6880' }}>Sugerencias:</span>
                              {g.nbPrice ? <button type="button" onClick={() => setField(g.id, 'price', String(g.nbPrice))} style={{ ...pill, minHeight: 32, fontSize: 12 }}>Parecidas: ${g.nbPrice}</button> : null}
                              {costPrice ? <button type="button" data-testid="costPriceHint" onClick={() => setField(g.id, 'price', String(costPrice))} style={{ ...pill, minHeight: 32, fontSize: 12 }}>Costo × {margin || MARGIN_DEFAULT}: ${costPrice}</button> : null}
                            </div>
                          )}
                          {g.neighbors.length > 0 && <div style={{ gridColumn: 'span 2', fontSize: 11, color: '#5B4A63', display: 'flex', gap: 4, alignItems: 'center', flexWrap: 'wrap' }}>Se parece a: {g.neighbors.map(nb => <span key={nb.id} style={{ display: 'inline-flex', alignItems: 'center', gap: 3 }}>{nb.img ? <ZoomImg src={nb.img} title={nb.sku} style={{ width: 24, height: 24, borderRadius: 5, objectFit: 'cover' }} /> : null}<b style={{ fontFamily: 'ui-monospace, Menlo, monospace', color: '#5B3F8A' }}>{nb.sku}</b></span>)}</div>}
                          <details style={{ gridColumn: 'span 2', background: '#FAF7FB', borderRadius: 10, padding: '6px 10px' }}>
                            <summary style={{ fontSize: 12, fontWeight: 700, color: '#7A6880', cursor: 'pointer', minHeight: 28 }}>Descripción y textos en inglés</summary>
                            <label htmlFor={'bd' + g.id} style={{ ...lbl, marginTop: 8 }}>Descripción<Tag g={g} k="description" /></label>
                            <textarea id={'bd' + g.id} rows={3} value={g.fields.description} onChange={e => setField(g.id, 'description', e.target.value)} style={{ ...inp, resize: 'vertical' }} />
                            <label htmlFor={'bne' + g.id} style={{ ...lbl, marginTop: 8 }}>Nombre en inglés<Tag g={g} k="name_en" /></label>
                            <input id={'bne' + g.id} value={g.fields.name_en} onChange={e => setField(g.id, 'name_en', e.target.value)} style={inp} />
                            <label htmlFor={'bde' + g.id} style={{ ...lbl, marginTop: 8 }}>Descripción en inglés<Tag g={g} k="description_en" /></label>
                            <textarea id={'bde' + g.id} rows={3} value={g.fields.description_en} onChange={e => setField(g.id, 'description_en', e.target.value)} style={{ ...inp, resize: 'vertical' }} />
                          </details>
                        </div>
                      )}
                      {g.action === 'stock' && (
                        <div style={{ marginTop: 10 }}>
                          <label htmlFor={'bk' + g.id} style={lbl}>Costo (privado, opcional)</label>
                          <input id={'bk' + g.id} data-testid="groupCost" type="number" inputMode="decimal" min={0} step="0.01" value={g.cost} onChange={e => setGroup(g.id, { cost: e.target.value })} style={{ ...inp, maxWidth: 160 }} />
                        </div>
                      )}
                      <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', flexWrap: 'wrap', marginTop: 10 }}>
                        <div>
                          <label htmlFor={'bq' + g.id} style={lbl}>{g.action === 'stock' ? 'Unidades a sumar' : 'Cantidad (stock)'}</label>
                          <input id={'bq' + g.id} data-testid="groupQty" type="number" inputMode="numeric" min={g.action === 'stock' ? 1 : 0} max={9999} value={g.qty} onChange={e => setGroup(g.id, { qty: e.target.value === '' ? '' : Number(e.target.value), qtyTouched: true })} style={{ ...inp, width: 100 }} />
                        </div>
                        <CountPhotoButton token={token} small hint={groupLabel(g)} testid="groupCount" onUse={n => setGroup(g.id, { qty: g.action === 'stock' ? Math.max(1, n) : n, qtyTouched: true })} />
                      </div>
                      {others.length > 0 && (
                        <div style={{ marginTop: 8 }}>
                          <label htmlFor={'mg' + g.id} style={SR_ONLY}>Unir esta pieza con</label>
                          <select id={'mg' + g.id} data-testid="mergeGroup" value="" onChange={e => e.target.value && mergeInto(g.id, e.target.value)} style={{ fontSize: 12.5, padding: '6px 8px', borderRadius: 8, border: '1px solid #E5DDEA', background: 'white' }}>
                            <option value="">Unir con otra pieza…</option>
                            {others.map(o => <option key={o.id} value={o.id}>Pieza {groups.indexOf(o) + 1}{groupLabel(o) ? ': ' + groupLabel(o) : ''}</option>)}
                          </select>
                        </div>
                      )}
                      {g.err && <div role="alert" data-testid="groupErr" style={{ fontSize: 12.5, color: '#B91C1C', marginTop: 6 }}>{g.err}</div>}
                      <button type="button" data-testid="groupApprove" onClick={() => approve(g.id)} disabled={g.status === 'saving' || busyAll}
                        style={{ width: '100%', minHeight: 46, marginTop: 10, borderRadius: 99, border: 'none', background: 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', fontWeight: 800, fontSize: 14, opacity: g.status === 'saving' ? .7 : 1 }}>
                        {g.status === 'saving' ? (g.result || 'Guardando…') : g.action === 'stock' ? `✓ Aprobar: sumar ${Number(g.qty) || 0} al stock` : '✓ Aprobar y crear producto'}
                      </button>
                    </>
                  )}
                </li>
              );
            })}
          </ol>
          <div style={{ position: 'sticky', bottom: 0, background: 'white', paddingTop: 10, marginTop: 10, borderTop: '1px solid #F0E8F4' }}>
            {msg && <div role="status" aria-live="polite" data-testid="batchMsg" style={{ fontSize: 12.5, color: msg.startsWith('✓') ? '#065F46' : '#92400E', marginBottom: 8 }}>{msg}</div>}
            <button type="button" data-testid="batchApproveAll" onClick={approveAll} disabled={busyAll || !pending.length}
              style={{ width: '100%', minHeight: 50, borderRadius: 99, border: 'none', background: pending.length ? 'linear-gradient(135deg,#E8508A,#9B5DE5)' : '#C9B8D3', color: 'white', fontWeight: 800, fontSize: 15 }}>
              {busyAll ? 'Aprobando…' : pending.length ? `✓ Aprobar todo (${pending.length})` : '✓ Todo aprobado'}
            </button>
          </div>
        </div>
      )}
    </Modal>
  );
}

function ProductModal({ product, onSave, onClose, token, categories, materials, fbSurcharges = {}, fbMarkets = {}, allProducts = [], skuSeq = {}, onEnroll, onDupStock, stockQty, costInfo, margin }) {
  const refCountsPM = useRefCounts(token);
  const cats = (categories && categories.length) ? categories : DEFAULT_CATEGORIES;
  const mats = (materials && materials.length) ? materials : DEFAULT_MATERIALS;
  const isNew = !product?.id;
  const initMkt = product ? (fbMarkets[product.id] || 'both') : 'both';
  const blank = { name: '', name_en: '', category: cats[0], price: '', oldPrice: '', img: 'collar', color: 'rose', tag: '', description: '', description_en: '', personalized: false, available: true, imageUrl: '', focalX: 50, focalY: 50, zoom: 1, material: mats[0], surcharge: false, marketEC: true, marketUS: true, promoEnabled: false, promoPrice: '', promoLabel: 'Oferta', promoEndsAt: '', images: [] };
  const [form, setForm] = useState(product
    ? { ...product, images: product.images || [], tag: product.tag || '', oldPrice: product.oldPrice || '', surcharge: !!fbSurcharges[product.id], marketEC: initMkt !== 'us', marketUS: initMkt !== 'ec', promoEnabled: !!(product.promo && product.promo.price), promoPrice: (product.promo && product.promo.price) || '', promoLabel: (product.promo && product.promo.label) || 'Oferta', promoEndsAt: (product.promo && product.promo.endsAt) || '' }
    : blank);
  const [imgPrev, setImgPrev] = useState(product?.imageUrl || '');
  // Subir una foto NO guarda el producto — hay que pulsar "Guardar Cambios".
  // Si se cierra el modal despues de subir sin guardar, la foto queda huerfana
  // en el repo y el producto sigue con la foto vieja. Avisar antes de cerrar.
  const _origImageUrl = useRef(product?.imageUrl || '');
  const _origImages   = useRef(JSON.stringify(product?.images || []));
  const confirmClose = () => {
    const fotoNueva    = form.imageUrl !== _origImageUrl.current;
    const galeriaNueva = JSON.stringify(form.images || []) !== _origImages.current;
    if ((fotoNueva || galeriaNueva) &&
        !confirm('Subiste una foto nueva pero no guardaste el producto (💾 Guardar Cambios).\n\nSi cierras ahora, el producto se queda con la foto anterior.\n\n¿Cerrar sin guardar?')) {
      return;
    }
    onClose();
  };
  const [uploading, setUploading] = useState(false);
  const [uploadMsg, setUploadMsg] = useState('');
  const [dragOver, setDragOver] = useState(false);
  const [photoAdjust, setPhotoAdjust] = useState(false); // "Ajustar encuadre" sobre la misma vista previa
  const [translating, setTranslating] = useState(false);
  const [translateWarn, setTranslateWarn] = useState('');
  const fileRef = useRef();
  const galleryFileRef = useRef();
  const nameEnRef = useRef();
  const descEnRef = useRef();
  // Lo que la usuaria escribe o elige a mano nunca lo pisa "Sugerir datos desde la foto".
  const touched = useRef(new Set());
  const [sugTags, setSugTags] = useState({}); // campo → 'ia' | 'local' (etiqueta "sugerido")
  const [sugBusy, setSugBusy] = useState(false);
  const [sugInfo, setSugInfo] = useState(null); // { neighbors: [{ id, sku, name, img }], note }
  const [sugPhase, setSugPhase] = useState(''); // texto de avance mientras sugiere
  const [sugPrice, setSugPrice] = useState(null); // precio de las parecidas (para la sugerencia junto al precio)
  // Stock y costo (27 nov): no van en data/products.json. El stock va al Worker (/stock/set; si la pieza
  // es nueva, queda pendiente hasta publicar) y el costo, privado, a /cost/set. Ambos opcionales.
  const initStock = Number.isInteger(stockQty) ? stockQty : STOCK_DEFAULT;
  const [stockDraft, setStockDraft] = useState(String(initStock));
  const initCost = costInfo && Number.isFinite(costInfo.cost) ? String(costInfo.cost) : '';
  const [costDraft, setCostDraft] = useState(initCost);
  const [qWarn, setQWarn] = useState(null); // aviso de calidad de la foto recién elegida
  const [dictNote, setDictNote] = useState('');
  // Al abrir "Nuevo producto" se precarga el reconocimiento en segundo plano (misma precarga que
  // Pedidos: una vez por sesión, nunca con Ahorro de datos), así "Sugerir datos" responde rápido.
  useEffect(() => { if (isNew) prewarmRecognition(allProducts); }, []);
  // ── ¿Ya existe? (25 nov) ── Al subir la foto de un producto NUEVO se compara en segundo plano con
  // el catálogo (huella v3). Umbrales (ver README): ≥ DUP_HIGH "Parece que este producto ya existe";
  // ≥ DUP_MEDIUM "Se parece a estos productos" (hasta 3). Nunca suma stock solo: siempre un toque.
  const photoQRef = useRef(null);            // { src, q, img }: huella de la foto subida (la reusa "Sugerir datos")
  const dupDismissed = useRef(new Set());    // fotos para las que ya se dijo "No, es otro producto"
  const [dup, setDup] = useState(null);      // { status: checking|done|error, level, cands, idx, stock, qty, busy, err }
  const photoQuery = async src => {
    if (photoQRef.current && photoQRef.current.src === src) return photoQRef.current;
    const img = /^(blob:|data:)/.test(src) ? await loadImg(src, false) : await loadCatalogImg(src);
    const eng = await loadRecognitionModel();
    const r = eng.kind === 'v3' ? await embedV3Both(eng, img, null) : null;
    const emb = r ? r.all : await embedPhoto(eng, img, 'base');
    const q = { emb, embRef: r ? r.ref : null, color: colorDescriptor(img), kind: eng.kind, cw: eng.cw, margin: eng.margin, pct: eng.pct };
    // Huella solo de la pieza (similitud sin el fondo; la usan "¿ya existe?" y "Sugerir datos").
    if (pieceAvailable(eng)) { try { const pe = await embedPiece(eng, img); q.piece = pe.emb; q.pieceOk = pe.ok; } catch (e) { console.warn('pieza:', e && e.message); } }
    photoQRef.current = { src, q, img };
    return photoQRef.current;
  };
  useEffect(() => {
    if (!isNew || !imgPrev || uploading || dupDismissed.current.has(imgPrev)) { if (!imgPrev) setDup(null); return; }
    let alive = true;
    setDup({ status: 'checking' });
    (async () => {
      const cat = await prepareCatalogShared(allProducts);
      const { q } = await photoQuery(imgPrev);
      const ranked = await dupCandidates(q, cat.items);
      if (!alive) return;
      const top = ranked.length ? ranked[0].score : -1;
      const level = top >= DUP_HIGH ? 'high' : top >= DUP_MEDIUM ? 'medium' : null;
      const cands = level === 'high' ? ranked.filter(r => r.score >= DUP_HIGH).slice(0, 3) : ranked.filter(r => r.score >= DUP_MEDIUM).slice(0, 3);
      if (!level) { setDup({ status: 'done', level: null }); return; }
      let stock = null; try { const r = await apiCall('stock/list', { token }); stock = (r && r.stock) || {}; } catch (_) {}
      if (alive) setDup({ status: 'done', level, cands, idx: 0, stock, qty: 1 });
    })().catch(e => { if (alive) setDup({ status: 'error' }); console.warn('¿ya existe?:', e && e.message); });
    return () => { alive = false; };
  }, [imgPrev, uploading]);
  // Aviso de calidad (27 nov, gratis): movida, oscura, quemada o pieza muy chica. No bloquea.
  useEffect(() => {

  const dupConfirm = async () => {

      const mv = await stockAddRelative(token, c.p.id, dup.qty, 'Ingreso (pieza repetida)');
      const cur = mv.from != null ? mv.from : stockOf(dup.stock, c.p.id), next = mv.to != null ? mv.to : cur + dup.qty;

  const set = (k, v) => {
    touched.current.add(k);

  const SugTag = ({ k }) => sugTags[k] ? <span data-testid={'sug-' + k} style={{ marginLeft: 6, fontSize: 10, fontWeight: 700, color: '#7C3AED', background: '#F1EAFB', borderRadius: 99, padding: '1px 7px', textTransform: 'none', letterSpacing: 0 }}>{sugTags[k] === 'ia' ? 'sugerido (IA)' : 'sugerido'}</span> : null;
  // ✦ Sugerir datos desde la foto (v2.5): 1) parte gratis local (piezas parecidas → categoría,

  const suggestFromPhoto = async () => {
    if (sugBusy || !imgPrev) return;

    try {
      const img = /^(blob:|data:)/.test(imgPrev) ? await loadImg(imgPrev, false) : await loadCatalogImg(form.imageUrl || imgPrev);

      if (!q.piece && pieceAvailable(eng)) { try { q.piece = (await embedPiece(eng, img)).emb; } catch (_) {} }
      if (q.piece) await preparePieceItems(cat.items).catch(() => false); // items es un filtro de cat.items: comparten it.piece
      const core = await suggestCore({ img, q, items, cats, mats, token, onPhase: setSugPhase });
      const { sug, close, hasClose, ai, catAi, matAi, category, material } = core;
      let note = core.note;
      setSugPrice(hasClose && sug.price ? sug.price : null);

      const tpl = templateProductText(sug, touched.current.has('category') ? form.category : category, touched.current.has('material') ? form.material : material);
      const text = k2 => (ai && String(ai[k2] || '').trim()) ? [String(ai[k2]).trim(), 'ia'] : [tpl[k2], 'local'];
      const tags = {};
      setForm(f => {
        const n = { ...f };
        const fill = (k2, v, tag, isEmpty) => { if (v == null || v === '' || touched.current.has(k2) || !isEmpty) return; n[k2] = v; tags[k2] = tag; };
        for (const k2 of ['name', 'name_en', 'description', 'description_en']) { const [v, tag] = text(k2); fill(k2, v, tag, !String(f[k2] || '').trim()); }

        if (mats.includes(material)) fill('material', material, matAi ? 'ia' : 'local', true);
        if (hasClose && sug.price) fill('price', String(sug.price), 'local', String(f.price ?? '').trim() === '');
        if (hasClose && sug.color && COLORS[sug.color]) fill('color', sug.color, 'local', true);
        if (!touched.current.has('personalized')) n.personalized = false;
        return n;
      });
      setTimeout(() => setSugTags(t => ({ ...t, ...tags })), 0);
      if (!hasClose) note = (note ? note + '. ' : '') + 'No encontré piezas parecidas en tu catálogo (diseño nuevo): revisa el precio';
      setSugInfo({ note, neighbors: close.slice(0, 3).map(x => ({ id: String(x.p.id), sku: normalizeSku(x.p.sku) || x.p.name, name: x.p.name, img: productImageUrl(x.p) })) });

  const uploadFile = async file => {

  // Wave 1: las reseñas se leen y moderan por el Worker con sesión (/reviews/list, /reviews/moderate),

  const [revErr, setRevErr] = React.useState('');

          const data = res.ok ? await res.json() : null;
          setReviews(data && typeof data === 'object' && !data.error ? Object.entries(data).map(([key, val]) => ({ key, ...val })) : []);
        } catch (_) { setReviews([]); setRevErr('No se pudieron cargar las reseñas.'); }

    catch (e) {

  const save = async () => {
    if (!form.name.trim() || !form.price || !stockOk || !costOk) return;
    setTranslateWarn('');
    let name_en = (form.name_en || '').trim();
    let description_en = (form.description_en || '').trim();

      ...form,

      description_en,
      id: form.id || Date.now(),
      price: Number(form.price),
      oldPrice: form.oldPrice ? Number(form.oldPrice) : null,

      market,
      promo,

  const inp = { padding: '10px 13px', border: '1.5px solid #e4e4e4', borderRadius: 10, fontSize: 14, outline: 'none', width: '100%', boxSizing: 'border-box', background: 'white' };

          {!uploadMsg && <div style={{ fontSize: 11, color: '#767676', marginTop: 6 }}>{imgPrev ? 'Así se verá en la tarjeta de la tienda. ' : ''}La foto se optimiza automáticamente para cargar rápido en la tienda.</div>}
          {imgPrev && !uploading && qWarn && <QualityWarn issues={qWarn.issues} onRetake={() => fileRef.current.click()} />}
          {isNew && imgPrev && !uploading && dup && dup.status === 'checking' && <div role="status" aria-live="polite" data-testid="dupChecking" style={{ fontSize: 11, color: '#7A6880', marginTop: 8 }}>Revisando si ya existe…</div>}
          {isNew && imgPrev && !uploading && dup && dup.status === 'done' && dup.level && (() => {
            const c = dup.cands[dup.idx], gal = (c.p.images || []).filter(u => typeof u === 'string' && /^https:/.test(u)).slice(0, 3), cur = stockOf(dup.stock, c.p.id);
            return (
              <div role="alert" data-testid="dupAlert" data-level={dup.level} style={{ marginTop: 10, background: dup.level === 'high' ? '#FFF7ED' : '#F7F3FA', border: '1.5px solid ' + (dup.level === 'high' ? '#FDBA74' : '#E2D4F5'), borderRadius: 12, padding: 12 }}>
                <div style={{ fontWeight: 800, fontSize: 14, color: '#1A1118', marginBottom: 8 }}>

                  {dup.cands.length > 1 && <span style={{ fontWeight: 600, fontSize: 12, color: '#7A6880' }}> ({dup.idx + 1} de {dup.cands.length})</span>}

                    <button onClick={() => deleteReview(r.key)}
                      style={{ padding: '4px 10px', borderRadius: 8, border: '1.5px solid #FFB3C1', background: 'white', color: '#DC2626', fontSize: 11, fontWeight: 600, cursor: 'pointer' }}>

        <div style={{ display: 'flex', gap: 10 }}>
          <button onClick={confirmClose} style={{ flex: 1, padding: 13, border: '1.5px solid #ddd', borderRadius: 99, color: '#666', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>Cancelar</button>

// ── Quagga2 loader (para escaneo de códigos de barra lineales en iOS) ─────────
let _quaggaPromise = null;
function loadQuagga() {
  if (_quaggaPromise) return _quaggaPromise;
  _quaggaPromise = new Promise((resolve, reject) => {
    const existing = window.Quagga?.default ?? window.Quagga;
    if (existing?.decodeSingle) { resolve(existing); return; }
    const s = document.createElement('script');
    // Versión fijada + SRI para evitar manipulación de la cadena de suministro (jsdelivr)
    s.src = 'https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js';
    s.integrity = 'sha384-IkRTkdAeAAAqE2ct5zNAfMiX8+H35pGJp8j7+ZFwh7PKaJh5eunsOFAb9l6Z9R7r';
    s.crossOrigin = 'anonymous';
    s.onload = () => {
      const Q = window.Quagga?.default ?? window.Quagga;
      Q?.decodeSingle ? resolve(Q) : reject(new Error('Quagga API not found'));
    };
    s.onerror = () => reject(new Error('Quagga failed to load'));
    document.head.appendChild(s);
  });
  return _quaggaPromise;
}

// Avisos de USPS a la clienta (22 oct): el servidor los registra solo al quedar el pedido con
// tracking de USPS y correo válido; acá se ve el estado y se puede reintentar si quedó pendiente.
function UspsNotifyStatus({ order, token }) {
  const [state, setState] = React.useState(order.uspsNotify || null);
  const [busy, setBusy] = React.useState(false);
  React.useEffect(() => { setState(order.uspsNotify || null); }, [order.uspsNotify && order.uspsNotify.at, order.tracking]);
  const tn = String(order.tracking || '').replace(/\s+/g, '');
  const carrierUp = String(order.carrier || '').trim().toUpperCase();
  if (!tn || !(carrierUp === 'USPS' || (!carrierUp && /^9\d{19,21}$/.test(tn)))) return null;
  const email = String((order.cliente && order.cliente.email) || '').trim();
  const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const cur = state && state.for === tn ? state : null;
  const retry = async () => {
    setBusy(true);
    try { const d = await apiCall('order/usps-notify', { token, orderId: order.id }); setState(d.uspsNotify || null); }
    catch (e) { setState({ for: tn, status: 'error', msg: e.message }); }
    finally { setBusy(false); }
  };
  let text, color = '#7A6B85', canRetry = false;
  if (!valid) text = 'Avisos de USPS: el pedido no tiene correo de la clienta.';
  else if (!cur) { text = 'Avisos de USPS: activándose…'; canRetry = true; }
  else if (cur.status === 'activo') { text = `✓ USPS le avisa a ${email} (fecha de entrega y entrega).`; color = '#166534'; }
  else if (cur.status === 'pendiente') { text = /tope diario/.test(cur.msg || '') ? 'Avisos de USPS: pendientes (se llegó al tope diario de avisos automáticos).' : 'Avisos de USPS: pendientes (USPS todavía no tenía el número). Toca "Activar ahora" más tarde.'; canRetry = true; }
  else if (cur.status === 'omitido') { text = 'Avisos de USPS: no activados (tracking de antes del 21 oct).'; canRetry = true; }
  else { text = 'Avisos de USPS: no se pudieron activar.'; color = '#B91C1C'; canRetry = true; }
  return (
    <div style={{ marginTop: 6, fontSize: 11, color, display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }} title={cur && cur.msg ? cur.msg : ''}>
      <span>{text}</span>
      {valid && canRetry && (
        <button type="button" onClick={retry} disabled={busy}
          style={{ padding: '3px 10px', fontSize: 11, fontWeight: 700, background: '#F3EFF5', color: '#5B4A63', border: 'none', borderRadius: 99, cursor: busy ? 'default' : 'pointer' }}>
          {busy ? 'Activando…' : 'Activar ahora'}
        </button>
      )}
    </div>
  );
}

// Botón "Pedir recolección de hoy" (Carrier Pickup) — no está atado a un pedido
// puntual (el cartero pasa una vez por la dirección y se lleva TODO lo que esté listo
// ese día), a diferencia de la cotización USPS, que sí es por pedido. El servidor ya
// es idempotente por fecha (apretar 2 veces el mismo día devuelve la misma
// confirmación), así que acá no hace falta ningún guard extra del lado del cliente.
function PickupTodayButton({ token }) {
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState(null);
  // 21 oct (pickup-3): primero pregunta qué pedidos de hoy tienen tracking de USPS (incluidos los
  // de Click-N-Ship), los muestra para confirmar y recién ahí pide la recolección.
  const request = async () => {
    setBusy(true); setMsg(null);
    try {
      const pre = await apiCall('usps/schedule-pickup', { token, preview: true });
      if (pre.alreadyRequested) {
        setMsg({ ok: true, text: `Ya se pidió la recolección de hoy — confirmación #${pre.confirmationNumber} (${pre.packageCount} paquete${pre.packageCount !== 1 ? 's' : ''}, ${pre.pickupDate}).` });
        return;
      }
      // pickup-3: solo los pedidos del panel (tienda web + manuales); la cantidad no se edita.
      if (!pre.detected) { setMsg({ ok: false, text: 'No hay pedidos de hoy con tracking de USPS en el panel. Pega el tracking en los pedidos primero.' }); return; }
      const n = pre.detected;
      if (!window.confirm(`Pedir recolección USPS de ${n} paquete${n !== 1 ? 's' : ''} (el cartero toca la puerta y se los lleva):\n\n• ${(pre.clientas || []).join('\n• ')}\n\nNo la pidas también en Click-N-Ship.`)) return;
      const data = await apiCall('usps/schedule-pickup', { token });
      setMsg({
        ok: true,
        text: data.alreadyRequested
          ? `Ya se había pedido la recolección de hoy — confirmación #${data.confirmationNumber}.`
          : `Recolección pedida para ${data.pickupDate} — confirmación #${data.confirmationNumber} (${data.packageCount} paquete${data.packageCount !== 1 ? 's' : ''}).`,
      });
    } catch (e) {
      setMsg({ ok: false, text: e.message || 'No se pudo pedir la recolección.' });
    } finally {
      setBusy(false);
    }
  };
  return (
    <div>
      <button onClick={request} disabled={busy}
        style={{ padding: '10px 20px', background: '#F3EFF5', color: '#5B4A63', borderRadius: 99, fontWeight: 700, fontSize: 13, border: 'none', cursor: busy ? 'default' : 'pointer', opacity: busy ? .7 : 1 }}>
        {busy ? 'Pidiendo…' : '📬 Pedir recolección de hoy'}
      </button>
      {msg && (
        <div role={msg.ok ? 'status' : 'alert'} aria-live={msg.ok ? 'polite' : 'assertive'}
          style={{ marginTop: 8, fontSize: 12, color: msg.ok ? '#166534' : '#DC2626', maxWidth: 260 }}>
          {msg.text}
        </div>
      )}
    </div>
  );
}

// Click-N-Ship en lote (26 oct): si la API de USPS sale más cara, se exportan los pedidos
// pendientes a EE.UU. en el CSV de "Import Batch of Labels" (lo arma el Worker, que tiene la
// dirección de remitente) y, ya hechas las guías allá, se importa el CSV que baja Click-N-Ship
// para pegar cada tracking en su pedido (cruce por Reference ID = id del pedido).
function parseCsv(text) {
  const rows = []; let row = [], cur = '', q = false;
  const s = String(text || '').replace(/^﻿/, '');
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) {
      if (ch === '"') { if (s[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && s[i + 1] === '\n') i++;
      row.push(cur); cur = '';
      if (row.some(c => c.trim())) rows.push(row);
      row = [];
    } else cur += ch;
  }
  row.push(cur);
  if (row.some(c => c.trim())) rows.push(row);
  return rows;
}
// Filas del CSV de Click-N-Ship → { ref, tracking }. Busca las columnas por nombre (la del
// tracking contiene "tracking"; la de la referencia es "Reference ID"/"Reference Number", no la 2).
function cnsTrackingRows(text) {
  const rows = parseCsv(text);
  const hi = rows.findIndex(r => r.some(c => /tracking/i.test(c)) && r.some(c => /reference/i.test(c)));
  if (hi < 0) throw new Error('No encontré las columnas de referencia y tracking en ese archivo.');
  const H = rows[hi].map(c => c.trim());
  const ti = H.findIndex(c => /tracking/i.test(c));
  const ri = H.findIndex(c => /reference/i.test(c) && !/2/.test(c));
  if (ri < 0) throw new Error('No encontré la columna "Reference ID" en ese archivo.');
  return rows.slice(hi + 1).map(r => ({ ref: String(r[ri] || '').trim(), tracking: String(r[ti] || '').replace(/\s+/g, '') })).filter(r => r.ref || r.tracking);
}
function ClickNShipTools({ token, uspsDefault, orders, onImported }) {
  const [exp, setExp] = React.useState(null);   // { orders, sel, pkg, insured }
  const [imp, setImp] = React.useState(null);   // { matches, unmatched, conflicts, markSent }
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState(null);
  const fileRef = React.useRef(null);
  const def = uspsDefault || DEFAULT_SHIPPING.uspsDefaultPackage;

  const openExport = async () => {
    setBusy(true); setMsg(null);
    try {
      const pre = await apiCall('order/cns-export', { token, preview: true });
      if (!pre.orders.length) { setMsg({ ok: false, text: 'No hay pedidos a EE.UU. pendientes de guía.' }); return; }

    } catch (e) { setMsg({ ok: false, text: e.message || 'No se pudo leer los pedidos.' }); }
    finally { setBusy(false); }
  };
  const doExport = async () => {
    const ids = exp.orders.filter(o => exp.sel[o.id]).map(o => o.id);
    setBusy(true); setMsg(null);
    try {
      const data = await apiCall('order/cns-export', { token, ids, ...exp.pkg, insuredValue: exp.insured });

      const a = document.createElement('a'); a.href = url; a.download = data.filename; document.body.appendChild(a); a.click(); a.remove();

      setExp(null);
      setMsg({ ok: true, text: `Archivo listo: ${data.count} envío${data.count !== 1 ? 's' : ''}. Súbelo en Click-N-Ship → Import Batch of Labels (sin abrirlo en Excel).` });
    } catch (e) { setMsg({ ok: false, text: e.message || 'No se pudo armar el archivo.' }); }
    finally { setBusy(false); }
  };
  const onFile = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';

    try {
      const rows = cnsTrackingRows(await f.text());
      const byId = new Map(orders.map(o => [String(o.id), o]));
      const matches = [], unmatched = [], conflicts = [];
      const seen = new Set();
      for (const r of rows) {
        const o = byId.get(r.ref);
        if (!o) { unmatched.push(r.ref || '(sin referencia)'); continue; }
        if (seen.has(r.ref)) continue;
        if (!/^\d{20,34}$/.test(r.tracking)) { conflicts.push(`#${o.numero || o.id}: tracking "${r.tracking.slice(0, 30)}" no válido${/e\+/i.test(r.tracking) ? ' (el archivo pasó por Excel; usa el original)' : ''}`); continue; }
        const cur = String(o.tracking || '').replace(/\s+/g, '');
        if (cur === r.tracking) continue;
        if (cur) { conflicts.push(`#${o.numero || o.id}: ya tiene otro tracking (${cur})`); continue; }
        seen.add(r.ref);
        matches.push({ order: o, tracking: r.tracking });
      }
      if (!matches.length && !conflicts.length) { setMsg({ ok: false, text: unmatched.length ? `Ninguna fila coincide con un pedido del panel (${unmatched.length} sin match).` : 'No hay trackings nuevos en ese archivo.' }); return; }
      setImp({ matches, unmatched, conflicts, markSent: true });
    } catch (err) { setMsg({ ok: false, text: err.message || 'No se pudo leer el archivo.' }); }
  };
  const doImport = () => {
    imp.matches.forEach(m => onImported(m.order, m.tracking, imp.markSent));
    setMsg({ ok: true, text: `Trackings pegados en ${imp.matches.length} pedido${imp.matches.length !== 1 ? 's' : ''}.` });

  const nSel = exp ? exp.orders.filter(o => exp.sel[o.id]).length : 0;

    <div>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>

        <button onClick={() => fileRef.current && fileRef.current.click()} disabled={busy} style={btn}>⬆ Importar trackings</button>
        <label htmlFor="cnsImportFile" style={{ position: 'absolute', width: 1, height: 1, overflow: 'hidden', clip: 'rect(0,0,0,0)' }}>Archivo CSV de Click-N-Ship</label>
        <input id="cnsImportFile" ref={fileRef} type="file" accept=".csv,text/csv" onChange={onFile} style={{ display: 'none' }} />
      </div>
      {msg && (
        <div role={msg.ok ? 'status' : 'alert'} aria-live={msg.ok ? 'polite' : 'assertive'}
          style={{ marginTop: 8, fontSize: 12, color: msg.ok ? '#166534' : '#DC2626', maxWidth: 320 }}>{msg.text}</div>
      )}

      {exp && (
        <Modal onClose={() => !busy && setExp(null)} label="Exportar envíos para Click-N-Ship" boxStyle={{ maxWidth: 520, maxHeight: '88vh', overflowY: 'auto' }}>
          <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 6 }}>Exportar para Click-N-Ship</div>
          <div style={{ fontSize: 12, color: '#7A6880', marginBottom: 12 }}>Pedidos a EE.UU. sin guía ni tracking. Ground Advantage, con el correo y teléfono de cada clienta para los avisos de USPS.</div>
          <div style={{ border: '1px solid #eee', borderRadius: 10, marginBottom: 14 }}>
            {exp.orders.map(o => {
              const blocked = o.issues.some(i => i !== 'sin piezas cargadas');
              return (
                <label key={o.id} style={{ display: 'flex', gap: 10, alignItems: 'flex-start', padding: '8px 12px', borderBottom: '1px solid #f3f3f3', fontSize: 13, opacity: blocked ? .6 : 1, cursor: blocked ? 'default' : 'pointer' }}>
                  <input type="checkbox" disabled={blocked} checked={!!exp.sel[o.id]} onChange={e => setExp(x => ({ ...x, sel: { ...x.sel, [o.id]: e.target.checked } }))} />
                  <span>
                    <b>{o.numero ? '#' + o.numero + ' · ' : ''}{o.cliente}</b> — {[o.ciudad, o.estado].filter(Boolean).join(', ')}
                    {o.issues.length > 0 && <div style={{ fontSize: 11, color: blocked ? '#DC2626' : '#B45309' }}>{o.issues.join(' · ')}{blocked ? ' — corrígelo con ✎ Editar dirección' : ''}</div>}
                  </span>
                </label>

            })}
          </div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'flex-end', marginBottom: 16, fontSize: 12, color: '#5B4A63' }}>
            {[['weightOz', 'Peso (oz)'], ['lengthIn', 'Largo (in)'], ['widthIn', 'Ancho (in)'], ['heightIn', 'Alto (in)']].map(([k, l]) => (
              <label key={k} style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>{l}
                <input type="number" min="0" step="0.1" value={exp.pkg[k]} onChange={e => setExp(x => ({ ...x, pkg: { ...x.pkg, [k]: e.target.value === '' ? '' : Number(e.target.value) } }))} style={inp} />

        <Modal onClose={() => setImp(null)} label="Importar trackings de Click-N-Ship" boxStyle={{ maxWidth: 520, maxHeight: '88vh', overflowY: 'auto' }}>
          <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 10 }}>Importar trackings</div>
          {imp.matches.length > 0 && (
            <div style={{ fontSize: 13, marginBottom: 12 }}>
              <div style={{ fontWeight: 700, marginBottom: 6 }}>{imp.matches.length} pedido{imp.matches.length !== 1 ? 's' : ''} recibirá{imp.matches.length !== 1 ? 'n' : ''} su tracking:</div>
              {imp.matches.map(m => (
                <div key={m.order.id} style={{ padding: '4px 0', borderBottom: '1px solid #f3f3f3' }}>
                  {m.order.numero ? '#' + m.order.numero + ' · ' : ''}{[m.order.cliente && m.order.cliente.nombre, m.order.cliente && m.order.cliente.apellido].filter(Boolean).join(' ')} → <span style={{ fontFamily: 'monospace' }}>{m.tracking}</span>
                </div>
              ))}
            </div>

          {imp.conflicts.length > 0 && (
            <div style={{ fontSize: 12, color: '#B45309', marginBottom: 10 }}>No se tocan:<br />{imp.conflicts.map((c, i) => <div key={i}>• {c}</div>)}</div>

          {imp.unmatched.length > 0 && (
            <div style={{ fontSize: 12, color: '#7A6880', marginBottom: 10 }}>{imp.unmatched.length} fila{imp.unmatched.length !== 1 ? 's' : ''} sin pedido en el panel (guías hechas fuera del panel): {imp.unmatched.slice(0, 10).join(', ')}{imp.unmatched.length > 10 ? '…' : ''}</div>
          )}
          {imp.matches.length > 0 && (
            <label style={{ display: 'flex', gap: 8, alignItems: 'center', fontSize: 13, marginBottom: 16 }}>
              <input type="checkbox" checked={imp.markSent} onChange={e => setImp(x => ({ ...x, markSent: e.target.checked }))} />

            </label>
          )}
          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button onClick={() => setImp(null)} style={{ ...btn, background: 'white', border: '1.5px solid #e4e4e4' }}>{imp.matches.length ? 'Cancelar' : 'Cerrar'}</button>

              <button onClick={doImport} style={{ ...btn, background: 'linear-gradient(135deg,#E8508A,#9B5DE5)', color: 'white' }}>Pegar {imp.matches.length} tracking{imp.matches.length !== 1 ? 's' : ''}</button>

        </Modal>
      )}
    </div>
  );
}

// Nombre completo del cliente: los pedidos de Lovers guardan nombre y apellido por separado
// (la tarjeta solo mostraba el nombre); los de la tienda traen el nombre completo en `nombre`
// y el apellido vacío — no se repite si el apellido ya está dentro del nombre.
// Buscador de Pedidos (22 oct): cada palabra tiene que aparecer en nombre, apellido, correo,
// teléfono, ciudad, número de pedido o tracking. El teléfono se compara solo por dígitos, así
// "305 555" encuentra "+1 (305) 555-1234".
function orderMatchesSearch(o, q) {
  const terms = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return true;
  const c = o.cliente || {};
  const text = [c.nombre, c.apellido, c.email, c.telefono, c.ciudad, c.estado, o.numero, o.tracking].filter(Boolean).join(' ').toLowerCase();
  const digits = [c.telefono, o.tracking, o.numero].filter(Boolean).join(' ').replace(/[^0-9]/g, '');
  return terms.every(t => text.includes(t) || (/\d/.test(t) && t.replace(/[^0-9]/g, '').length >= 3 && digits.includes(t.replace(/[^0-9]/g, ''))));
}

// Número para WhatsApp con código de país (22 oct, auditoría): "0991234567" (Ecuador sin código) →

// Antes iba tal cual y wa.me abría un número inválido o de otra persona.

  if (!d) return '';

  const raw = String(c.telefono || '').trim();
  if (raw.startsWith('+') || raw.startsWith('00')) return d;
  const pais = (String(c.pais || '') + ' ' + String(c.ciudad || '')).toUpperCase();
  const isUs = /\b(USA|US|ESTADOS UNIDOS|UNITED STATES|EEUU|EE\.?\s?UU)\b/.test(pais);
  if (d.length === 10 && d.startsWith('0')) return '593' + d.slice(1);

function orderFullName(c) {

// Reduce la foto a 1024px por el lado largo, JPEG 0.82 → base64 sin "data:".
function photoToJpegBase64(file, maxPx = 1024, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    const timer = setTimeout(() => { try { URL.revokeObjectURL(url); } catch (_) {}
      reject(new Error('La foto tardó demasiado o no se pudo leer. Intenta de nuevo (JPG o PNG).')); }, 20000);
    img.onerror = () => { clearTimeout(timer); try { URL.revokeObjectURL(url); } catch (_) {}
      reject(new Error('No se pudo leer la foto. Si es HEIC, tómala o guárdala como JPG.')); };
    img.onload = () => {
      clearTimeout(timer);
      try {
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (w > maxPx || h > maxPx) {
          if (w >= h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else        { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx2 = cv.getContext('2d');
        ctx2.fillStyle = '#fff'; ctx2.fillRect(0, 0, w, h); // PNG con transparencia → fondo blanco
        ctx2.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        const dataUrl = cv.toDataURL('image/jpeg', quality);
        resolve({ base64: dataUrl.split(',')[1], dataUrl });
      } catch (e) { reject(new Error('No se pudo procesar la foto.')); }
    };
    img.src = url;

}

            <input type="checkbox" checked={byStock} onChange={e => setByStock(e.target.checked)} /> Una por unidad en stock
          </label>
        </div>
        {!!preset.margin && (
          <div>
            <label htmlFor="labelsSkip" style={lbl}>Empezar en la posición</label>
            <input id="labelsSkip" type="number" min={1} max={grid.perPage} value={Number(skip) + 1} onChange={e => setSkip(Math.max(0, (Number(e.target.value) || 1) - 1))} style={inp} />
            <div style={{ fontSize: 10, color: '#7A6880', marginTop: 4 }}>Para reusar una hoja empezada.</div>
          </div>
        )}
      </div>
      {noSku.length > 0 && (
        <div role="note" style={{ fontSize: 12, color: '#92400E', background: '#FEF3C7', borderRadius: 8, padding: '6px 10px', marginBottom: 8 }}>
          {noSku.length} pieza{noSku.length === 1 ? '' : 's'} sin código todavía (se asigna al guardarla o al Publicar): no se imprime{noSku.length === 1 ? '' : 'n'}.
        </div>
      )}
      {err && <div role="alert" style={{ fontSize: 12, color: '#DC2626', background: '#FEF2F2', borderRadius: 8, padding: '6px 10px', marginBottom: 8 }}>{err}</div>}
      <button type="button" onClick={openView} disabled={!total || busy}
        style={{ width: '100%', padding: 11, background: !total || busy ? '#C9B8D3' : 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', border: 'none', borderRadius: 99, fontWeight: 700, fontSize: 14, cursor: !total || busy ? 'default' : 'pointer' }}>
        {busy ? 'Generando…' : `Ver ${total} etiqueta${total === 1 ? '' : 's'} para imprimir`}
      </button>
    </Modal>
  );
}
function LabelPrintView({ view, onBack, onClose }) {
  const preset = LABEL_PRESETS[view.presetKey];
  const grid = labelGrid(preset);
  const [host] = useState(() => { const d = document.createElement('div'); d.id = 'labelPrintHost'; return d; });
  useEffect(() => {
    document.body.appendChild(host);
    const onKey = e => { if (e.key === 'Escape') onBack(); };
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('keydown', onKey); host.remove(); };
  }, []);
  const cells = [...Array(view.skip).fill(null), ...view.labels];
  const pages = [];
  for (let i = 0; i < cells.length; i += grid.perPage) pages.push(cells.slice(i, i + grid.perPage));
  const small = preset.h < 20;
  const pad = small ? 0.8 : 1.5;
  const qrMm = preset.h - 2 * pad;
  const [pw, ph] = preset.page;
  const css = `
#labelPrintHost{position:fixed;inset:0;z-index:10000;background:#E9E4EC;overflow:auto;font-family:'DM Sans',system-ui,sans-serif}
#labelPrintHost .lp-bar{position:sticky;top:0;z-index:1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:white;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#labelPrintHost .lp-pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px}
#labelPrintHost .lp-page{width:${pw}mm;height:${ph}mm;padding:${preset.margin}mm;box-sizing:border-box;background:white;box-shadow:0 2px 12px rgba(0,0,0,.12);display:grid;grid-template-columns:repeat(${grid.cols},${preset.w}mm);grid-auto-rows:${preset.h}mm;align-content:start;overflow:hidden}
#labelPrintHost .lp-label{width:${preset.w}mm;height:${preset.h}mm;box-sizing:border-box;padding:${pad}mm;display:flex;align-items:center;gap:${small ? 0.6 : 1.2}mm;overflow:hidden;outline:0.2mm dashed #DDD;color:#111}
#labelPrintHost .lp-label img{width:${qrMm}mm;height:${qrMm}mm;image-rendering:pixelated;flex-shrink:0}
#labelPrintHost .lp-txt{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center}
#labelPrintHost .lp-sku{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:${small ? 6.5 : 11}pt;letter-spacing:.02em;line-height:1.05}
#labelPrintHost .lp-name{font-size:${small ? 4.2 : 6}pt;line-height:1.15;margin-top:${small ? 0.3 : 0.8}mm;overflow:hidden;display:-webkit-box;-webkit-line-clamp:${small ? 2 : 3};-webkit-box-orient:vertical;word-break:break-word}
@media print{
  @page{size:${pw}mm ${ph}mm;margin:0}
  html,body{background:white!important}
  body>*:not(#labelPrintHost){display:none!important}
  #labelPrintHost{position:static;overflow:visible;background:white}
  #labelPrintHost .lp-bar{display:none}
  #labelPrintHost .lp-pages{padding:0;gap:0;display:block}
  #labelPrintHost .lp-page{box-shadow:none;break-after:page;page-break-after:always}
  #labelPrintHost .lp-page:last-child{break-after:auto;page-break-after:auto}
  #labelPrintHost .lp-label{outline:none}
}`;
  const btn = { padding: '8px 16px', borderRadius: 99, fontWeight: 700, fontSize: 13, cursor: 'pointer', border: '1.5px solid #D9C9EE', background: 'white', color: '#5B3F8A' };
  return ReactDOM.createPortal(
    <div role="dialog" aria-modal="true" aria-label="Vista de impresión de etiquetas">
      <style>{css}</style>
      <div className="lp-bar">
        <button type="button" onClick={onBack} style={btn}>← Volver</button>
        <button type="button" onClick={() => window.print()} style={{ ...btn, background: 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', border: 'none' }}>🖨️ Imprimir</button>
        <span style={{ fontSize: 12, color: '#5B4A63' }}>{view.labels.length} etiqueta{view.labels.length === 1 ? '' : 's'} · {pages.length} página{pages.length === 1 ? '' : 's'} · {preset.name}</span>
        <button type="button" onClick={onClose} aria-label="Cerrar etiquetas" style={{ ...btn, marginLeft: 'auto' }}>✕</button>
      </div>
      <div className="lp-pages">
        {pages.map((pg, i) => (
          <div className="lp-page" key={i}>
            {pg.map((l, j) => l
              ? <div className="lp-label" key={l.key}>
                  <img src={l.src} alt={'QR ' + l.sku} />
                  <div className="lp-txt"><div className="lp-sku">{l.sku}</div><div className="lp-name">{shortName(l.name, small ? 28 : 46)}</div></div>
                </div>
              : <div key={'skip' + j} />)}
          </div>
        ))}
      </div>
    </div>,
    host
  );
}

// ── Registrar fotos (19 nov) — el mayor refuerzo del reconocimiento por foto ──
// Por cada pieza se guardan 1–3 fotos reales (como se fotografía en el taller) en el Worker
// (/identify/ref/add, máx. IDENTIFY_REFS_PER_PRODUCT = 10 por pieza). Mismo cálculo de huella
// que "Identificar" (embedQueryPhoto). Pensado para pasar muchas piezas seguidas.
const ENROLL_MAX_REFS = 10;
// onlyId: abierto desde el modal de un producto → solo esa pieza (sin lista ni "siguiente").
function EnrollPhotosModal({ products, token, onClose, onlyId = null }) {
  const counts = useRefCounts(token); // {id: n} compartido (null = cargando)
  const loadErr = counts ? '' : (_refStore.error || '');
  const [onlyMissing, setOnly]  = useState(true);
  const [q, setQ]               = useState('');
  const [curId, setCurId]       = useState(onlyId != null ? String(onlyId) : null);
  const [scan, setScan]         = useState(false);
  const [busy, setBusy]         = useState(false);
  const [status, setStatus]     = useState('');
  const [err, setErr]           = useState('');
  const [shots, setShots]       = useState([]); // miniaturas guardadas de la pieza actual
  const [doneCount, setDone]    = useState(0);  // piezas con fotos nuevas en esta sesión
  const fileRef = useRef(null);
  const loadCounts = () => { loadRefCounts(token, true).catch(() => {}); };
  const [twins, setTwins]       = useState(null); // Map id → { id, sim }: pieza con la que más se confunde
  const [stats]                 = useState(() => recogStatsSummary()); // acierto real en este teléfono
  // Precarga el reconocimiento en segundo plano (la 1ra foto no espera tanto) y calcula las
  // gemelas con las referencias del catálogo (en caché: la 2da vez es instantáneo).
  useEffect(() => {
    let alive = true;
    (async () => {
      const eng = await loadRecognitionModel();
      prewarmRecognition(products);
      const res = await prepareCatalogShared(products);
      const t = await computeTwins(res.items, eng.ver);
      if (alive) setTwins(t);
    })().catch(e => console.warn('gemelas:', e && e.message));
    return () => { alive = false; };
  }, []);
  const twinOf = p => (twins && twins.get(String(p.id))) || null;
  const twinSku = p => { const t = twinOf(p); if (!t) return ''; const o = (products || []).find(x => String(x.id) === t.id); return o ? (normalizeSku(o.sku) || o.name) : ''; };
  // Con gemelas: primero las piezas que más se parecen a otra (son las que más ayudan las fotos reales).
  const all = (products || []).filter(p => p && p.available !== false && productImageUrl(p))
    .sort((a, b) => (twins ? ((twinOf(b) ? twinOf(b).sim : -2) - (twinOf(a) ? twinOf(a).sim : -2)) : 0)
      || String(a.category || '').localeCompare(String(b.category || ''), 'es') || normalizeSku(a.sku).localeCompare(normalizeSku(b.sku), 'es', { numeric: true }));
  const cnt = p => (counts && counts[String(p.id)]) || 0;
  const missingN = counts ? all.filter(p => !cnt(p)).length : null;
  const withN = counts ? all.length - missingN : null;
  const list = all.filter(p => (!onlyMissing || !cnt(p)) && productMatchesSearch(p, q));
  const cur = curId != null ? (products || []).find(p => String(p.id) === String(curId)) : null;
  const openProduct = p => { setCurId(p ? String(p.id) : null); setShots([]); setErr(''); setStatus(''); setScan(false); };
  const nextMissing = () => {
    const idx = all.findIndex(p => String(p.id) === String(curId));
    const order = [...all.slice(idx + 1), ...all.slice(0, Math.max(0, idx))];
    const nx = order.find(p => !cnt(p));
    if (nx) openProduct(nx);
    else { openProduct(null); setStatus('🎉 Todas las piezas tienen al menos una foto registrada.'); }
  };
  const onScan = code => {
    const p = findBySku(products, code);
    setScan(false);
    if (!p) { setErr('No hay ninguna pieza con el código ' + code + '.'); return; }
    if (!productImageUrl(p) || p.available === false) { setErr(code + ' (' + p.name + ') está pausada o sin foto en el catálogo: el reconocimiento no la compara.'); return; }
    openProduct(p);
  };
  const onFiles = async e => {
    const files = Array.from((e.target.files) || []);
    e.target.value = '';
    if (!files.length || !cur) return;
    const room = ENROLL_MAX_REFS - cnt(cur);
    if (room <= 0) { setErr('Esta pieza ya tiene ' + ENROLL_MAX_REFS + ' fotos registradas (el máximo).'); return; }
    const batch = files.slice(0, Math.min(3, room));
    setBusy(true); setErr('');
    let saved = 0;
    try {
      for (let i = 0; i < batch.length; i++) {
        setStatus(`Procesando foto ${i + 1} de ${batch.length}…`);
        const ph = await photoToJpegBase64(batch[i], 640, 0.8);
        const q2 = await embedQueryPhoto(ph.dataUrl);
        setStatus(`Guardando foto ${i + 1} de ${batch.length}…`);
        const r = await apiCall('identify/ref/add', { token, id: String(cur.id), vector: learnedRefVector(q2) });
        saved++;
        const n = r && Number.isInteger(r.count) ? r.count : cnt(cur) + 1;
        setRefCount(cur.id, n);
        setShots(s => [...s, ph.dataUrl]);
      }
      if (saved && !shots.length) setDone(d => d + 1);
      setStatus(`✓ ${saved} foto${saved === 1 ? '' : 's'} guardada${saved === 1 ? '' : 's'} para ${normalizeSku(cur.sku) || cur.name}.` + (files.length > batch.length ? ` (Se usaron ${batch.length}: máximo 3 por vez y ${ENROLL_MAX_REFS} por pieza.)` : ''));
    } catch (er) {
      setErr(pieceErrMsg(er) + (saved ? ` (${saved} sí se guardaron)` : ''));
      setStatus('');
    }
    setBusy(false);
  };
  const thumb = { width: 44, height: 44, borderRadius: 8, objectFit: 'cover', background: '#F3EFF5', flexShrink: 0 };
  const bigBtn = { width: '100%', padding: 11, border: 'none', borderRadius: 99, fontWeight: 700, fontSize: 14, cursor: 'pointer' };
  return (
    <Modal onClose={onClose} labelledBy="enrollTitle" boxStyle={{ maxWidth: 480, maxHeight: '92vh', overflowY: 'auto', padding: 20 }} overlayStyle={{ padding: 10 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
        <div id="enrollTitle" style={{ fontWeight: 800, fontSize: 17, color: '#1A1118' }}>📸 Registrar fotos {onlyId != null ? 'de esta pieza' : 'de piezas'}</div>
        <button type="button" onClick={onClose} aria-label="Cerrar" style={{ width: 32, height: 32, borderRadius: '50%', background: '#F9F5F7', color: '#7A6880', border: 'none', cursor: 'pointer', fontSize: 16 }}>✕</button>
      </div>
      {withN != null && onlyId == null && (
        <div data-testid="enrollSummary" style={{ background: '#F1EAFB', borderRadius: 10, padding: '8px 12px', marginBottom: 8 }}>
          <div style={{ fontSize: 13, fontWeight: 800, color: '#5B3F8A' }}>◇ {withN} de {all.length} piezas con fotos reales <span style={{ fontWeight: 600, color: '#7A6880' }}>(todas se reconocen por su foto del catálogo)</span></div>
          <div aria-hidden="true" style={{ height: 6, background: 'white', borderRadius: 99, marginTop: 6, overflow: 'hidden' }}>
            <div style={{ width: (all.length ? Math.round(withN / all.length * 100) : 0) + '%', height: '100%', background: 'linear-gradient(90deg,#E8508A,#9B5DE5)' }} />
          </div>
        </div>
      )}
      {stats && (
        <div data-testid="recogStats" role="status" style={{ fontSize: 12, fontWeight: 700, color: '#5B3F8A', background: '#FAF7FB', border: '1px solid #EDE3F1', borderRadius: 10, padding: '6px 10px', marginBottom: 8 }}>
          Últimas {stats.n} identificaciones en este teléfono: {stats.first} al primer intento{stats.sPerPhoto != null ? ' · ' + stats.sPerPhoto.toLocaleString('es', { maximumFractionDigits: 1 }) + ' s por foto' : ''}
        </div>
      )}
      <div style={{ fontSize: 12, color: '#7A6880', marginBottom: 10 }}>
        No es obligatorio: todas las piezas ya se reconocen por su foto del catálogo. Las fotos reales del taller (1 a 3, sobre la mesa y con tu luz) mejoran el acierto, sobre todo en piezas parecidas entre sí, como los anillos dorados.
        {missingN != null && onlyId == null && <> <b style={{ color: missingN ? '#B45309' : '#15803D' }}>{missingN} pieza{missingN === 1 ? '' : 's'} sin fotos reales</b> de {all.length}.</>}
        {doneCount > 0 && onlyId == null && <> · {doneCount} registrada{doneCount === 1 ? '' : 's'} en esta sesión.</>}
      </div>
      {loadErr && <div role="alert" style={{ fontSize: 12, color: '#DC2626', background: '#FEF2F2', borderRadius: 8, padding: '6px 10px', marginBottom: 8 }}>No se pudieron leer las fotos registradas: {loadErr} <button type="button" onClick={loadCounts} style={{ border: 'none', background: 'none', color: '#7C3AED', fontWeight: 700, cursor: 'pointer' }}>Reintentar</button></div>}

      {cur ? (
        <div>
          <div style={{ display: 'flex', gap: 12, alignItems: 'center', background: '#FAF7FB', borderRadius: 12, padding: 10, marginBottom: 10 }}>
            <ZoomImg src={productImageUrl(cur)} title={normalizeSku(cur.sku)} sub={cur.name} style={{ width: 84, height: 84, borderRadius: 10, objectFit: 'cover' }} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <SkuChip sku={cur.sku} style={{ fontSize: 13 }} />
              <div style={{ fontWeight: 700, fontSize: 14, color: '#1A1118', marginTop: 4 }}>{cur.name}</div>
              <div style={{ fontSize: 12, color: '#7A6880' }}>{cur.category}</div>
              <div data-testid="enrollCount" style={{ fontSize: 12, fontWeight: 700, marginTop: 2, color: cnt(cur) ? '#15803D' : '#B45309' }}>Ya la reconoce por su foto del catálogo · fotos reales: {cnt(cur)} / {ENROLL_MAX_REFS} (opcional)</div>
              {twinSku(cur) && <div data-testid="twinLabel" style={{ fontSize: 11, fontWeight: 700, color: '#9D174D', marginTop: 2 }}>Se parece a {(() => { const t = twinOf(cur); const o = t && (products || []).find(x => String(x.id) === t.id); return o && productImageUrl(o) ? <button type="button" data-testid="twinOpen" onClick={() => openLightbox(productImageUrl(o), normalizeSku(o.sku) || o.name, o.name)} style={{ background: 'none', border: 'none', padding: 0, font: 'inherit', color: 'inherit', textDecoration: 'underline', cursor: 'zoom-in' }}>{twinSku(cur)} (ver foto)</button> : twinSku(cur); })()}</div>}
            </div>
          </div>
          <button type="button" onClick={() => fileRef.current && fileRef.current.click()} disabled={busy || cnt(cur) >= ENROLL_MAX_REFS}
            style={{ ...bigBtn, background: busy || cnt(cur) >= ENROLL_MAX_REFS ? '#C9B8D3' : 'linear-gradient(135deg,#E8508A,#9B5DE5)', color: 'white' }}>
            {busy ? 'Guardando…' : cnt(cur) >= ENROLL_MAX_REFS ? 'Máximo de fotos alcanzado' : shots.length ? '📷 Agregar otra foto' : '📷 Tomar o elegir foto'}
          </button>
          <input ref={fileRef} type="file" accept="image/*" multiple aria-label="Fotos de la pieza para registrar" style={{ display: 'none' }} onChange={onFiles} />
          <PhotoTip style={{ marginTop: 8 }} />
          <div role="status" aria-live="polite" style={{ fontSize: 12, color: '#15803D', marginTop: 6, minHeight: 4 }}>{status}</div>
          {err && <div role="alert" style={{ fontSize: 12, color: '#DC2626', background: '#FEF2F2', borderRadius: 8, padding: '6px 10px', marginTop: 6 }}>{err}</div>}
          {shots.length > 0 && <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>{shots.map((s, i) => <img key={i} src={s} alt={'Foto registrada ' + (i + 1)} style={thumb} />)}</div>}
          {onlyId != null ? (
            <button type="button" onClick={onClose} disabled={busy} style={{ ...bigBtn, marginTop: 12, background: '#1A1118', color: 'white', fontSize: 13 }}>Listo</button>
          ) : (
          <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
            <button type="button" onClick={() => openProduct(null)} style={{ ...bigBtn, flex: 1, background: '#F3EFF5', color: '#5B3F8A', fontSize: 13 }}>← Lista</button>
            <button type="button" onClick={nextMissing} disabled={busy} style={{ ...bigBtn, flex: 2, background: '#1A1118', color: 'white', fontSize: 13 }}>Siguiente pieza sin fotos →</button>
          </div>
          )}
        </div>
      ) : scan ? (
        <div>
          <QrScanPanel idPrefix="enrollQr" onCode={onScan} />
          <button type="button" onClick={() => setScan(false)} style={{ ...bigBtn, marginTop: 8, background: '#F3EFF5', color: '#5B3F8A', fontSize: 13 }}>Cancelar</button>
        </div>
      ) : (
        <div>
          <div role="status" aria-live="polite" style={{ fontSize: 12, color: '#15803D', minHeight: 4 }}>{status}</div>
          {err && <div role="alert" style={{ fontSize: 12, color: '#DC2626', background: '#FEF2F2', borderRadius: 8, padding: '6px 10px', marginBottom: 6 }}>{err}</div>}
          <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
            <button type="button" onClick={() => { setErr(''); setStatus(''); setScan(true); }} style={{ ...bigBtn, flex: 1, background: '#F1EAFB', color: '#5B3F8A', fontSize: 13 }}>Escanear etiqueta</button>
            <button type="button" disabled={!counts || !missingN} onClick={() => { const nx = all.find(p => !cnt(p)); if (nx) openProduct(nx); }} style={{ ...bigBtn, flex: 1, background: !counts || !missingN ? '#C9B8D3' : '#1A1118', color: 'white', fontSize: 13 }}>Empezar por la 1ra sin fotos</button>
          </div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 8 }}>
            <label htmlFor="enrollSearch" style={srOnlyStyle}>Buscar pieza</label>
            <input id="enrollSearch" value={q} onChange={e => setQ(e.target.value)} placeholder="Buscar por nombre o código…"
              style={{ flex: 1, padding: '8px 10px', border: '1.5px solid #E5DDEA', borderRadius: 8, fontSize: 13, outline: 'none', fontFamily: 'inherit' }} />
            <label style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 12, color: '#5B4A63', whiteSpace: 'nowrap' }}>
              <input type="checkbox" checked={onlyMissing} onChange={e => setOnly(e.target.checked)} /> Sin fotos
            </label>
          </div>
          {!counts ? <div style={{ fontSize: 12, color: '#7A6880' }}>Cargando…</div> : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {!list.length && <div style={{ fontSize: 12, color: '#7A6880' }}>{onlyMissing && !q ? 'Todas las piezas tienen fotos reales.' : 'Sin resultados.'}</div>}
              {list.map(p => (
                <button type="button" key={p.id} onClick={() => openProduct(p)}
                  style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%', textAlign: 'left', padding: 6, background: cnt(p) ? '#FAF7FB' : '#FFF7ED', border: cnt(p) ? '1.5px solid #EDE3F1' : '1.5px solid #FCD9A8', borderRadius: 10, cursor: 'pointer', fontFamily: 'inherit' }}>
                  <ZoomImg inButton src={productImageUrl(p)} title={normalizeSku(p.sku)} sub={p.name} style={thumb} />
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span style={{ display: 'block', fontSize: 13, fontWeight: 600, color: '#1A1118', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.name}</span>
                    <span style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap', fontSize: 11, color: '#7A6880' }}><SkuChip sku={p.sku} />{p.category}{twinSku(p) && <span data-testid="twinLabel" style={{ color: '#9D174D', fontWeight: 700 }}>· Se parece a {twinSku(p)}</span>}</span>
                  </span>
                  <RefBadge n={cnt(p)} style={{ fontSize: 12, padding: '3px 9px', flexShrink: 0 }} />
                </button>
              ))}
            </div>
          )}
        </div>
      )}
    </Modal>
  );
}
const srOnlyStyle = { position: 'absolute', width: 1, height: 1, padding: 0, margin: -1, overflow: 'hidden', clip: 'rect(0,0,0,0)', whiteSpace: 'nowrap', border: 0 };

// ── Agregar pieza a un pedido (18–19 nov) ──
// 3 caminos: escanear la etiqueta QR, escribir el código (AN001) o identificar por foto
// (ver arriba). El código resuelve la pieza directo → confirmar (con stock) → agregar.
// Después de agregar por QR, código o búsqueda: paso "Enseñar al identificador" (foto de la joya,

// Aviso (no bloquea) si la foto salió oscura o movida.
function qualityMsg(q) {

  return 'Toma otra: salió ' + (q.dark ? 'oscura' : 'movida');

// "Marca la joya": recuadro que se arrastra (mover) o se estira desde las esquinas, con mouse,
// dedo o teclado (flechas mueven, Mayús + flechas cambian el tamaño). box en px de la foto.
function JewelBoxEditor({ src, w, h, box, autoBox, onApply, onCancel, idPrefix }) {
  const full = [0, 0, w, h];
  const [b, setB] = useState(() => (box || autoBox || [w * 0.2, h * 0.2, w * 0.8, h * 0.8]).slice());
  const wrapRef = useRef(null), drag = useRef(null);
  const minS = Math.min(w, h) * 0.08;
  const clampBox = nb => {
    let [x0, y0, x1, y1] = nb;
    if (x1 - x0 < minS) x1 = x0 + minS; if (y1 - y0 < minS) y1 = y0 + minS;
    const dx = x0 < 0 ? -x0 : x1 > w ? w - x1 : 0, dy = y0 < 0 ? -y0 : y1 > h ? h - y1 : 0;
    x0 += dx; x1 += dx; y0 += dy; y1 += dy;
    return [Math.max(0, x0), Math.max(0, y0), Math.min(w, x1), Math.min(h, y1)];
  };
  const onDown = (mode) => e => {
    e.preventDefault(); e.stopPropagation();
    const r = wrapRef.current.getBoundingClientRect();
    drag.current = { mode, x: e.clientX, y: e.clientY, b0: b.slice(), k: w / r.width };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
  };
  const onMove = e => {
    const d = drag.current; if (!d) return;
    const dx = (e.clientX - d.x) * d.k, dy = (e.clientY - d.y) * d.k, [x0, y0, x1, y1] = d.b0;
    if (d.mode === 'move') { const bw = x1 - x0, bh = y1 - y0; let nx = Math.min(Math.max(0, x0 + dx), w - bw), ny = Math.min(Math.max(0, y0 + dy), h - bh); setB([nx, ny, nx + bw, ny + bh]); return; }
    const nb = [x0, y0, x1, y1];
    if (d.mode.includes('w')) nb[0] = Math.min(x0 + dx, x1 - minS); if (d.mode.includes('e')) nb[2] = Math.max(x1 + dx, x0 + minS);
    if (d.mode.includes('n')) nb[1] = Math.min(y0 + dy, y1 - minS); if (d.mode.includes('s')) nb[3] = Math.max(y1 + dy, y0 + minS);
    setB(clampBox(nb));
  };
  const onUp = () => { drag.current = null; };
  const onKey = e => {
    const st = Math.min(w, h) * 0.03, k = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[e.key];
    if (!k) return;
    e.preventDefault();
    if (e.shiftKey) setB(([x0, y0, x1, y1]) => clampBox([x0, y0, x1 + k[0], y1 + k[1]]));
    else setB(([x0, y0, x1, y1]) => { const bw = x1 - x0, bh = y1 - y0, nx = Math.min(Math.max(0, x0 + k[0]), w - bw), ny = Math.min(Math.max(0, y0 + k[1]), h - bh); return [nx, ny, nx + bw, ny + bh]; });
  };
  const pc = v => (v * 100) + '%';
  const handle = (pos, css) => (
    <span key={pos} data-testid={'jewelBoxHandle-' + pos} onPointerDown={onDown(pos)} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
      style={{ position: 'absolute', width: 28, height: 28, touchAction: 'none', cursor: (pos === 'nw' || pos === 'se') ? 'nwse-resize' : 'nesw-resize', ...css }}>
      <span style={{ position: 'absolute', left: 7, top: 7, width: 14, height: 14, borderRadius: 4, background: 'white', border: '2px solid #C0336E', boxSizing: 'border-box' }} />
    </span>
  );
  const changed = !box || b.some((v, i) => Math.abs(v - box[i]) > 0.5);
  return (
    <div data-testid="jewelBoxEditor" style={{ marginBottom: 12 }}>
      <div id={idPrefix + '-help'} style={{ fontSize: 12, fontWeight: 700, color: '#5B4A63', marginBottom: 6 }}>Marca la joya: mueve el recuadro o estíralo desde las esquinas para que encierre solo la pieza.</div>
      <div ref={wrapRef} style={{ position: 'relative', width: '100%', maxWidth: 320, margin: '0 auto', aspectRatio: w + ' / ' + h, overflow: 'hidden', borderRadius: 12, background: '#F3EFF5', userSelect: 'none' }}>
        <img src={src} alt="Foto de la pieza" draggable={false} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', display: 'block' }} />
        <div data-testid="jewelBox" role="group" tabIndex={0} aria-describedby={idPrefix + '-help'}
          aria-label="Zona de la joya. Flechas: mover. Mayús + flechas: cambiar el tamaño."
          onKeyDown={onKey} onPointerDown={onDown('move')} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
          style={{ position: 'absolute', left: pc(b[0] / w), top: pc(b[1] / h), width: pc((b[2] - b[0]) / w), height: pc((b[3] - b[1]) / h), boxSizing: 'border-box',
                   border: '2px solid #FFFFFF', outline: '2px dashed #C0336E', outlineOffset: -2, boxShadow: '0 0 0 9999px rgba(26,17,36,.45)', touchAction: 'none', cursor: 'move' }}>
          {handle('nw', { left: -14, top: -14 })}{handle('ne', { right: -14, top: -14 })}{handle('sw', { left: -14, bottom: -14 })}{handle('se', { right: -14, bottom: -14 })}
        </div>
      </div>
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 8 }}>
        <button type="button" onClick={() => onApply(b.map(Math.round))} style={{ padding: '8px 14px', borderRadius: 99, border: 'none', background: 'linear-gradient(135deg,#E8508A,#9B5DE5)', color: 'white', fontWeight: 700, fontSize: 12, cursor: 'pointer' }}>✓ Usar esta zona</button>
        <button type="button" onClick={() => onApply(null)} style={{ padding: '8px 12px', borderRadius: 99, border: '1px solid #E5D7EE', background: 'white', color: '#7A5F8A', fontWeight: 700, fontSize: 12, cursor: 'pointer' }}>Automática</button>
        <button type="button" onClick={onCancel} style={{ padding: '8px 12px', borderRadius: 99, border: 'none', background: '#F3EFF5', color: '#7A5F8A', fontWeight: 700, fontSize: 12, cursor: 'pointer' }}>Cancelar</button>
      </div>
      {!changed && <div style={{ fontSize: 11, color: '#7A6880', marginTop: 4 }}>Sin cambios: se usa la zona marcada.</div>}
    </div>
  );
}
// Miniatura de una foto con la zona usada (automática o marcada) dibujada encima.
function ShotThumb({ shot, info, box, size = 72 }) {
  const b = box || (info && info.box);
  let ov = null;
  if (info && b) {
    const k = size / Math.max(info.w, info.h), dw = info.w * k, dh = info.h * k, ox = (size - dw) / 2, oy = (size - dh) / 2;
    ov = { left: ox + b[0] * k, top: oy + b[1] * k, width: (b[2] - b[0]) * k, height: (b[3] - b[1]) * k };
  }
  return (
    <span style={{ position: 'relative', display: 'block', width: size, height: size, borderRadius: 10, overflow: 'hidden', background: '#F3EFF5', border: '1px solid #EDE3F1', flexShrink: 0 }}>
      <img src={shot.dataUrl} alt="" style={{ width: '100%', height: '100%', objectFit: 'contain', display: 'block' }} />
      {ov && <span aria-hidden="true" data-testid="shotBox" style={{ position: 'absolute', ...ov, border: box ? '2px solid #C0336E' : '1.5px dashed #9B5DE5', boxSizing: 'border-box', borderRadius: 3 }} />}
    </span>
  );
}

function AddPieceModal({ order, token, photo, products, categories, stock, onRetake, onClose, onAdded, onTeach }) {
  const refCounts = useRefCounts(token);
  const [teachP, setTeachP]   = React.useState(null); // pieza recién agregada → paso "Enseñar"
  const teachRef = React.useRef(null);
  const [mode, setMode]       = React.useState(photo ? 'photo' : 'choose'); // choose | scan | type | photo
  const [cat, setCat]         = React.useState('Todas');
  const [busy, setBusy]       = React.useState(false);
  const [adding, setAdding]   = React.useState(null); // id que se está agregando
  const [errMsg, setErrMsg]   = React.useState('');
  const [matches, setMatches] = React.useState(null); // null = todavía no se identificó
  const [manual, setManual]   = React.useState(false);
  const [query, setQuery]     = React.useState('');
  const [code, setCode]       = React.useState('');
  const [codeMsg, setCodeMsg] = React.useState('');
  const [confirmP, setConfirmP] = React.useState(null); // producto resuelto por código
  const [prep, setPrep]       = React.useState({ phase: 'idle', done: 0, total: 0, failed: 0 });
  const prepRef  = React.useRef(null);  // promesa: catálogo con huellas listo
  const refsRef  = React.useRef(null);  // fotos reales aprendidas (prepareLearnedRefs)
  const queryRef = React.useRef(null);  // última búsqueda {keys, qs}: huellas de las fotos usadas
  const qCache   = React.useRef(new Map()); // dataUrl|zona → huella
  const extraRef = React.useRef(null);  // input de "＋ Otra foto"
  const [extras, setExtras]   = React.useState([]);   // fotos extra (otro ángulo), máx. 2
  const [infos, setInfos]     = React.useState({});   // dataUrl → { w, h, box, quality }
  const [boxes, setBoxes]     = React.useState({});   // dataUrl → zona marcada a mano (o nada)
  const [editShot, setEditShot] = React.useState(null); // dataUrl de la foto en "Marca la joya"
  const [okQ, setOkQ]         = React.useState({});   // dataUrl → "Seguir igual" (aviso de calidad)
  const [doubt, setDoubt]     = React.useState(false); // 1ro y 2do muy parejos → pedir otro ángulo
  const [rerank, setRerank]   = React.useState(null);  // segunda opinión IA: { state: busy|done|null|error, choice, changed }
  const searchRef = React.useRef(0);                  // nro. de búsqueda (respuestas viejas se ignoran)
  const msRef = React.useRef(0);                      // ms por foto de la última búsqueda (estadística local)
  const shots = photo ? [photo, ...extras] : [];
  React.useEffect(() => { setMatches(null); setErrMsg(''); setExtras([]); setBoxes({}); setEditShot(null); if (photo) { setMode('photo'); setConfirmP(null); } }, [photo && photo.dataUrl]);
  React.useEffect(() => { // zona automática y calidad de cada foto (no necesita la red)
    for (const sh of shots) if (!infos[sh.dataUrl]) photoInfo(sh.dataUrl).then(i => setInfos(m => ({ ...m, [sh.dataUrl]: i }))).catch(() => {});
  }, [shots.map(s => s.dataUrl).join('|')]);
  const shotKey = sh => sh.dataUrl + '|' + (boxes[sh.dataUrl] ? boxes[sh.dataUrl].join(',') : 'auto');
  const cats = ['Todas', ...((categories && categories.length) ? categories : DEFAULT_CATEGORIES)];
  const recogOn = mode === 'photo';

  // Al pasar a "por foto" (la 1ra vez): carga el modelo y prepara las huellas del catálogo
  // (caché en IndexedDB). Escanear o escribir el código no descarga nada de esto.
  React.useEffect(() => {
    if (!recogOn || prepRef.current) return;
    let alive = true;
    setPrep({ phase: 'model', done: 0, total: 0, failed: 0 });
    prepRef.current = (async () => {
      const res = await prepareCatalogShared(products, (d, t) => { if (alive) setPrep(s => ({ ...s, phase: 'catalog', done: d, total: t })); });
      if (alive) setPrep({ phase: 'ready', done: res.total, total: res.total, failed: res.failed });
      return res;
    })();

    loadRefCounts(token, true).then(r => {
      refsRef.current = prepareLearnedRefs((r && r.refs) || {}); // márgenes, fondo común y prototipo (v2.3)
    }).catch(e => console.warn('identify/refs:', e && e.message));

  }, [recogOn]);

  const qtyOf = pid => (stock ? stockOf(stock, pid) : null);
  const shotQuery = async (sh, times) => {
    const k = shotKey(sh);
    if (!qCache.current.has(k)) { const t0 = performance.now(); qCache.current.set(k, await embedQueryPhoto(sh.dataUrl, { box: boxes[sh.dataUrl] || null })); if (times) times.push(performance.now() - t0); }
    return qCache.current.get(k);
  };
  // Todas las fotos (hasta 3) → UNA búsqueda con los puntajes combinados (rankCatalogMulti) y el
  // desempate por stock (stockTiebreak: nunca oculta piezas con stock 0).
  const identify = async () => {
    if (!photo || busy || !prepRef.current) return;
    setBusy(true); setErrMsg(''); setMatches(null); setEditShot(null); setDoubt(false); setRerank(null);

      if (times.length) msRef.current = times.reduce((a, b) => a + b, 0) / times.length;
      queryRef.current = { keys: shots.map(shotKey), qs };
      const fused = rankCatalogMulti(qs, catalog.items, refsRef.current, cat, Infinity);
      const unsure = fused.length > 1 && fused[0].score - fused[1].score < DOUBT_MARGIN;
      setDoubt(unsure && shots.length < 3);
      const ranked = stockTiebreak(fused, id => qtyOf(id)).slice(0, 5);
      const list = ranked.map(r => ({ id: String(r.p.id), name: r.p.name, sku: normalizeSku(r.p.sku), category: r.p.category, imageUrl: productImageUrl(r.p), pct: friendlyPct(r.score, qs[0].pct), score: r.score }));
      setMatches(list);

    } catch (e) { setErrMsg(pieceErrMsg(e)); }

  // (margen < RERANK_MARGIN), UNA vez por búsqueda (con varias fotos, la mejor: sin aviso de calidad,
  // la más nueva). Foto ~512 px y las 2–5 candidatas ~384 px (sus fotos del catálogo, ya cargadas con
  // CORS: GitHub Pages manda Access-Control-Allow-Origin: *, así el canvas se puede exportar). Si
  // elige una, sube al 1er puesto con "✓ 2ª opinión (IA)"; nunca agrega la pieza sola. Errores: nada.
  const RERANK_TIMEOUT_MS = 20000;
  // v3.1 (25 nov): fotos más chicas (consulta 448 px, candidatas 256 px: ~45 % menos tokens por
  // llamada) y con ese ahorro se consulta en más casos: margen < RERANK_MARGIN (antes 0,06). Con la
  // huella v3: sintético 25 % → 37 % de las búsquedas, real 43 % → 63 %, y los errores del 1er puesto
  // que llegan a consulta pasan de 97 % / 89 % a 100 %; tokens × llamadas = 0,72–0,77 de antes.
  // Si la 4ta candidata ya está a más de RERANK_FAR del 1ro, se mandan solo 3.
  const RERANK_MARGIN = 0.12, RERANK_FAR = 0.08;

    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w0 * k)); cv.height = Math.max(1, Math.round(h0 * k));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);

    while (url.length * 0.75 > maxKb * 1024 && qual > 0.4) { qual -= 0.1; url = cv.toDataURL('image/jpeg', qual); }
    return url;
  };
  const secondOpinion = async (sid, list) => {
    setRerank({ state: 'busy' });
    try {
      const good = shots.filter(sh => { const i = infos[sh.dataUrl]; return !(i && i.quality && (i.quality.dark || i.quality.blurry)); });
      const best = (good.length ? good : shots)[(good.length ? good : shots).length - 1];
      const image = jpegOf(await loadImg(best.dataUrl, false), 448, 280);
      const nCand = list.length >= 4 && list[0].score - list[3].score > RERANK_FAR ? 3 : 5;
      const candidates = [];
      for (const m of list.slice(0, nCand)) {

        catch (_) { /* foto no disponible o canvas bloqueado: esa candidata no va */ }
      }

      const r = await Promise.race([
        apiCall('identify/rerank', { token, image, candidates }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), RERANK_TIMEOUT_MS)),
      ]);
      if (searchRef.current !== sid) return;
      const choice = r && r.choice != null ? String(r.choice) : null;
      if (choice && list.some(m => m.id === choice)) {
        const changed = list[0].id !== choice;
        setMatches(ms => (ms ? [...ms.filter(m => m.id === choice).map(m => ({ ...m, ai: true })), ...ms.filter(m => m.id !== choice)] : ms));
        setRerank({ state: 'done', choice, changed });

  const onExtraFile = async e => {

  };

        const last = queryRef.current;

      onAdded(productos, name, { keepOpen: true, order: res.order });
