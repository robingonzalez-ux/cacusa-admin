          <div style={{ fontSize: 12, color: '#7A6B85', marginBottom: 10 }}>{leads.length} registro{leads.length !== 1 ? 's' : ''}</div>
          <div style={{ background: 'white', borderRadius: 12, border: '1px solid #EDE8EA', overflow: 'hidden' }}>
            <div className="adm-gt-head" style={{ display: 'grid', gridTemplateColumns: '1fr 80px 160px 190px', padding: '10px 16px', background: '#F9F5F7', borderBottom: '1px solid #EDE8EA', fontSize: 11, fontWeight: 700, color: '#7A6B85', textTransform: 'uppercase', letterSpacing: '.08em' }}>
              <span>Email</span><span>Idioma</span><span>Fecha</span><span>Código 10%</span>

              <div key={i} data-testid="leadRow" className="adm-gt-row" style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) 80px 160px 190px', padding: '12px 16px', borderBottom: i < leads.length - 1 ? '1px solid #F3EEF1' : 'none', alignItems: 'center' }}>

                <span className="adm-gt-meta" style={{ fontSize: 12, color: '#7A6B85' }}>{l.lang === 'en' ? '🇺🇸 EN' : '🇪🇸 ES'}</span>
                <span className="adm-gt-meta" style={{ fontSize: 12, color: '#7A6B85' }}>{fmt(l.date)}</span>
                <span className="adm-gt-meta">

// ── Carritos abandonados ─────────────────────────────────────────────────────
// Pestaña dedicada (a diferencia de LeadsTab, que mezcla esto con los emails
// del 10% en una tabla estática cargada una sola vez). Se actualiza sola con el
// mismo patrón de polling que usa App (30s + al volver a la pestaña/foco), y
// marca "Recuperado" cruzando el email contra `orders` — ya cargado en el
// componente padre, sin pedirlo de nuevo al servidor.
function AbandonedCartsTab({ token, orders }) {
  const [leads, setLeads] = useState(null);
  const [loading, setLoading] = useState(true);
  const [deletingEmail, setDeletingEmail] = useState(null);
  const [sendingEmail, setSendingEmail] = useState(null);
  const [sendMsg, setSendMsg] = useState({});

  const load = () => {
    apiCall('lead/list', { token })
      .then(d => setLeads(Array.isArray(d.leads) ? d.leads.filter(l => l.source === 'cart_checkout_start') : []))
      .catch(() => setLeads(prev => prev || []))
      .finally(() => setLoading(false));
  };

  useEffect(() => {
    load();
    const onVisible = () => { if (!document.hidden) load(); };
    const iv = setInterval(load, 30000);
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('focus', load);
    return () => {
      clearInterval(iv);
      document.removeEventListener('visibilitychange', onVisible);
      window.removeEventListener('focus', load);
    };
  }, []);

  const purchasedEmails = new Set((orders || []).map(o => (o.cliente && o.cliente.email || '').toLowerCase()).filter(Boolean));

  const fmt = iso => { try { return new Date(iso).toLocaleDateString('es-EC', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return iso; } };
  const relTime = iso => {
    try {
      const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      if (mins < 1) return 'recién';
      if (mins < 60) return `hace ${mins} min`;
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return `hace ${hrs}h`;
      return `hace ${Math.round(hrs / 24)}d`;
    } catch { return ''; }
  };

  const handleDelete = async (email) => {
    if (!confirm(`¿Eliminar el registro de ${email}? Esta acción no se puede deshacer.`)) return;
    setDeletingEmail(email);
    try {
      await apiCall('lead/delete', { token, email });
      setLeads(prev => (prev || []).filter(l => l.email !== email));
    } catch (_) {}
    setDeletingEmail(null);
  };

  // Un carrito abandonado también puede recibir el código de bienvenida del 10% — las
  // dos cosas son independientes (welcomeSent no tiene nada que ver con source).
  const sendWelcome = async (l) => {
    setSendingEmail(l.email);
    setSendMsg(prev => ({ ...prev, [l.email]: null }));
    try {
      const d = await apiCall('lead/send-welcome', { token, email: l.email, lang: l.lang });
      setLeads(prev => prev.map(x => x.email === l.email ? { ...x, welcomeSent: true, welcomeCode: d.code } : x));
      setSendMsg(prev => ({ ...prev, [l.email]: { ok: true, text: `✓ Enviado (${d.code})` } }));
    } catch (e) {
      setSendMsg(prev => ({ ...prev, [l.email]: { ok: false, text: e.message || 'No se pudo enviar' } }));
    }
    setSendingEmail(null);
  };

  const pending = (leads || []).filter(l => !purchasedEmails.has((l.email || '').toLowerCase()));

  return (
    <div style={{ maxWidth: 760 }}>
      <div style={{ fontWeight: 800, fontSize: 18, color: '#1A1118', marginBottom: 4 }}>🛒 Carritos abandonados</div>
      <div style={{ fontSize: 13, color: '#7A6B85', marginBottom: 20 }}>Personas que llegaron al checkout de la tienda con un carrito y no completaron la compra. Se actualiza solo cada 30 segundos y marca "Recuperado" en cuanto esa persona aparece en Pedidos con el mismo email.</div>

      {loading && <div style={{ textAlign: 'center', padding: '32px 0', color: '#767676', fontSize: 13 }}>Cargando…</div>}
      {!loading && leads && leads.length === 0 && (
        <div style={{ textAlign: 'center', padding: '32px 0', color: '#767676', fontSize: 13 }}>No hay carritos abandonados por ahora.</div>
      )}
      {!loading && leads && leads.length > 0 && (
        <div>
          <div style={{ fontSize: 12, color: '#7A6B85', marginBottom: 10 }}>{pending.length} sin recuperar de {leads.length} en total</div>
          <div style={{ background: 'white', borderRadius: 12, border: '1px solid #EDE8EA', overflow: 'hidden' }}>
            <div className="adm-gt-head" style={{ display: 'grid', gridTemplateColumns: '1fr 1.3fr 80px 100px 160px 60px', padding: '10px 16px', background: '#F9F5F7', borderBottom: '1px solid #EDE8EA', fontSize: 11, fontWeight: 700, color: '#7A6B85', textTransform: 'uppercase', letterSpacing: '.08em' }}>
              <span>Email</span><span>Carrito</span><span>Hace</span><span>Estado</span><span>Código 10%</span><span></span>
            </div>
            {leads.map(l => {
              const recovered = purchasedEmails.has((l.email || '').toLowerCase());
              return (
                <div key={l.email} data-testid="cartRow" className="adm-gt-row" style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,1.3fr) 80px 100px 160px 60px', padding: '12px 16px', borderBottom: '1px solid #F3EEF1', alignItems: 'center' }}>
                  <span className="adm-gt-main" style={{ fontSize: 13, color: '#1A1118', fontWeight: 500, wordBreak: 'break-word' }}>{l.email}</span>
                  <span className="adm-gt-main" style={{ fontSize: 12, color: '#C0336E' }}>
                    ${(l.total || 0).toFixed(2)}{l.cart && l.cart.length ? ' — ' + l.cart.map(c => c.name).slice(0, 2).join(', ') + (l.cart.length > 2 ? '…' : '') : ''}
                  </span>
                  <span className="adm-gt-meta" style={{ fontSize: 12, color: '#7A6B85' }} title={fmt(l.date)}>{relTime(l.date)}</span>
                  <span className="adm-gt-meta" style={{ fontSize: 12, fontWeight: 700, color: recovered ? '#2C6149' : '#9C6A18' }}>{recovered ? '🟢 Recuperado' : '🟡 Pendiente'}</span>
                  <span className="adm-gt-meta">
                    {l.welcomeSent ? (
                      <span style={{ fontSize: 12, color: '#2E7D32' }}>✓ Enviado</span>
                    ) : (
                      <button
                        onClick={() => sendWelcome(l)}
                        disabled={sendingEmail === l.email}
                        style={{ fontSize: 12, padding: '5px 10px', borderRadius: 6, border: '1px solid #C0336E', background: 'white', color: '#C0336E', cursor: sendingEmail === l.email ? 'default' : 'pointer', opacity: sendingEmail === l.email ? .6 : 1 }}
                      >
                        {sendingEmail === l.email ? 'Enviando…' : 'Enviar código'}
                      </button>
                    )}
                    {sendMsg[l.email] && (
                      <div role="status" aria-live="polite" style={{ fontSize: 11, marginTop: 4, color: sendMsg[l.email].ok ? '#2E7D32' : '#B3261E' }}>
                        {sendMsg[l.email].text}
                      </div>
                    )}
                  </span>
                  <button className="adm-gt-end" onClick={() => handleDelete(l.email)} disabled={deletingEmail === l.email}
                    style={{ minHeight: 32, fontSize: 11, color: '#B7362A', background: 'none', border: 'none', cursor: deletingEmail === l.email ? 'default' : 'pointer', textDecoration: 'underline', padding: 0, opacity: deletingEmail === l.email ? .5 : 1 }}>
                    {deletingEmail === l.email ? '…' : 'Eliminar'}
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

  const [newForm, setNewForm] = useState(NEW_SUB_BLANK);
  const [savingNew, setSavingNew] = useState(false);
  const [newFormError, setNewFormError] = useState('');
  const [sendingExclusive, setSendingExclusive] = useState(false);
  const [exclusiveMsg, setExclusiveMsg] = useState('');
  const [sendingExclusiveId, setSendingExclusiveId] = useState(null);
  const [exclusiveRowMsg, setExclusiveRowMsg] = useState({});

  // Todas las lecturas/escrituras de suscriptoras pasan por el worker, que usa el
  // secret de Firebase — el navegador ya no habla directo con cacusa_lovers.
  const loversApi = (path, opts) => fetch(`${LOVERS_WEBHOOK_URL}${path}`, {
    ...opts,
    headers: { 'X-Admin-Key': token, ...(opts?.headers || {}) },
  });

  // Lote mensual de envíos (11 oct): corte día 10, sale la 3ra semana.
  const [loteMes, setLoteMes] = useState(new Date().toISOString().slice(0, 7));
  const [lote, setLote] = useState(null);
  const runLote = async (dryRun, limpiarVacios = false) => {
    if (!dryRun && limpiarVacios && !confirm(`¿Quitar ${lote?.reparacion?.vacios?.length || 0} pedido(s) vacío(s) del sistema anterior? Son pedidos sin ningún dato del cliente que nadie ha tocado. No se puede deshacer. Después se crean los pedidos del lote que falten.`)) return;
    if (!dryRun && !limpiarVacios && !confirm(`¿Crear los pedidos del lote ${loteMes}? Se crea 1 pedido por suscriptora (no se duplican).`)) return;
    setLote(prev => ({ ...(prev || {}), loading: true }));
    try {
      const r = await loversApi('/admin/lovers-batch', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ month: loteMes, dryRun, ...(limpiarVacios ? { limpiarVacios: true } : {}) }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { setLote({ error: d.error || ('Error ' + r.status) }); return; }
      setLote(d);
    } catch (e) { setLote({ error: e.message }); }
  };

  // Sincronizar con Square (11 oct): recupera pagos cuyo aviso de Square nunca llegó.
  const [sync, setSync] = useState(null);
  // desde: si el toque anterior se cortó por el límite de llamadas de Cloudflare (plan
  // gratis), sigue desde la ficha donde quedó en vez de volver a empezar.
  const runSync = async (dryRun, desde = 0) => {
    if (!dryRun && !confirm('¿Registrar estos pagos y corregir estas fechas?')) return;
    setSync(prev => ({ ...(prev || {}), loading: true }));
    try {
      const r = await loversApi('/admin/lovers-sync', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dryRun, desde }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { setSync({ error: d.error || ('Error ' + r.status) }); return; }
      setSync(d);
      if (!dryRun) await load();
    } catch (e) { setSync({ error: e.message }); }
  };

  // Duplicados (11 oct): vista previa primero, fusión solo después de confirmar.
  const [dedupe, setDedupe] = useState(null); // null | {loading} | {grupos} | {error}
  const runDedupe = async (dryRun) => {
    if (!dryRun && !confirm('¿Fusionar estos duplicados? Se conserva la suscriptora más antigua de cada grupo y se borran las demás. No se puede deshacer.')) return;
    setDedupe(prev => ({ ...(prev || {}), loading: true }));
    try {
      const r = await loversApi('/admin/lovers-dedupe', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dryRun }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { setDedupe({ error: d.error || ('Error ' + r.status) }); return; }
      if (dryRun) setDedupe({ grupos: d.grupos || [] });
      else { setDedupe({ done: d.fusionadas || 0 }); await load(); }
    } catch (e) { setDedupe({ error: e.message }); }
  };

  const load = async () => {
    setLoading(true);
    try {
      const r = await loversApi('/admin/lovers');
      if (r.ok) {
        const { subscribers, photos: ph } = await r.json();
        const arr = Object.entries(subscribers || {}).map(([id, v]) => ({ id, ...v }));
        arr.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
        setSubs(arr);
        if (ph) setPhotos(prev => ({ ...prev, ...ph }));
      } else { setSubs([]); }
    } catch (_) { setSubs([]); }
    setLoading(false);
  };

  const savePhotos = async () => {
    setSavingPhotos(true);
    setPhotoMsg('');
    try {
      const r = await loversApi('/admin/lovers-photos', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(photos),
      });
      if (r.ok) {
        setPhotoMsg('✓ Fotos guardadas — recarga la página de Cacusa Lovers para verlas');
      } else {
        const data = await r.json().catch(() => ({}));
        setPhotoMsg(`⚠ Error al guardar: ${data.error || r.status}`);
      }
    } catch (err) { setPhotoMsg(`⚠ Error: ${err.message}`); }
    setSavingPhotos(false);
    setTimeout(() => setPhotoMsg(''), 6000);
  };

  useEffect(() => { load(); }, []);

  // Rollout único del cupón exclusivo del 5% a quienes ya estaban activas antes de
  // que este beneficio existiera — de ahí en adelante se activa solo con cada pago
  // confirmado (ver lovers-webhook-worker.js), esto es solo para no dejarlas
  // esperando hasta su próximo cobro.
  const sendExclusiveToAllActive = async () => {
    const activas = (subs || []).filter(s => s.estado_pago === 'activo');
    if (!activas.length) { setExclusiveMsg('No hay suscriptoras activas ahora mismo.'); return; }
    if (!confirm(`¿Enviar el cupón exclusivo del 5% a las ${activas.length} suscriptoras activas? Las que ya lo tengan se saltan solas.`)) return;
    setSendingExclusive(true);
    setExclusiveMsg('');
    try {
      const subscribers = activas.map(s => ({ email: s.email, lang: s.pais === 'Ecuador' ? 'es' : 'en' }));
      const d = await apiCall('lovers/exclusive-coupon/bulk', { token, subscribers });
      setExclusiveMsg(`✓ Enviado a ${d.sent} · ya lo tenían ${d.alreadyActive}${d.failed ? ` · fallaron ${d.failed}` : ''}`);
    } catch (e) {
      setExclusiveMsg(`⚠ Error: ${e.message}`);
    }
    setSendingExclusive(false);
  };

  // Para probar con una sola suscriptora (ej. antes de mandarle al resto), o para
  // reenviarle a alguien puntual que dice que no le llegó.
  const sendExclusiveToOne = async (s) => {
    setSendingExclusiveId(s.id);
    setExclusiveRowMsg(prev => ({ ...prev, [s.id]: null }));
    try {
      const d = await apiCall('lovers/exclusive-coupon/bulk', {
        token,
        subscribers: [{ email: s.email, lang: s.pais === 'Ecuador' ? 'es' : 'en' }],
      });
      const text = d.sent === 1 ? '✓ Enviado' : d.alreadyActive === 1 ? '✓ Ya lo tenía (activo)' : '⚠ No se pudo enviar';
      setExclusiveRowMsg(prev => ({ ...prev, [s.id]: text }));
    } catch (e) {
      setExclusiveRowMsg(prev => ({ ...prev, [s.id]: `⚠ Error: ${e.message}` }));
    }
    setSendingExclusiveId(null);
  };

  const updateEstado = async (sub, nuevoEstado) => {
    setUpdating(u => ({ ...u, [sub.id]: true }));
    try {
      const r = await loversApi(`/admin/lovers/${sub.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ estado_pago: nuevoEstado }),
      });
      if (r.ok) {
        const d = await r.json().catch(() => ({}));
        if (d.aviso) alert(d.aviso);
        setSubs(prev => prev.map(s => s.id === sub.id ? {
          ...s, estado_pago: d.estado_pago || nuevoEstado,
          ...(d.vence ? { vence: d.vence } : {}),
          ...(d.fecha_pausa !== undefined ? { fecha_pausa: d.fecha_pausa } : {}),
        } : s));
      } else {
        const d = await r.json().catch(() => ({}));
        alert(d.error || 'No se pudo actualizar el estado — intenta de nuevo.');
      }
    } catch (_) { alert('Error de conexión al actualizar el estado.'); }
    setUpdating(u => { const n = { ...u }; delete n[sub.id]; return n; });
  };

  const startEdit = s => {
    setEditingId(s.id);
    setEditForm({
      nombre: s.nombre || '', apellido: s.apellido || '',
      email: s.email || '', telefono: s.telefono || '',
      direccion: s.direccion || '', apto: s.apto || '', ciudad: s.ciudad || '',
      estado: s.estado || '', zip: s.zip || '', pais: s.pais || '',
      ultimo_pago: s.ultimo_pago || '', square_invoice_id: s.square_invoice_id || '',
      square_subscription_id: s.square_subscription_id || '',
      vence: s.vence || '',
      notas: s.notas || '',
    });
  };

  const saveEdit = async id => {
    setSavingEdit(true);
    try {
      const r = await loversApi(`/admin/lovers/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(editForm),
      });
      if (r.ok) {
        setSubs(prev => prev.map(s => s.id === id ? { ...s, ...editForm } : s));
        if (editingId === id) setEditingId(null); // no cerrar otra fila que se haya abierto mientras tanto
      } else {
        const d = await r.json().catch(() => ({}));
        alert(d.error ? `No se guardó: ${d.error}` : 'No se pudieron guardar los cambios — intenta de nuevo.');
      }
    } catch (_) { alert('Error de conexión al guardar.'); }
    setSavingEdit(false);
  };

  const ef = (k, v) => setEditForm(f => ({ ...f, [k]: v }));
  const nf = (k, v) => setNewForm(f => ({ ...f, [k]: v }));

  const createManual = async () => {
    setNewFormError('');
    if (!newForm.nombre.trim() || !newForm.email.trim()) {
      setNewFormError('Nombre y email son obligatorios.');
      return;
    }
    setSavingNew(true);
    try {
      const r = await loversApi('/admin/lovers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newForm),
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.ok) {
        setSubs(prev => [{ id: data.id, ...data.subscriber }, ...(prev || [])]);
        setNewForm(NEW_SUB_BLANK);
        setShowNewForm(false);
      } else {
        setNewFormError(data.error || 'No se pudo crear la suscripción — intenta de nuevo.');
      }
    } catch (e) { setNewFormError(`Error de conexión: ${e.message}`); }
    setSavingNew(false);
  };

  const deleteSubscriber = async s => {
    if (busyId === s.id) return; // ya hay una accion (cancelar/eliminar) en curso sobre esta fila
    const nombre = [s.nombre, s.apellido].filter(Boolean).join(' ') || s.email || 'esta suscriptora';
    if (!confirm(`¿Eliminar permanentemente a ${nombre}? Esta acción no se puede deshacer.`)) return;
    setBusyId(s.id); setDeletingId(s.id);
    try {
      const r = await loversApi(`/admin/lovers/${s.id}`, { method: 'DELETE' });
      if (r.ok) {
        setSubs(prev => prev.filter(x => x.id !== s.id));
        if (editingId === s.id) setEditingId(null);
      } else {
        alert('Error al eliminar');
      }
    } catch (_) { alert('Error al eliminar'); }
    setDeletingId(null); setBusyId(null);
  };

  const cancelInSquare = async s => {
    if (busyId === s.id) return; // ya hay una accion (cancelar/eliminar) en curso sobre esta fila
    // Cobro por factura (2 oct): no hay suscripción en Square que cancelar — se anula la
    // factura pendiente (si hay) y ya no se le generan más.
    if (s.modo_cobro === 'factura') {
      const nombreF = [s.nombre, s.apellido].filter(Boolean).join(' ') || s.email || 'esta suscriptora';
      if (!confirm(`¿Cancelar la membresía de ${nombreF}? Se anula su factura pendiente en Square y no se le mandan más facturas.`)) return;
      setBusyId(s.id); setCancelingId(s.id);
      try {
        const r = await loversApi('/admin/cancel-lovers-invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firebaseKey: s.id }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok && data.ok) {
          setSubs(prev => prev.map(x => x.id === s.id
            ? { ...x, estado_pago: 'cancelado', fecha_cancelacion: new Date().toISOString().slice(0, 10), factura_actual: '' }
            : x));
        } else {
          alert(`No se pudo cancelar: ${data.error || r.status}`);
        }
      } catch (e) { alert(`Error al cancelar: ${e.message}`); }
      setBusyId(null);
      setCancelingId(null);
      return;
    }
    if (!s.square_subscription_id) {
      alert('Esta suscriptora no tiene un Subscription ID guardado — no se puede cancelar automáticamente. Cancélala manualmente desde Square Dashboard → Subscriptions.');
      return;
    }
    const nombre = [s.nombre, s.apellido].filter(Boolean).join(' ') || s.email || 'esta suscriptora';
    if (!confirm(`¿Cancelar la suscripción de ${nombre} en Square? El cobro recurrente se detiene de inmediato. Esta acción no se puede deshacer desde aquí.`)) return;
    setBusyId(s.id); setCancelingId(s.id);
    try {
      const r = await loversApi('/admin/cancel-subscription', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subscriptionId: s.square_subscription_id, firebaseKey: s.id }),
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.ok) {
        setSubs(prev => prev.map(x => x.id === s.id
          ? { ...x, estado_pago: 'cancelado', fecha_cancelacion: new Date().toISOString().slice(0, 10) }
          : x));
      } else {
        alert(`No se pudo cancelar en Square: ${data.error || r.status}`);
      }
    } catch (e) { alert(`Error al cancelar: ${e.message}`); }
    setBusyId(null);
    setCancelingId(null);
  };

  const estadoColor = e => ({ 'activo': '#22c55e', 'pendiente': '#f59e0b', 'cancelado': '#ef4444', 'pago_fallido': '#dc2626', 'vencido': '#B45309', 'pausado': '#6B7280' }[e] || '#7A6B85');
  const estadoLabel = e => ({ 'activo': 'Activo ✓', 'pendiente': 'Pendiente', 'cancelado': 'Cancelado', 'pago_fallido': 'Pago fallido ⚠️', 'vencido': 'Sin pagar (pausada)', 'pausado': 'En pausa ⏸' }[e] || e || 'Pendiente');
  // Solo se muestra como link una URL real de Square (la factura pendiente).
  const isSquareUrl = u => /^https:\/\/[a-z0-9.-]*square(up)?\.(com|site|link)\//i.test(u || '');
  // Las fechas guardadas como AAAA-MM-DD (último pago, válido hasta, inscripción) se leían como
  // medianoche UTC y en Ecuador (UTC-5) salían UN DÍA ANTES (2026-10-03 → "02 oct"): se formatean en UTC.
  const fmt = iso => {
    try {
      const soloDia = /^\d{4}-\d{2}-\d{2}$/.test(iso || '');
      return new Date(soloDia ? iso + 'T12:00:00Z' : iso).toLocaleDateString('es', { day:'2-digit', month:'short', year:'numeric', ...(soloDia ? { timeZone: 'UTC' } : {}) });
    } catch { return iso || '—'; }
  };
  const todayIso = new Date().toISOString().slice(0, 10);
  // ¿La suscripción 'activo' tiene el pago al día? (caso real del 12 oct: salía "Activo"
  // sin ningún pago registrado y no había forma de notarlo). Misma regla que pagoAlDia()
  // en cacusa-lovers-webhook (que además avisa por push). Solo marca, no cambia el estado.
  const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const isoOk = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
  const pagoAlDia = s => {
    if (!s || s.estado_pago !== 'activo') return { ok: true };
    const vence = isoOk(s.vence) ? s.vence : '';
    if (s.metodo_pago === 'manual') {
      if (!vence) return { ok: false, motivo: 'Pago manual sin fecha "Válido hasta"' };
      return vence >= todayIso ? { ok: true } : { ok: false, motivo: `Pago manual vencido el ${fmt(vence)}` };
    }
    if (s.modo_cobro === 'factura' && vence) {
      return addDays(vence, 7) >= todayIso ? { ok: true } : { ok: false, motivo: `Factura sin pagar desde el ${fmt(vence)}` };
    }
    if (!isoOk(s.ultimo_pago)) return { ok: false, motivo: 'Sin ningún pago registrado' };
    const anual = /anual|annual/i.test(String(s.plan || ''));
    return s.ultimo_pago >= addDays(todayIso, anual ? -370 : -35) ? { ok: true }
      : { ok: false, motivo: `No llegó el cobro siguiente al ${fmt(s.ultimo_pago)}` };
  };

  return (
    <div>
      <div style={{ fontWeight: 800, fontSize: 18, color: '#1A1118', marginBottom: 4 }}>Cacusa Lovers ♡</div>
      <div style={{ fontSize: 13, color: '#7A6B85', marginBottom: 20 }}>Suscriptoras del club mensual $19.99/mes. Datos guardados al momento de procesar el pago.</div>

      {/* ── Alta manual (clientas que pagan por transferencia, sin suscripción recurrente en Square) ── */}
      {/* Herramientas avanzadas (11 oct): el lote, la sincronización con Square y la revisión
          de duplicados corren solos cada día — esto queda cerrado por defecto para no confundir. */}
      <details style={{ marginBottom: 16 }}>
        <summary style={{ cursor: 'pointer', fontSize: 13, fontWeight: 700, color: '#7A6B85', padding: '8px 0' }}>
          Herramientas avanzadas (no hace falta usarlas: el lote y Square se actualizan solos cada día)
        </summary>
        <div style={{ marginTop: 10 }}>
      <div style={{ background: 'white', borderRadius: 16, border: '1px solid #EDE8EA', padding: '20px 24px', marginBottom: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 14, color: '#1A1118', marginBottom: 4 }}>Lote de envío del mes</div>
            <div style={{ fontSize: 12, color: '#7A6B85' }}>Todas las cajas salen juntas del 15 al 21. Entra quien pagó hasta el día 10 (anuales y manuales vigentes, cada mes). Se arma solo desde el día 11.</div>
          </div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
            <label htmlFor="loteMes" style={{ position: 'absolute', width: 1, height: 1, overflow: 'hidden', clip: 'rect(0 0 0 0)' }}>Mes del lote</label>
            <input id="loteMes" type="month" value={loteMes} onChange={e => { setLoteMes(e.target.value); setLote(null); }}
              style={{ padding: '7px 10px', borderRadius: 8, border: '1px solid #e0e0e0', fontFamily: 'inherit', fontSize: 12 }} />
            <button onClick={() => runLote(true)} disabled={lote?.loading}
              style={{ background: 'white', color: '#C0336E', border: '1.5px solid #C0336E', borderRadius: 999, padding: '9px 20px', fontFamily: 'inherit', fontWeight: 700, fontSize: 13, cursor: 'pointer', whiteSpace: 'nowrap', opacity: lote?.loading ? .5 : 1 }}>
              {lote?.loading ? 'Revisando…' : 'Ver lote'}
            </button>
          </div>
        </div>
        {lote && !lote.loading && (
          <div role="status" aria-live="polite" style={{ marginTop: 14, fontSize: 12, color: '#5A4A60', lineHeight: 1.6 }}>
            {lote.error && <div style={{ color: '#B3261E' }}>⚠ {lote.error}</div>}
            {lote.dryRun === false && <div style={{ color: '#2C6149' }}>✓ Listo: {lote.creados || 0} pedido(s) nuevo(s) en Pedidos (filtro "Lote Lovers").</div>}
            {lote.dryRun === false && lote.pendientes > 0 && <div style={{ color: '#B45309' }}>Faltan {lote.pendientes} por el límite de Cloudflare: vuelve a tocar "Crear pedidos del lote" (no se duplican), o se crean solas mañana.</div>}
            {lote.incluidas && (
              <div>
                <strong>{lote.incluidas.length} caja(s) en el lote {lote.month}:</strong>
                {lote.incluidas.map(p => <div key={p.id}>· {p.nombre} — {p.motivo}{p.ciudad ? ` — ${p.ciudad}` : ''}</div>)}
              </div>
            )}
            {lote.yaConPedido && lote.yaConPedido.length > 0 && (
              <div style={{ marginTop: 6, color: '#7A6B85' }}>Ya están trabajando su pedido de este ciclo (no se crea otro): {lote.yaConPedido.map(p => p.nombre).join(', ')}</div>
            )}
            {lote.reparacion && (lote.reparacion.adoptados.length + lote.reparacion.completados.length) > 0 && (
              <div style={{ marginTop: 6, color: '#2C6149' }}>
                {lote.dryRun === false ? '✓ Pedidos viejos completados con su dirección' : 'Se completarán con la dirección de su ficha (pedidos del sistema anterior)'}: {[...lote.reparacion.adoptados, ...lote.reparacion.completados].map(p => p.nombre).join(', ')}
              </div>
            )}
            {lote.reparacion && lote.reparacion.borrados.length > 0 && (
              <div style={{ marginTop: 6, color: '#2C6149' }}>
                {lote.dryRun === false ? '✓ Duplicados quitados' : 'Se quitarán por duplicado (vacíos y sin trabajar)'}: {lote.reparacion.borrados.map(p => p.nombre).join(', ')}
              </div>
            )}
            {lote.reparacion && lote.reparacion.vacios && lote.reparacion.vacios.length > 0 && (
              <div style={{ marginTop: 6, color: '#B45309' }}>
                <strong>Pedidos viejos vacíos sin dueña ({lote.reparacion.vacios.length}):</strong>{' '}
                {lote.reparacion.vacios.map(p => `${p.nombre} (${p.fecha})`).join(', ')}
                {lote.dryRun && (
                  <div>
                    <button onClick={() => runLote(false, true)}
                      style={{ marginTop: 6, background: 'white', color: '#B45309', border: '1.5px solid #B45309', borderRadius: 999, padding: '6px 14px', fontFamily: 'inherit', fontWeight: 700, fontSize: 12, cursor: 'pointer' }}>
                      Quitar estos pedidos vacíos
                    </button>
                  </div>
                )}
              </div>
            )}
            {lote.reparacion && lote.reparacion.sinResolver.length > 0 && (
              <div style={{ marginTop: 6, color: '#B45309' }}>
                ⚠ Tienen un pedido duplicado que ya tocaron (no se borra solo, revísalo en Pedidos): {lote.reparacion.sinResolver.map(p => p.nombre).join(', ')}
              </div>
            )}
            {lote.sinDireccion && lote.sinDireccion.length > 0 && (
              <div style={{ marginTop: 6, color: '#B45309' }}>Sin dirección (no se crea pedido hasta completarla): {lote.sinDireccion.map(p => p.nombre).join(', ')}</div>
            )}
            {lote.fueraDelLote && lote.fueraDelLote.length > 0 && (
              <div style={{ marginTop: 6, color: '#7A6B85' }}>

// ── Coupons Tab ─────────────────────────────────────────────────────────────
function CouponsTab({ token }) {
  const [coupons, setCoupons]   = useState(null);
  const [loading, setLoading]   = useState(true);
  const [form, setForm]         = useState({ code:'', type:'percent', amount:'10', maxUses:'', expiresAt:'', note:'' });
  const [creating, setCreating] = useState(false);
  const [createMsg, setCreateMsg] = useState('');
  const [useMsg, setUseMsg]     = useState({});

  const load = async () => {
    setLoading(true);
    try {
      const data = await apiCall('coupon/list', { token });
      setCoupons(Array.isArray(data.coupons) ? data.coupons : []);
    } catch(_) { setCoupons([]); }
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const setF = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const create = async () => {
    if (!form.code.trim()) { setCreateMsg('❌ Ingresa un código.'); return; }
    const amount = parseFloat(form.amount);
    // 'freeship' anula el costo de envío; no lleva monto (el Worker lo fuerza a 0).
    if (form.type !== 'freeship') {
      if (!amount || amount <= 0) { setCreateMsg('❌ Monto/porcentaje inválido.'); return; }
      if (form.type === 'percent' && amount > 100) { setCreateMsg('❌ Máximo 100%.'); return; }
    }
    setCreating(true); setCreateMsg('');
    try {
      const data = await apiCall('coupon/create', {
        token,
        code: form.code.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,''),
        type: form.type, amount,
        maxUses: form.maxUses ? parseInt(form.maxUses) : null,
        expiresAt: form.expiresAt || null,
        note: form.note.trim()
      });
      if (!data.coupon) throw new Error(data.error || 'Error');
      setCoupons(prev => [data.coupon, ...(prev || [])]);
      setCreateMsg(`✅ Creado: ${data.coupon.code}`);
      setForm({ code:'', type:'percent', amount:'10', maxUses:'', expiresAt:'', note:'' });
    } catch(e) { setCreateMsg('❌ ' + (e.message || 'Error al crear.')); }
    setCreating(false);
  };

  const deactivate = async code => {
    if (!confirm(`¿Desactivar el cupón ${code}?`)) return;
    try {
      await apiCall('coupon/deactivate', { token, code });
      setCoupons(prev => prev.map(c => c.code===code ? {...c,active:false} : c));
    } catch(_) { alert('Error al desactivar'); }
  };

  const deleteCoupon = async code => {
    if (!confirm(`¿Eliminar permanentemente el cupón ${code}? Esta acción no se puede deshacer.`)) return;
    try {
      await apiCall('coupon/delete', { token, code });
      setCoupons(prev => prev.filter(c => c.code !== code));
    } catch(_) { alert('Error al eliminar'); }
  };

  const registerUse = async code => {
    try {
      const data = await apiCall('coupon/use', { token, code });
      if (!data.coupon) throw new Error();
      setCoupons(prev => prev.map(c => c.code===code ? data.coupon : c));
      setUseMsg(m => ({...m, [code]:'✅ Uso registrado'}));
      setTimeout(() => setUseMsg(m => { const n={...m}; delete n[code]; return n; }), 3000);
    } catch(_) { setUseMsg(m => ({...m, [code]:'❌ Error'})); }
  };

  const inp = { padding:'10px 13px', border:'1.5px solid #e4e4e4', borderRadius:10, fontSize:14, outline:'none', background:'white' };
  const lbl = { fontSize:11, fontWeight:600, color:'#6B6B6B', textTransform:'uppercase', letterSpacing:'.1em', marginBottom:5, display:'block' };

  return (
    <div style={{ maxWidth:640, margin:'0 auto', paddingBottom:40 }}>
      {/* Formulario de creación */}
      <div style={{ background:'white', borderRadius:16, padding:'20px 22px', marginBottom:20, boxShadow:'0 2px 12px rgba(0,0,0,.06)' }}>
        <div style={{ fontSize:13, fontWeight:700, color:'#7A6880', letterSpacing:'.1em', textTransform:'uppercase', marginBottom:14 }}>🏷️ Nuevo cupón de descuento</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:12 }}>
          <div>
            <label style={lbl}>Código</label>
            <input value={form.code} onChange={e=>setF('code',e.target.value.toUpperCase().replace(/[^A-Z0-9_-]/g,''))} placeholder="VERANO20"
              style={{ ...inp, width:'100%', boxSizing:'border-box', textTransform:'uppercase', letterSpacing:'.08em' }} />
          </div>
          <div>
            <label style={lbl}>Tipo</label>
            <select value={form.type} onChange={e=>setF('type',e.target.value)} style={{ ...inp, width:'100%', boxSizing:'border-box' }}>
              <option value="percent">% Porcentaje</option>
              <option value="fixed">$ Monto fijo</option>
              <option value="freeship">✦ Envío gratis</option>
            </select>
          </div>
          <div>
            {form.type === 'freeship' ? (
              <div style={{ ...lbl, fontWeight: 400, lineHeight: 1.5 }}>
                Anula el costo de envío del pedido. No descuenta dinero del subtotal.
              </div>
            ) : (<>
              <label style={lbl}>{form.type==='percent'?'Porcentaje (1-100)':'Monto ($)'}</label>
              <input type="number" min="1" step={form.type==='percent'?'1':'0.01'} value={form.amount} onChange={e=>setF('amount',e.target.value)}
                style={{ ...inp, width:'100%', boxSizing:'border-box' }} />
            </>)}
          </div>
          <div>
            <label style={lbl}>Usos máximos</label>
            <input type="number" min="1" step="1" value={form.maxUses} onChange={e=>setF('maxUses',e.target.value)} placeholder="Ilimitado"
              style={{ ...inp, width:'100%', boxSizing:'border-box' }} />
          </div>
          <div>
            <label style={lbl}>Vence el</label>
            <input type="date" value={form.expiresAt} onChange={e=>setF('expiresAt',e.target.value)} style={{ ...inp, width:'100%', boxSizing:'border-box' }} />
          </div>
          <div>
            <label style={lbl}>Nota interna</label>
            <input value={form.note} onChange={e=>setF('note',e.target.value)} placeholder="Campaña verano…" style={{ ...inp, width:'100%', boxSizing:'border-box' }} />
          </div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <button onClick={create} disabled={creating}
            style={{ padding:'11px 28px', background:'linear-gradient(135deg,#C0336E,#9B5DE5)', color:'white', border:'none', borderRadius:99, fontSize:14, fontWeight:700, cursor:'pointer', opacity:creating?.6:1 }}>
            {creating ? '⏳ Creando…' : '+ Crear cupón'}
          </button>
          {createMsg && <span role="status" aria-live="polite" style={{ fontSize:13, fontWeight:600, color:createMsg.startsWith('✅')?'#065F46':'#DC2626' }}>{createMsg}</span>}
        </div>
      </div>

      {/* Lista de cupones */}
      <div style={{ background:'white', borderRadius:16, padding:'20px 22px', boxShadow:'0 2px 12px rgba(0,0,0,.06)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
          <div style={{ fontSize:13, fontWeight:700, color:'#7A6880', letterSpacing:'.1em', textTransform:'uppercase' }}>Cupones creados</div>
          <button onClick={load} style={{ fontSize:12, color:'#9B5DE5', fontWeight:600, cursor:'pointer', background:'none', border:'none' }}>↺ Recargar</button>
        </div>
        {loading && <div style={{ textAlign:'center', padding:'24px 0', color:'#767676', fontSize:13 }}>Cargando…</div>}
        {!loading && (!coupons || coupons.length===0) && <div style={{ textAlign:'center', padding:'24px 0', color:'#767676', fontSize:13 }}>No hay cupones creados aún</div>}
        {!loading && coupons && coupons.map(c => {
          const expired    = c.expiresAt && new Date(c.expiresAt + 'T23:59:59') < new Date();
          const exhausted  = c.maxUses != null && c.usedCount >= c.maxUses;
          const statusOk   = c.active && !expired && !exhausted;
          return (
            <div key={c.code} style={{ padding:'12px 0', borderBottom:'1px solid #f3f0f5' }}>
              <div style={{ display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
                <code style={{ fontSize:13, fontWeight:700, color:'#333', letterSpacing:'.05em', background:'#F5F0FF', padding:'2px 8px', borderRadius:6 }}>{c.code}</code>
                <span style={{ fontSize:12, fontWeight:700, padding:'2px 9px', borderRadius:99,
                  background:statusOk?'#DCFCE7':'#F3F4F6', color:statusOk?'#166534':'#6B7280' }}>
                  {statusOk ? '✓ Activo' : expired ? 'Vencido' : exhausted ? 'Agotado' : 'Inactivo'}
                </span>
                <span style={{ fontSize:13, color:'#333', fontWeight:700 }}>
                  {c.type==='freeship' ? 'ENVÍO GRATIS' : c.type==='percent' ? `${c.amount}% OFF` : `$${(c.amount||0).toFixed(2)} OFF`}
                </span>
                <span style={{ fontSize:11, color:'#767676' }}>
                  Usos: {c.usedCount||0}{c.maxUses!=null?`/${c.maxUses}`:''}
                  {c.expiresAt ? ` · Vence: ${c.expiresAt}` : ''}
                  {c.note ? ` · ${c.note}` : ''}
                </span>
              </div>
              <div style={{ display:'flex', gap:6, marginTop:8, flexWrap:'wrap', alignItems:'center' }}>
                {statusOk && (
                  <button onClick={()=>registerUse(c.code)}
                    style={{ padding:'5px 12px', borderRadius:8, border:'1.5px solid #9B5DE5', background:'#F5F0FF', fontSize:12, fontWeight:700, cursor:'pointer', color:'#9B5DE5' }}>
                    +1 Uso (confirmar pago)
                  </button>
                )}
                {useMsg[c.code] && <span style={{ fontSize:11, fontWeight:600, color:useMsg[c.code].startsWith('✅')?'#065F46':'#DC2626' }}>{useMsg[c.code]}</span>}
                {c.active && (
                  <button onClick={()=>deactivate(c.code)}
                    style={{ padding:'5px 12px', borderRadius:8, border:'1.5px solid #FFB3C1', background:'white', fontSize:12, fontWeight:600, cursor:'pointer', color:'#DC2626' }}>
                    Desactivar
                  </button>
                )}
                <button onClick={()=>deleteCoupon(c.code)}
                  style={{ padding:'5px 12px', borderRadius:8, border:'1.5px solid #eee', background:'white', fontSize:12, fontWeight:600, cursor:'pointer', color:'#6B6B6B' }}>
                  Eliminar
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ComboForm({ combo, products, onSave, onClose }) {
  const [form, setForm] = useState(combo
    ? { ...combo }
    : { id: null, name: '', items: [], price: '', imageUrl: '', available: true });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleItem = id => setForm(f => {
    const items = f.items.includes(id) ? f.items.filter(x => x !== id) : [...f.items, id];
    return { ...f, items };
  });
  const save = () => {
    if (!form.name.trim() || !form.price || form.items.length < 2) return;
    onSave({ ...form, id: form.id || Date.now(), price: Number(form.price), available: form.available !== false });
  };
  const origTotal = form.items.reduce((s, id) => {
    const p = products.find(x => x.id === id);
    return s + (p ? Number(p.price) : 0);
  }, 0);
  const inp = { padding: '10px 13px', border: '1.5px solid #e4e4e4', borderRadius: 10, fontSize: 14, outline: 'none', width: '100%', boxSizing: 'border-box', background: 'white' };
  const lbl = { display: 'block', fontSize: 11, fontWeight: 600, color: '#777', letterSpacing: '.11em', textTransform: 'uppercase', marginBottom: 5 };
  return (
    <div style={{ background: '#FAF7FB', borderRadius: 14, padding: '18px 16px', marginBottom: 20, border: '1px solid #EDE8EA' }}>
      <div style={{ fontWeight: 800, fontSize: 15, color: '#1A1118', marginBottom: 14 }}>{form.id ? '✏️ Editar Combo' : '➕ Nuevo Combo'}</div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 12 }}>
        <div style={{ gridColumn: 'span 2' }}>
          <label style={lbl}>Nombre del combo *</label>
          <input value={form.name} onChange={e => set('name', e.target.value)} placeholder="Set de aretes dorados" style={inp} />
        </div>
        <div>
          <label style={lbl}>Precio del combo *</label>
          <input type="number" min="0" step="0.01" value={form.price} onChange={e => set('price', e.target.value)} placeholder="45.00" style={inp} />
        </div>
        <div>
          <label style={lbl}>URL de imagen (opcional)</label>
          <input value={form.imageUrl || ''} onChange={e => set('imageUrl', e.target.value)} placeholder="https://..." style={inp} />
        </div>
      </div>
      {form.price && origTotal > 0 && Number(form.price) < origTotal && (
        <div style={{ fontSize: 12, color: '#10B981', fontWeight: 600, marginBottom: 10 }}>
          💰 Ahorro vs. precio individual: ${(origTotal - Number(form.price)).toFixed(2)} (de ${origTotal.toFixed(2)})
        </div>
      )}
      <div style={{ marginBottom: 14 }}>
        <label style={lbl}>Productos del combo (mínimo 2) *</label>
        <div style={{ maxHeight: 200, overflowY: 'auto', border: '1.5px solid #e4e4e4', borderRadius: 10, background: 'white' }}>
          {products.filter(p => p.available !== false).map(p => (
            <label key={p.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 13px', cursor: 'pointer', borderBottom: '1px solid #f5f5f5', fontSize: 13 }}>
              <input type="checkbox" checked={form.items.includes(p.id)} onChange={() => toggleItem(p.id)}
                style={{ width: 15, height: 15, accentColor: '#E85D8A' }} />
              <span style={{ flex: 1 }}>{p.name}</span>
              <span style={{ color: '#7A6B85', fontSize: 12 }}>${p.price}</span>
            </label>
          ))}
        </div>
        {form.items.length > 0 && <div style={{ fontSize: 11, color: '#7A6880', marginTop: 4 }}>{form.items.length} producto(s) seleccionado(s)</div>}
      </div>
      <div style={{ display: 'flex', gap: 10 }}>
        <button onClick={onClose} style={{ flex: 1, padding: 12, border: '1.5px solid #ddd', borderRadius: 99, color: '#666', fontSize: 14, fontWeight: 600, cursor: 'pointer', background: 'white' }}>Cancelar</button>
        <button onClick={save} disabled={!form.name || !form.price || form.items.length < 2}
          style={{ flex: 2, padding: 12, background: 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', borderRadius: 99, fontSize: 14, fontWeight: 700, opacity: (!form.name || !form.price || form.items.length < 2) ? .5 : 1, cursor: 'pointer', border: 'none' }}>
          {form.id ? '💾 Guardar Combo' : '+ Crear Combo'}
        </button>
      </div>
    </div>
  );
}

function DescuentosTab({ products, combos, setCombos, onEditProduct }) {
  const [section, setSection]         = useState(null);
  const [showComboForm, setShowComboForm] = useState(false);

  const activePromos = products.filter(p => p.promo && p.promo.price && (!p.promo.endsAt || new Date(p.promo.endsAt) >= now));

  if (section === null) {
    return (
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>

          <div style={{ fontSize: 40, marginBottom: 10 }}>🏷️</div>
          <div style={{ fontWeight: 800, fontSize: 16, color: '#1A1118', marginBottom: 4 }}>Promociones</div>
          <div style={{ fontSize: 12, color: '#7A6B85' }}>{activePromos.length} {activePromos.length === 1 ? 'activa' : 'activas'}</div>

        <div onClick={() => setSection('combos')} style={card}>

          <div style={{ fontWeight: 800, fontSize: 16, color: '#1A1118', marginBottom: 4 }}>Combos</div>

  if (section === 'promos') {
    return (
      <div>
        <button onClick={() => setSection(null)} style={backBtn}>← Volver</button>
        <div style={{ fontWeight: 800, fontSize: 18, color: '#1A1118', marginBottom: 16 }}>🏷️ Productos en promoción</div>

        {activePromos.length === 0 ? (
          <div style={{ textAlign: 'center', padding: '60px 0', color: '#7A6B85' }}>
            <div style={{ fontSize: 44, marginBottom: 12 }}>🏷️</div>
            <div style={{ fontWeight: 600 }}>No hay productos en promoción.</div>
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {activePromos.map(p => (

                  style={{ padding: '8px 16px', background: 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', borderRadius: 99, fontWeight: 700, fontSize: 12, border: 'none', cursor: 'pointer', whiteSpace: 'nowrap' }}>
                  ✏️ Editar
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  if (section === 'combos') {
    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 20 }}>
          <button onClick={() => { setSection(null); setShowComboForm(false); setEditCombo(null); }} style={backBtn}>← Volver</button>
          <div style={{ flex: 1, fontWeight: 800, fontSize: 18, color: '#1A1118' }}>🎁 Combos y Paquetes</div>
          <button onClick={() => { setEditCombo(null); setShowComboForm(true); }}
            style={{ padding: '9px 18px', background: 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', borderRadius: 99, fontWeight: 700, fontSize: 13, border: 'none', cursor: 'pointer' }}>
            + Nuevo Combo
          </button>
        </div>
        {showComboForm && (
          <ComboForm combo={editCombo} products={products}
            onSave={c => {
              setCombos(prev => {
                const i = prev.findIndex(x => x.id === c.id);
                return i > -1 ? prev.map((x, j) => j === i ? c : x) : [...prev, c];
              });
              setShowComboForm(false); setEditCombo(null);
            }}
            onClose={() => { setShowComboForm(false); setEditCombo(null); }}
          />
        )}
        {combos.length === 0 && !showComboForm ? (
          <div style={{ textAlign: 'center', padding: '60px 0', color: '#7A6B85' }}>
            <div style={{ fontSize: 44, marginBottom: 12 }}>🎁</div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {combos.map(c => (
              <div key={c.id} style={{ background: 'white', borderRadius: 14, padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 12, boxShadow: '0 1px 8px rgba(0,0,0,.06)', opacity: c.available === false ? .5 : 1 }}>
                {c.imageUrl && <img src={c.imageUrl} style={{ width: 52, height: 52, borderRadius: 10, objectFit: 'cover', flexShrink: 0 }} alt={c.name} />}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 14, color: '#1A1118' }}>{c.name}</div>
                  <div style={{ fontSize: 11, color: '#7A6B85' }}>{(c.items || []).length} productos · <strong style={{ color: '#E85D8A' }}>${Number(c.price).toFixed(2)}</strong></div>
                  {c.available === false && <div style={{ fontSize: 11, color: '#F59E0B', fontWeight: 600, marginTop: 2 }}>⏸ Desactivado</div>}

                <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
                  <button onClick={() => setCombos(prev => prev.map(x => x.id === c.id ? { ...x, available: x.available === false ? true : false } : x))}
                    style={{ padding: '7px 12px', borderRadius: 99, fontSize: 12, fontWeight: 600, border: '1.5px solid #ddd', cursor: 'pointer', background: 'white', color: '#666' }}>

                    style={{ padding: '7px 12px', borderRadius: 99, fontSize: 12, fontWeight: 600, border: 'none', background: '#EDE8EA', cursor: 'pointer', color: '#333' }}>✏️</button>

                    style={{ padding: '7px 12px', borderRadius: 99, fontSize: 12, fontWeight: 600, border: 'none', background: '#FEE2E2', cursor: 'pointer', color: '#DC2626' }}>✕</button>

              </div>
            ))}
          </div>
        )}
      </div>
    );
  }
}

function MercadoTab({ products, token }) {
  const [surcharges, setSurcharges] = useState({});
  const [markets, setMarkets]       = useState({});
  const [fbLoading, setFbLoading]   = useState(true);
  const [saving, setSaving]         = useState(false);
  const [msg, setMsg]               = useState('');
  const [section, setSection]       = useState(null); // null | 'surcharge' | 'market'
  const [search, setSearch]         = useState('');
  const [openCats, setOpenCats]     = useState({});

  useEffect(() => {
    (async () => {
      try {
        const [sr, mk] = await Promise.all([
          apiCall('pub/surcharges', {}),
          apiCall('pub/markets', {})
        ]);
        setSurcharges(sr.surcharges && typeof sr.surcharges === 'object' ? sr.surcharges : {});
        setMarkets(mk.markets && typeof mk.markets === 'object' ? mk.markets : {});
      } catch(_) {}
      setFbLoading(false);
    })();
  }, []);

  const save = async () => {
    setSaving(true); setMsg('');
    try {
      const [r1, r2] = await Promise.all([
        apiCall('surcharge/save', { token, surcharges }),
        apiCall('market/save',    { token, markets })
      ]);
      if (!r1.ok || !r2.ok) throw new Error('Error');
      setMsg('✅ ¡Guardado!');
      setTimeout(() => setMsg(''), 4000);

      setMsg('❌ Error al guardar. Verifica tu conexión.');

    </div>
  );

// ── App ────────────────────────────────────────────────────────────────────
// ════════════════════════════════════════════════════════════════════════════
// Gestión (26 nov): Ventas, Clientas, Preparar pedidos (tablero + hoja) y Edición masiva.
// Todo se calcula en el navegador con lo que el panel ya carga (pedidos, productos, stock):
// no hay rutas nuevas en el Worker. Fechas en la hora local del dispositivo (el panel no usa
// otra zona horaria en ningún lado). Sin datos de clientas en el código: todo sale de los
// pedidos en tiempo de ejecución.
// ════════════════════════════════════════════════════════════════════════════
const SR_ONLY = { position: 'absolute', width: 1, height: 1, padding: 0, margin: -1, overflow: 'hidden', clip: 'rect(0,0,0,0)', whiteSpace: 'nowrap', border: 0 };
// Venta = todo pedido que no esté Cancelado. Canal: Lovers (pago 'Lovers' o con lote), Manual
// (lo creó una cuenta del panel: createdBy, igual que orderAllowsPieceLoad) y Tienda (el resto:
// checkout web con Square/Zelle/WhatsApp).
function orderIsSale(o) { return !!o && (o.estado || 'Nuevo') !== 'Cancelado' && !o.archivado && pagoEstadoOf(o) !== 'reembolsado'; }
// Estado del pago (wave 1). Pedidos viejos sin el campo: Tarjeta (Square) y cajas de Lovers =
// recibido; el resto (Zelle, transferencia, manual) = pendiente solo si sigue "Nuevo"; si ya avanzó,
// se asume cobrado.
const PAGO_LABEL = { pendiente: 'Por cobrar', recibido: 'Pago recibido', reembolsado: 'Reembolsado' };
function pagoEstadoOf(o) {
  if (!o) return 'pendiente';
  if (o.pagoEstado === 'pendiente' || o.pagoEstado === 'recibido' || o.pagoEstado === 'reembolsado') return o.pagoEstado;
  if (o.pago === 'Tarjeta' || isLoversBox(o)) return 'recibido';
  return (o.estado || 'Nuevo') === 'Nuevo' ? 'pendiente' : 'recibido';
}
function num0(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; }
// Desglose solo si el pedido lo trae (pedidos de la tienda: subtotal/envio/impuesto).
function orderHasBreakdown(o) { return !!o && typeof o.subtotal === 'number' && o.subtotal > 0; }
function orderShip(o) { return orderHasBreakdown(o) ? num0(o.envio) : 0; }
function orderTax(o) { return orderHasBreakdown(o) ? num0(o.impuesto) : 0; }
function orderRefunded(o) { return (Number(o && o.reembolsoCents) || 0) / 100; }
// Venta neta = subtotal − descuentos (sin envío ni impuesto) = total + tarjeta de regalo usada − envío − impuesto.
function orderNet(o) {
  const gc = num0(o && o.giftcard && o.giftcard.applied);
  return Math.max(0, orderTotal(o) + (orderHasBreakdown(o) ? gc - orderShip(o) - orderTax(o) : 0) - orderRefunded(o));
}
function orderChannel(o) { if (isLoversBox(o)) return 'lovers'; if (PANEL_USERS.includes(o && o.createdBy)) return 'manual'; return 'tienda'; }
const CHANNEL_LABEL = { tienda: 'Tienda web', manual: 'Manual (panel)', lovers: 'Cacusa Lovers' };
function orderTime(o) { const t = Date.parse(o && o.fecha); return Number.isFinite(t) ? t : NaN; }
function orderTotal(o) { const n = parseFloat(o && o.total); return Number.isFinite(n) ? n : 0; }
function lineQty(l) { const q = Number(l && l.qty); return Number.isInteger(q) && q > 0 ? q : 1; }
function linePrice(l) { const n = parseFloat(l && l.price); return Number.isFinite(n) ? n : 0; }
function fmtUsd(n) { return '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function dayStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function weekStart(d) { const x = dayStart(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; } // lunes
function monthStart(d) { const x = dayStart(d); x.setDate(1); return x; }
function localDayKey(t) { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDay(t, opts) { return new Date(t).toLocaleDateString('es-EC', opts || { day: 'numeric', month: 'short' }); }

function salesSummary(list) {
  const revenue = list.reduce((s, o) => s + orderNet(o), 0);
  const ship = list.reduce((s, o) => s + orderShip(o), 0), tax = list.reduce((s, o) => s + orderTax(o), 0);
  const gross = list.reduce((s, o) => s + Math.max(0, orderTotal(o) - orderRefunded(o)), 0);
  return { revenue, ship, tax, gross, count: list.length, avg: list.length ? revenue / list.length : 0 };
}
// Las cajas de Lovers se guardan en $0 (la suscripción se cobra con factura de Square, fuera del
// pedido): no entran en ingresos/ticket/top para no bajar el promedio; se cuentan aparte.
function computeSales(orders, products, now = new Date(), rangeDays = 30) {
  const nowT = now.getTime();
  const sales = (orders || []).filter(o => orderIsSale(o) && Number.isFinite(orderTime(o)));
  // Ingresos = solo pagos recibidos (wave 1); lo pendiente va aparte en "Por cobrar".
  const paid = sales.filter(o => orderChannel(o) !== 'lovers' && pagoEstadoOf(o) === 'recibido');
  const pendingList = sales.filter(o => orderChannel(o) !== 'lovers' && pagoEstadoOf(o) === 'pendiente');
  const porCobrar = { count: pendingList.length, amount: pendingList.reduce((s, o) => s + orderTotal(o), 0) };
  const between = (list, a, b) => list.filter(o => { const t = orderTime(o); return t >= a && t <= b; });
  const period = (start, prevStart) => {

    }

  if (seg === 'top') { const top = new Set([...list].filter(c => c.total > 0).sort((a, b) => b.total - a.total).slice(0, CRM_TOP_N).map(c => c.key)); out = out.filter(c => top.has(c.key)); }

          Para campañas escribe solo a quienes aceptaron recibir correos y respeta las bajas (la pestaña ✉ Marketing ya las respeta sola).
        </div>
        <button type="button" onClick={exportCsv} disabled={!filtered.length} aria-describedby="crmPrivacy" data-testid="crmExport"
          style={{ padding: '9px 16px', borderRadius: 99, border: 'none', background: filtered.length ? 'linear-gradient(135deg,#E8508A,#9B5DE5)' : '#ddd', color: 'white', fontWeight: 700, fontSize: 13, cursor: filtered.length ? 'pointer' : 'default', whiteSpace: 'nowrap' }}>
          ⬇ Exportar {filtered.length} a CSV

      <div role="status" aria-live="polite" style={{ fontSize: 12, color: '#15803D', minHeight: msg ? 18 : 0, marginBottom: msg ? 6 : 0 }}>{msg}</div>
      <div style={{ fontSize: 12, color: '#7A6880', marginBottom: 6 }} data-testid="crmCount">{filtered.length} de {list.length} clientas</div>
      <div style={{ background: 'white', borderRadius: 12, overflowX: 'auto', boxShadow: '0 1px 6px rgba(0,0,0,.05)' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 640 }} data-testid="crmTable">
          <caption style={SR_ONLY}>Lista de clientas</caption>
          <thead><tr><th scope="col" style={th}>Nombre</th><th scope="col" style={{ ...th, textAlign: 'right' }}>Total gastado</th><th scope="col" style={{ ...th, textAlign: 'right' }}>Pedidos</th><th scope="col" style={th}>Última compra</th><th scope="col" style={th}>Lovers</th><th scope="col" style={th}>Idioma</th></tr></thead>
          <tbody>
            {filtered.slice(0, 500).map(c => (
              <tr key={c.key}>
                <td style={td}><div style={{ fontWeight: 700 }}>{c.name || 'Sin nombre'}</div><div style={{ fontSize: 11, color: '#7A6880', wordBreak: 'break-all' }}>{[c.email, c.phone].filter(Boolean).join(' · ')}</div></td>
                <td style={{ ...td, textAlign: 'right', fontWeight: 700 }}>{fmtUsd(c.total)}</td>
                <td style={{ ...td, textAlign: 'right' }}>{c.orders}</td>
                <td style={{ ...td, whiteSpace: 'nowrap' }}>{Number.isFinite(c.last) ? fmtDay(c.last, { day: '2-digit', month: 'short', year: 'numeric' }) : '—'}</td>
                <td style={td}>{c.lovers ? '♡ Sí' : 'No'}</td>

          </tbody>
        </table>
      </div>
      {filtered.length > 500 && <div style={{ fontSize: 12, color: '#7A6880', marginTop: 6 }}>Se muestran las primeras 500 (el CSV trae las {filtered.length}).</div>}
    </div>
  );
}

// ── Preparar pedidos: tablero por estado ──
// Columnas = los estados reales del pedido (ORDER_STATES, sin Cancelado). Mover una tarjeta usa el
// mismo camino que el botón "→ estado" de la tarjeta (onStatusChange → order/update) y las mismas
// reglas: una caja de Lovers sin sus 2 joyas no pasa a Enviado/Entregado.
const BOARD_STATES = ['Nuevo', 'Confirmado', 'En proceso', 'Enviado', 'Entregado'];
const BOARD_HINT = { Nuevo: 'Por confirmar', Confirmado: 'Por preparar', 'En proceso': 'Preparando', Enviado: 'En camino', Entregado: 'Últimos 14 días' };
const BOARD_DONE_DAYS = 14;
function boardMoveProblem(order, to) {
  const from = order.estado || 'Nuevo';
  if (from === to) return 'Ya está en ' + to + '.';
  if (!BOARD_STATES.includes(to)) return 'Estado no válido.';
  if (from === 'Cancelado') return 'Un pedido cancelado no se mueve desde el tablero.';
  if (from === 'Entregado') return 'Un pedido entregado ya no vuelve atrás desde el tablero.';
  if (from === 'Enviado' && BOARD_STATES.indexOf(to) < BOARD_STATES.indexOf(from)) return 'Un pedido Enviado ya avisó el envío: no vuelve atrás desde el tablero.';
  if ((to === 'Enviado' || to === 'Entregado') && loversMissingPieces(order)) return loversBlockMsg(order);
  return '';
}
function orderLabel(o) { return o.numero ? '#' + o.numero : 'pedido ' + o.id; }
function FulfillmentBoard({ orders, products, onMove, onPrint }) {
  const [sel, setSel] = useState([]);
  const [msg, setMsg] = useState(null); // { text, err }
  const [dragId, setDragId] = useState(null);
  const now = Date.now();
  const visible = orders.filter(o => {
    const st = o.estado || 'Nuevo';
    if (!BOARD_STATES.includes(st)) return false;
    if (st === 'Entregado') { const t = orderTime(o); return Number.isFinite(t) && now - t <= BOARD_DONE_DAYS * 86400000; }
    return true;
  });
  const byId = new Map((products || []).map(p => [String(p.id), p]));
  const move = (o, to) => {
    const pr = boardMoveProblem(o, to);
    if (pr) { setMsg({ text: orderLabel(o) + ': ' + pr, err: true }); return; }
    onMove(o, to);
    setMsg({ text: '✓ ' + orderLabel(o) + ' → ' + to, err: false });
  };
  const toggle = id => setSel(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const selOrders = visible.filter(o => sel.includes(o.id));
  return (
    <div data-testid="board">
      <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', marginBottom: 10 }}>
        <span style={{ fontSize: 12, color: '#7A6880', flex: 1, minWidth: 200 }}>Mueve cada pedido con sus botones o arrastrándolo a otra columna. Marca varios para imprimir sus hojas de preparación juntas.</span>
        <button type="button" disabled={!selOrders.length} onClick={() => onPrint(selOrders)} data-testid="boardPrintSel"
          style={{ padding: '8px 14px', borderRadius: 99, border: '1.5px solid #D9C9EE', background: selOrders.length ? 'white' : '#F3EFF5', color: '#5B3F8A', fontWeight: 700, fontSize: 12, cursor: selOrders.length ? 'pointer' : 'default' }}>
          ▤ Imprimir hojas ({selOrders.length})
        </button>
        {selOrders.length > 0 && <button type="button" onClick={() => setSel([])} style={{ fontSize: 12, color: '#7A6880', textDecoration: 'underline' }}>Quitar selección</button>}
      </div>
      <div role={msg && msg.err ? 'alert' : 'status'} aria-live={msg && msg.err ? 'assertive' : 'polite'} data-testid="boardMsg"
        style={{ fontSize: 12, fontWeight: 600, borderRadius: 8, padding: msg ? '6px 10px' : 0, marginBottom: msg ? 10 : 0, background: msg ? (msg.err ? '#FEF3C7' : '#DCFCE7') : 'transparent', color: msg && msg.err ? '#92400E' : '#166534' }}>
        {msg ? msg.text : ''}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(220px,1fr))', gap: 10, alignItems: 'start' }}>
        {BOARD_STATES.map((st, ci) => {
          const col = visible.filter(o => (o.estado || 'Nuevo') === st).sort((a, b) => (orderTime(a) || 0) - (orderTime(b) || 0));
          return (
            <section key={st} aria-label={st + ': ' + col.length + ' pedido' + (col.length === 1 ? '' : 's')} data-testid={'boardCol-' + st}
              onDragOver={e => { if (dragId != null) e.preventDefault(); }}
              onDrop={e => { e.preventDefault(); const o = visible.find(x => String(x.id) === String(dragId)); setDragId(null); if (o && (o.estado || 'Nuevo') !== st) move(o, st); }}
              style={{ background: '#F7F3FA', borderRadius: 12, padding: 8, minWidth: 0, minHeight: 80 }}>
              <h3 style={{ fontSize: 12, fontWeight: 800, color: '#5B4A63', display: 'flex', alignItems: 'center', gap: 6, margin: '2px 4px 8px' }}>
                <span style={{ background: STATE_COLORS[st], color: 'white', padding: '2px 9px', borderRadius: 99, fontSize: 11 }}>{st}</span>
                <span style={{ fontWeight: 600, color: '#7A6880' }}>{BOARD_HINT[st]} · {col.length}</span>
              </h3>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {col.map(o => {
                  const items = (o.productos || []).filter(Boolean);
                  const miss = loversMissingPieces(o);
                  const prev = BOARD_STATES[ci - 1], next = BOARD_STATES[ci + 1];
                  const canBack = prev && st !== 'Enviado' && st !== 'Entregado';
                  return (
                    <article key={o.id} draggable onDragStart={e => { setDragId(o.id); try { e.dataTransfer.setData('text/plain', String(o.id)); e.dataTransfer.effectAllowed = 'move'; } catch (_) {} }} onDragEnd={() => setDragId(null)}
                      data-testid="boardCard" data-order={o.id}
                      style={{ background: 'white', borderRadius: 10, padding: 10, boxShadow: '0 1px 4px rgba(0,0,0,.06)', border: sel.includes(o.id) ? '2px solid #9B5DE5' : '2px solid transparent', cursor: 'grab' }}>
                      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 6 }}>
                        <input type="checkbox" id={'bsel-' + o.id} checked={sel.includes(o.id)} onChange={() => toggle(o.id)} style={{ marginTop: 3 }} />
                        <label htmlFor={'bsel-' + o.id} style={{ flex: 1, minWidth: 0, cursor: 'pointer' }}>
                          <span style={SR_ONLY}>Elegir para imprimir: </span>
                          <span style={{ display: 'block', fontSize: 13, fontWeight: 800, color: '#1A1118', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{orderFullName(o.cliente) || 'Cliente'}</span>
                          <span style={{ display: 'block', fontSize: 11, color: '#7A6880' }}>{orderLabel(o)} · {Number.isFinite(orderTime(o)) ? fmtDay(orderTime(o)) : ''}</span>
                        </label>
                        {isLoversBox(o) && <span style={{ fontSize: 10, fontWeight: 800, color: '#C0336E', background: '#FCE8F3', borderRadius: 99, padding: '2px 7px', flexShrink: 0 }}>♡ Lovers</span>}
                      </div>
                      <ul style={{ listStyle: 'none', margin: '6px 0', fontSize: 12, color: '#333' }}>
                        {items.slice(0, 4).map((l, i) => {
                          const cp = l.id != null ? byId.get(String(l.id)) : null;
                          return <li key={i} style={{ display: 'flex', gap: 4, alignItems: 'center', minWidth: 0 }}>{cp && cp.sku ? <SkuChip sku={normalizeSku(cp.sku)} /> : null}<span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{lineQty(l) > 1 ? lineQty(l) + '× ' : ''}{l.name}</span>{l.personalization ? <span title={'Personalización: ' + l.personalization} style={{ color: '#E8508A', flexShrink: 0 }}>✦</span> : null}</li>;
                        })}
                        {items.length > 4 && <li style={{ color: '#7A6880' }}>+{items.length - 4} más</li>}
                        {!items.length && <li style={{ color: '#7A6880', fontStyle: 'italic' }}>Sin piezas cargadas</li>}
                      </ul>
                      {miss > 0 && <div style={{ fontSize: 11, color: '#92400E', background: '#FEF3C7', borderRadius: 6, padding: '3px 6px', marginBottom: 6 }}>Faltan {miss} joya{miss === 1 ? '' : 's'} por cargar</div>}
                      <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                        {canBack && <button type="button" onClick={() => move(o, prev)} aria-label={'Mover ' + orderLabel(o) + ' a ' + prev}
                          style={{ padding: '5px 8px', borderRadius: 99, background: '#F3EFF5', color: '#5B4A63', fontSize: 11, fontWeight: 700 }}>← {prev}</button>}
                        {next && <button type="button" onClick={() => move(o, next)} aria-label={'Mover ' + orderLabel(o) + ' a ' + next}
                          style={{ padding: '5px 8px', borderRadius: 99, background: STATE_COLORS[next], color: 'white', fontSize: 11, fontWeight: 700 }}>{next} →</button>}
                        <button type="button" onClick={() => onPrint([o])} aria-label={'Hoja de preparación de ' + orderLabel(o)}
                          style={{ padding: '5px 8px', borderRadius: 99, background: 'white', border: '1px solid #D9C9EE', color: '#5B3F8A', fontSize: 11, fontWeight: 700, marginLeft: 'auto' }}>▤ Hoja</button>
                      </div>
                    </article>
                  );
                })}
                {!col.length && <div style={{ fontSize: 12, color: '#9A8BA3', textAlign: 'center', padding: '14px 0' }}>Vacío</div>}
              </div>
            </section>
          );
        })}
      </div>
    </div>
  );
}

// ── Hoja de preparación (imprimible) ──
// Una página por pedido. Nombre y dirección salen del pedido en tiempo de ejecución.
function PackingSlipView({ orders, products, onClose }) {
  const [host] = useState(() => { const d = document.createElement('div'); d.id = 'slipPrintHost'; return d; });
  const [qrs, setQrs] = useState({});
  const [err, setErr] = useState('');
  const byId = new Map((products || []).map(p => [String(p.id), p]));
  useEffect(() => {
    document.body.appendChild(host);
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    const first = host.querySelector('button'); if (first) first.focus();
    return () => { document.removeEventListener('keydown', onKey); host.remove(); };
  }, []);
  const skus = [...new Set(orders.flatMap(o => (o.productos || []).map(l => { const cp = l && l.id != null && !l.isCombo ? byId.get(String(l.id)) : null; return cp ? normalizeSku(cp.sku) : ''; }).filter(s => SKU_RE.test(s))))];
  useEffect(() => {
    let alive = true;
    if (!skus.length) return;
    loadVendor('qrcode').then(qrcode => { if (!alive) return; const m = {}; skus.forEach(s => { m[s] = qrDataUrl(qrcode, s); }); setQrs(m); })
      .catch(e => alive && setErr('No se pudieron generar los QR (' + ((e && e.message) || 'error') + '). La hoja se imprime igual con los códigos.'));
    return () => { alive = false; };
  }, [skus.join(',')]);
  const css = `
#slipPrintHost{position:fixed;inset:0;z-index:10000;background:#E9E4EC;overflow:auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#111}
#slipPrintHost .sp-bar{position:sticky;top:0;z-index:1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:white;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#slipPrintHost .sp-pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px}
#slipPrintHost .sp-page{width:100%;max-width:190mm;background:white;padding:12mm;box-shadow:0 2px 12px rgba(0,0,0,.12)}
#slipPrintHost h2{font-size:18pt;margin:0}
#slipPrintHost .sp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:10px}
#slipPrintHost .sp-meta{font-size:10pt;line-height:1.5}
#slipPrintHost .sp-r{text-align:right}
#slipPrintHost .sp-to{border:1px solid #999;border-radius:6px;padding:8px 10px;font-size:11pt;line-height:1.45;margin-bottom:12px}
#slipPrintHost table{width:100%;border-collapse:collapse;font-size:10.5pt}
#slipPrintHost th{text-align:left;border-bottom:1.5px solid #111;padding:4px}
#slipPrintHost td{border-bottom:1px solid #ccc;padding:6px 4px;vertical-align:middle}
#slipPrintHost td img{width:22mm;height:22mm;image-rendering:pixelated;display:block}
#slipPrintHost .sp-sku{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:12pt}
#slipPrintHost .sp-pers{font-weight:700}
#slipPrintHost .sp-check{margin-top:14px;font-size:11pt;display:flex;gap:18px;flex-wrap:wrap}
@media (max-width:600px){#slipPrintHost .sp-r{text-align:left}#slipPrintHost .sp-pages{padding:8px}#slipPrintHost .sp-page{padding:14px}#slipPrintHost td img{width:16mm;height:16mm}}
@media print{
  @page{margin:12mm}
  html,body{background:white!important}
  body>*:not(#slipPrintHost){display:none!important}
  #slipPrintHost{position:static;overflow:visible;background:white}
  #slipPrintHost .sp-bar{display:none}
  #slipPrintHost .sp-pages{padding:0;gap:0;display:block}
  #slipPrintHost .sp-page{max-width:none;box-shadow:none;padding:0;break-after:page;page-break-after:always}
  #slipPrintHost .sp-page:last-child{break-after:auto;page-break-after:auto}
}`;
  const btn = { padding: '8px 16px', borderRadius: 99, fontWeight: 700, fontSize: 13, cursor: 'pointer', border: '1.5px solid #D9C9EE', background: 'white', color: '#5B3F8A' };
  return ReactDOM.createPortal(
    <div role="dialog" aria-modal="true" aria-label="Hoja de preparación">
      <style>{css}</style>
      <div className="sp-bar">
        <button type="button" onClick={onClose} style={btn}>← Volver</button>
        <button type="button" onClick={() => window.print()} style={{ ...btn, background: 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', border: 'none' }}>⎙ Imprimir</button>
        <span style={{ fontSize: 12, color: '#5B4A63' }}>{orders.length} hoja{orders.length === 1 ? '' : 's'} de preparación</span>
        {err && <span role="alert" style={{ fontSize: 12, color: '#92400E' }}>{err}</span>}
      </div>
      <div className="sp-pages">
        {orders.map(o => {
          const c = o.cliente || {};
          const addr = [c.direccion, c.apto].filter(Boolean).join(', ');
          const city = [orderCiudad(c), c.estado, c.zip].filter(Boolean).join(', ');
          const items = (o.productos || []).filter(Boolean);
          return (
            <section className="sp-page" key={o.id} data-testid="slipPage">
              <div className="sp-head">
                <div><div style={{ fontSize: '9pt', letterSpacing: '.15em', fontWeight: 700 }}>CACUSA BY TAITUS</div><h2>Hoja de preparación</h2></div>
                <div className="sp-meta sp-r">
                  <div style={{ fontSize: '14pt', fontWeight: 800 }}>{orderLabel(o)}</div>
                  <div>{Number.isFinite(orderTime(o)) ? fmtDay(orderTime(o), { day: '2-digit', month: 'long', year: 'numeric' }) : ''}</div>
                  <div>{CHANNEL_LABEL[orderChannel(o)]}{o.lote ? ' · Lote ' + o.lote : ''} · {o.estado || 'Nuevo'}</div>

              <div className="sp-to" data-testid="slipShipTo">
                <div style={{ fontSize: '8.5pt', fontWeight: 700, letterSpacing: '.08em', marginBottom: 2 }}>ENVIAR A</div>

                {addr && <div>{addr}</div>}

                <tbody>
                  {items.map((l, i) => {
                    const cp = l.id != null && !l.isCombo ? byId.get(String(l.id)) : null;

                    return (

                    );

                  {!items.length && <tr><td colSpan={5} style={{ fontStyle: 'italic' }}>Todavía sin piezas cargadas{isLoversBox(o) ? ' (caja de Lovers: carga las 2 joyas antes de enviar)' : ''}.</td></tr>}

              </table>
