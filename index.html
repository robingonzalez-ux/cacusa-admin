  // Código escaneado o escrito → pieza (o mensaje claro si no existe).
  const resolveCode = raw => {
    const c = extractSku(raw);
    setErrMsg('');
    if (!c) { setCodeMsg('Escribe el código de la etiqueta (ej: AN001).'); return; }
    const p = findBySku(products, c);
    if (!p) { setCodeMsg('No hay ninguna pieza con el código ' + c + '. Revisa la etiqueta o búscala a mano.'); setConfirmP(null); setMode('type'); setCode(c); return; }
    setCodeMsg(''); setConfirmP(p);
  };
  const q = query.trim().toLowerCase();
  const manualList = q ? (products || []).filter(p => productMatchesSearch(p, q)).slice(0, 30) : [];
  const thumb = { width: 56, height: 56, borderRadius: 10, objectFit: 'cover', background: '#F3EFF5', flexShrink: 0 };
  const optBtn = { display: 'flex', alignItems: 'center', gap: 10, width: '100%', textAlign: 'left', padding: 8, background: '#FAF7FB', border: '1.5px solid #EDE3F1', borderRadius: 12, cursor: 'pointer', fontFamily: 'inherit' };
  const choiceBtn = { display: 'flex', alignItems: 'center', gap: 12, width: '100%', textAlign: 'left', padding: '12px 14px', background: 'white', border: '1.5px solid #E5D7EE', borderRadius: 14, cursor: 'pointer', fontFamily: 'inherit', fontSize: 14, fontWeight: 700, color: '#1A1118' };
  const backBtn = { fontSize: 12, fontWeight: 700, color: '#7A5F8A', background: '#F3EFF5', border: 'none', borderRadius: 8, padding: '7px 10px', cursor: 'pointer' };
  const goPhoto = () => { setConfirmP(null); setCodeMsg(''); if (photo) setMode('photo'); else onRetake && onRetake(); };

  return (
    <Modal onClose={onClose} labelledBy={`addPieceTitle-${order.id}`} boxStyle={{ maxWidth: 440, maxHeight: '90vh', overflowY: 'auto', padding: 20 }} overlayStyle={{ padding: 12 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        <div id={`addPieceTitle-${order.id}`} style={{ fontWeight: 800, fontSize: 17, color: '#1A1118' }}>Agregar pieza al pedido</div>
        <button type="button" onClick={onClose} aria-label="Cerrar" style={{ width: 32, height: 32, borderRadius: '50%', background: '#F9F5F7', color: '#7A6880', border: 'none', cursor: 'pointer', fontSize: 16 }}>✕</button>
      </div>

      {teachP ? (() => {
        const n = refCounts ? (refCounts[String(teachP.id)] || 0) : null;
        const few = n == null || n < 3;
        return (
          <div data-testid="teachStep">
            <div role="status" style={{ fontSize: 13, fontWeight: 700, color: '#15803D', marginBottom: 10 }}>✓ Agregada al pedido</div>
            <div style={{ fontSize: 14, fontWeight: 800, color: '#1A1118', marginBottom: 6 }}>Enseñar al identificador</div>
            <div style={{ ...optBtn, cursor: 'default' }}>
              {productImageUrl(teachP) ? <img src={productImageUrl(teachP)} alt="" style={thumb} /> : <div style={thumb} />}
              <span style={{ flex: 1, minWidth: 0 }}>
                <SkuChip sku={normalizeSku(teachP.sku)} />
                <span style={{ display: 'block', fontWeight: 700, fontSize: 13, color: '#1A1118', marginTop: 3 }}>{teachP.name}</span>
                <span data-testid="teachCount" style={{ display: 'block', fontSize: 11, fontWeight: 700, color: n ? '#15803D' : '#B45309' }}>
                  {n == null ? 'Leyendo fotos aprendidas…' : `Esta pieza tiene ${n}/${REFS_PER_PRODUCT} fotos aprendidas`}
                </span>
              </span>
            </div>
            {few ? (
              <>
                <button type="button" onClick={() => teachRef.current && teachRef.current.click()}
                  style={{ marginTop: 10, width: '100%', padding: '11px 12px', background: 'linear-gradient(135deg,#E8508A,#9B5DE5)', color: 'white', border: 'none', borderRadius: 14, fontWeight: 700, fontSize: 13, lineHeight: 1.35, cursor: 'pointer' }}>
                  📷 Toma una foto de la joya para que el identificador la reconozca mejor
                </button>
                <button type="button" onClick={onClose} style={{ ...backBtn, marginTop: 8, width: '100%' }}>Ahora no</button>
              </>
            ) : (
              <>
                <div style={{ fontSize: 12, color: '#7A6880', marginTop: 8 }}>
                  Ya tiene varias fotos aprendidas.{' '}
                  <button type="button" onClick={() => teachRef.current && teachRef.current.click()}
                    style={{ background: 'none', border: 'none', padding: 0, color: '#7C3AED', fontWeight: 700, fontSize: 12, cursor: 'pointer', textDecoration: 'underline' }}>
                    📷 Toma una foto de la joya para que el identificador la reconozca mejor
                  </button>
                  {n >= REFS_PER_PRODUCT ? ' (reemplaza la más vieja)' : ' (opcional)'}
                </div>
                <button type="button" onClick={onClose} style={{ marginTop: 10, width: '100%', padding: 10, background: '#1A1118', color: 'white', border: 'none', borderRadius: 99, fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>Ahora no</button>
              </>
            )}
            <PhotoTip style={{ marginTop: 10 }} />
            <input ref={teachRef} type="file" accept="image/*" aria-label="Foto de la joya para enseñar al identificador" style={{ display: 'none' }} onChange={onTeachFile} />
          </div>
        );
      })() : confirmP ? (
        <div>
          <div style={{ fontSize: 12, fontWeight: 700, color: '#5B4A63', marginBottom: 6 }}>¿Es esta la pieza?</div>
          <div data-testid="pieceConfirm" style={{ ...optBtn, cursor: 'default', alignItems: 'flex-start' }}>
            {productImageUrl(confirmP) ? <img src={productImageUrl(confirmP)} alt="" style={{ ...thumb, width: 72, height: 72 }} /> : <div style={{ ...thumb, width: 72, height: 72 }} />}
            <span style={{ flex: 1, minWidth: 0 }}>
              <SkuChip sku={normalizeSku(confirmP.sku)} style={{ fontSize: 12 }} />
              <span style={{ display: 'block', fontWeight: 700, fontSize: 14, color: '#1A1118', marginTop: 4 }}>{confirmP.name}</span>
              <span style={{ display: 'block', fontSize: 11, color: '#7A6880' }}>{confirmP.category}{confirmP.available === false ? ' · pausado' : ''}</span>
              {stockNote(confirmP.id)}
            </span>
          </div>
          <button type="button" onClick={() => pick(confirmP.id, confirmP.name)} disabled={!!adding}
            style={{ marginTop: 10, width: '100%', padding: 11, background: adding ? '#C9B8D3' : 'linear-gradient(135deg,#E8508A,#9B5DE5)', color: 'white', border: 'none', borderRadius: 99, fontWeight: 700, fontSize: 14, cursor: adding ? 'default' : 'pointer' }}>
            {adding ? 'Agregando…' : '✓ Agregar al pedido'}
          </button>
          <button type="button" onClick={() => { setConfirmP(null); setMode('choose'); }} style={{ ...backBtn, marginTop: 8 }}>← No es esta</button>
        </div>
      ) : mode === 'choose' ? (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <button type="button" onClick={() => { setCodeMsg(''); setMode('scan'); }} style={choiceBtn}>

          </button>

            <span>Identificar por foto<span style={{ display: 'block', fontSize: 11, fontWeight: 500, color: '#7A6880' }}>Para piezas sin etiqueta</span></span>

      ) : mode === 'scan' ? (
        <div>
          <QrScanPanel idPrefix={`addPieceQr-${order.id}`} onCode={c => resolveCode(c)} />

      ) : mode === 'type' ? (
        <form onSubmit={e => { e.preventDefault(); resolveCode(code); }}>

              autoCapitalize="characters" autoComplete="off" spellCheck={false}
              style={{ flex: 1, minWidth: 0, padding: '10px 12px', border: '1.5px solid #E5D7EE', borderRadius: 10, fontSize: 18, fontWeight: 800, letterSpacing: '.06em', fontFamily: 'ui-monospace, Menlo, monospace', textTransform: 'uppercase', outline: 'none' }} />
            <button type="submit" style={{ padding: '0 16px', background: 'linear-gradient(135deg,#E8508A,#9B5DE5)', color: 'white', border: 'none', borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>Buscar</button>
          </div>

      ) : (
        <div>
          {photo && (editShot && infos[editShot] ? (
            <JewelBoxEditor key={editShot} idPrefix={`jewelBox-${order.id}`} src={editShot} w={infos[editShot].w} h={infos[editShot].h}
              box={boxes[editShot] || null} autoBox={infos[editShot].box}
              onApply={bx => { setBoxes(m => ({ ...m, [editShot]: bx })); setEditShot(null); setMatches(null); }}
              onCancel={() => setEditShot(null)} />
          ) : (
            <div style={{ marginBottom: 12 }}>
              <div data-testid="shots" style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'flex-start' }}>
                {shots.map((sh, i) => (
                  <div key={sh.dataUrl} data-testid="shot" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, width: 84 }}>
                    <span style={{ position: 'relative' }}>
                      <ShotThumb shot={sh} info={infos[sh.dataUrl]} box={boxes[sh.dataUrl]} />
                      {i > 0 && <button type="button" onClick={() => removeExtra(sh.dataUrl)} aria-label={'Quitar la foto ' + (i + 1)}

                    </span>
                    <button type="button" onClick={() => setEditShot(sh.dataUrl)} disabled={!infos[sh.dataUrl]} aria-label={'Marca la joya en la foto ' + (i + 1)}

                    </button>
                  </div>
                ))}
                {shots.length < 3 && (
                  <button type="button" onClick={() => extraRef.current && extraRef.current.click()} data-doubt={doubt ? '1' : undefined}
                    style={{ width: 84, height: 72, borderRadius: 10, border: doubt ? '2px solid #E8508A' : '1.5px dashed #C9B8D3', background: doubt ? '#FCE8F3' : '#FAF7FB', color: doubt ? '#C0336E' : '#7A5F8A', boxShadow: doubt ? '0 0 0 3px rgba(232,80,138,.25)' : 'none', fontSize: 11, fontWeight: 700, cursor: 'pointer', lineHeight: 1.3 }}>
                    ＋ Otra foto<br />(otro ángulo)
                  </button>
                )}
              </div>
              <input ref={extraRef} type="file" accept="image/*" aria-label="Otra foto de la pieza (otro ángulo)" style={{ display: 'none' }} onChange={onExtraFile} />
              {shots.map((sh, i) => {
                const msg = !okQ[sh.dataUrl] && infos[sh.dataUrl] ? qualityMsg(infos[sh.dataUrl].quality) : '';
                if (!msg) return null;
                return (
                  <div key={'q' + sh.dataUrl} role="status" aria-live="polite" data-testid="qualityWarn" style={{ marginTop: 8, fontSize: 12, color: '#92400E', background: '#FEF3C7', borderRadius: 10, padding: '8px 10px' }}>
                    <b>{msg}{shots.length > 1 ? ' (foto ' + (i + 1) + ')' : ''}.</b> Con buena luz y la cámara quieta acierta mucho más.
                    <div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>
                      <button type="button" onClick={() => { if (i === 0) onRetake && onRetake(); else { removeExtra(sh.dataUrl); extraRef.current && extraRef.current.click(); } }} style={{ ...backBtn, background: 'white' }}>📷 Tomar otra</button>
                      <button type="button" onClick={() => setOkQ(m => ({ ...m, [sh.dataUrl]: true }))} style={{ ...backBtn, background: 'white' }}>Seguir igual</button>
                    </div>
                  </div>
                );
              })}
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 8 }}>
                <button type="button" onClick={onRetake} style={backBtn}>🔄 Tomar otra foto</button>
                <button type="button" onClick={() => setMode('choose')} style={backBtn}>← Escanear o escribir código</button>
              </div>
              <PhotoTip style={{ marginTop: 8 }} />
              {shots.length > 1 && <div style={{ fontSize: 11, color: '#7A6880', marginTop: 6 }}>Se buscará con las {shots.length} fotos juntas y, al elegir la pieza, aprenderá de todas.</div>}
            </div>
          ))}
          <div style={{ fontSize: 12, fontWeight: 700, color: '#5B4A63', marginBottom: 6 }} id={`addPieceCats-${order.id}`}>Categoría</div>
          <div role="group" aria-labelledby={`addPieceCats-${order.id}`} style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 6 }}>
            {cats.map(c => (
              <button type="button" key={c} onClick={() => setCat(c)} aria-pressed={cat === c}
                style={{ fontSize: 12, fontWeight: 700, padding: '5px 10px', borderRadius: 99, cursor: 'pointer', border: cat === c ? '1.5px solid #E8508A' : '1.5px solid #EDE3F1', background: cat === c ? '#FCE8F3' : 'white', color: cat === c ? '#C0336E' : '#5B4A63' }}>
                {c}
              </button>
            ))}
          </div>
          <div style={{ fontSize: 11, color: '#7A6880', marginBottom: 6 }}>💡 Elegir la categoría ayuda a acertar.</div>
          <div style={{ fontSize: 11, color: '#7A6880', marginBottom: 10 }} aria-live="polite">
            {prep.phase === 'model' && 'Cargando el reconocimiento (la primera vez descarga ~55 MB; conviene wifi)…'}
            {prep.phase === 'catalog' && `Preparando el catálogo… ${prep.done}/${prep.total}`}
            {prep.phase === 'ready' && (prep.failed ? `✓ Catálogo listo · ${prep.failed} pieza${prep.failed === 1 ? '' : 's'} sin foto utilizable` : '✓ Catálogo listo')}
          </div>
          {prep.phase === 'error' && <div role="alert" style={{ fontSize: 12, color: '#DC2626', background: '#FEF2F2', borderRadius: 8, padding: '8px 10px', marginBottom: 8 }}>{prep.error} Puedes buscar la pieza a mano.</div>}

          <button type="button" onClick={identify} disabled={!photo || busy}
            style={{ width: '100%', padding: '10px', background: busy ? '#C9B8D3' : 'linear-gradient(135deg,#E8508A,#9B5DE5)', color: 'white', border: 'none', borderRadius: 99, fontWeight: 700, fontSize: 13, cursor: busy ? 'default' : 'pointer' }}>
            {busy ? 'Identificando…' : '✨ Identificar'}
          </button>
          <div role="status" aria-live="polite" style={{ fontSize: 12, color: '#7A6880', minHeight: 4, marginTop: 6 }}>
            {busy ? (prep.phase === 'ready' ? 'Comparando con el catálogo…' : 'Esperando a que el catálogo esté listo…') : (matches && !matches.length ? 'No se encontró una pieza parecida. Prueba otra foto u otra categoría, o búscala a mano.' : '')}
          </div>
          {matches && matches.length > 0 && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 10 }}>
              {doubt && shots.length < 3 && (
                <div role="status" data-testid="doubtPrompt" style={{ fontSize: 12, fontWeight: 700, color: rerank && rerank.state === 'done' ? '#5B3F8A' : '#9D174D', background: rerank && rerank.state === 'done' ? '#F1EAFB' : '#FCE8F3', border: '1px solid ' + (rerank && rerank.state === 'done' ? '#E2D4F5' : '#F9C6DD'), borderRadius: 10, padding: '8px 10px', display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                  {rerank && rerank.state === 'done'
                    ? <span>◇ Había duda entre 2 piezas; la segunda opinión eligió la primera. Si no es, toma otra foto desde otro ángulo (<b>＋ Otra foto</b>).</span>
                    : <span>◇ Duda entre 2 piezas: toma otra foto desde otro ángulo (botón <b>＋ Otra foto</b>, arriba).</span>}
                </div>
              )}
              {rerank && rerank.state === 'busy' && <div role="status" aria-live="polite" data-testid="rerankBusy" style={{ fontSize: 12, color: '#7A6880' }}>Consultando segunda opinión…</div>}
              {rerank && rerank.state === 'null' && <div role="status" aria-live="polite" data-testid="rerankNull" style={{ fontSize: 12, fontWeight: 700, color: '#92400E', background: '#FEF3C7', borderRadius: 10, padding: '6px 10px' }}>La IA tampoco está segura: toma otra foto</div>}
              <div style={{ fontSize: 12, fontWeight: 700, color: '#5B4A63' }}>Toca la pieza correcta:</div>
              {matches.map(m => (
                <button type="button" key={m.id} onClick={() => pick(m.id, m.name)} disabled={!!adding} style={{ ...optBtn, opacity: adding && adding !== String(m.id) ? 0.5 : 1 }}>
                  {m.imageUrl ? <ZoomImg inButton src={m.imageUrl} title={m.sku} sub={m.name} style={thumb} /> : <div style={thumb} />}
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span style={{ display: 'block', fontWeight: 700, fontSize: 13, color: '#1A1118' }}>{m.name}</span>
                    <span style={{ display: 'block', fontSize: 11, color: '#7A6880' }}>{m.sku ? m.sku + ' · ' : ''}{m.category}</span>
                    {m.ai && <span data-testid="aiTag" style={{ display: 'inline-block', marginTop: 2, fontSize: 10, fontWeight: 800, color: '#5B3F8A', background: '#F1EAFB', borderRadius: 99, padding: '1px 7px' }}>✓ 2ª opinión (IA)</span>}
                    {stockNote(m.id)}
                  </span>
                  <span style={{ fontWeight: 800, fontSize: 13, color: '#C0336E', flexShrink: 0 }}>{adding === String(m.id) ? '…' : m.pct + '%'}</span>
                </button>
              ))}
            </div>
          )}
        </div>
      )}
      <div role="status" aria-live="polite" style={{ fontSize: 12, color: '#B45309', marginTop: codeMsg ? 8 : 0 }}>{codeMsg}</div>
      {errMsg && <div role="alert" aria-live="assertive" style={{ fontSize: 12, color: '#DC2626', background: '#FEF2F2', borderRadius: 8, padding: '8px 10px', marginTop: 6 }}>{errMsg}</div>}

      {!teachP && <div style={{ borderTop: '1px solid #EDE8EA', marginTop: 14, paddingTop: 10 }}>
        {!manual ? (
          <button type="button" onClick={() => setManual(true)}
            style={{ fontSize: 12, fontWeight: 700, color: '#7A5F8A', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}>
            🔍 Buscar a mano
          </button>
        ) : (
          <div>
            <label htmlFor={`addPieceSearch-${order.id}`} style={{ fontSize: 12, fontWeight: 700, color: '#5B4A63', display: 'block', marginBottom: 6 }}>Buscar en el catálogo</label>
            <input id={`addPieceSearch-${order.id}`} value={query} onChange={e => setQuery(e.target.value)} placeholder="Nombre o código (AN001)…"
              style={{ width: '100%', boxSizing: 'border-box', padding: '8px 10px', border: '1.5px solid #EDE3F1', borderRadius: 8, fontSize: 13, outline: 'none', fontFamily: 'inherit' }} />
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginTop: 8 }}>
              {q && !manualList.length && <div style={{ fontSize: 12, color: '#7A6880' }}>Sin resultados.</div>}
              {manualList.map(p => (
                <button type="button" key={p.id} onClick={() => pick(p.id, p.name)} disabled={!!adding} style={{ ...optBtn, padding: 6, opacity: adding && adding !== String(p.id) ? 0.5 : 1 }}>
                  {productImageUrl(p) ? <ZoomImg inButton src={productImageUrl(p)} title={normalizeSku(p.sku)} sub={p.name} style={{ ...thumb, width: 40, height: 40 }} /> : <div style={{ ...thumb, width: 40, height: 40 }} />}
                  <span style={{ flex: 1, minWidth: 0, fontSize: 13, color: '#1A1118' }}>
                    {p.name}<span style={{ fontSize: 11, color: '#7A6880' }}> · {p.sku ? normalizeSku(p.sku) + ' · ' : ''}{p.category}{p.available === false ? ' · pausado' : ''}</span>
                    {stockNote(p.id)}
                  </span>
                  {adding === String(p.id) && <span style={{ fontWeight: 800, color: '#C0336E' }}>…</span>}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>}
    </Modal>
  );
}

// ── Cacusa Lovers: sugerir las piezas de la caja (25 nov) ──
// Candidatas: con stock > 0, de acero inoxidable (las cajas son "2 piezas de acero inoxidable"; si
// no alcanzan, cualquiera, con aviso). Se descartan las que ya recibió la suscriptora (pedidos de
// Lovers anteriores con su mismo email, o su teléfono si no hay email) y las MUY parecidas a esas
// (coseno de la huella v3 > LOVERS_SIM_MAX). Se eligen distintas: otra categoría si se puede y
// poco parecidas entre sí. Nunca se agregan solas.
// (28 nov) Con la huella solo de la pieza (pieceVectors) "muy parecida" = gemela: 0,8 → TWIN_MIN (0,66);
// una pieza sin pieza aislada no tiene vector y cuenta como no parecida (0).
const LOVERS_SIM_MAX = TWIN_MIN, LOVERS_STEEL_RE = /acero/i;
function loversSubscriberKey(o) {
  const c = (o && o.cliente) || {}, email = String(c.email || '').trim().toLowerCase();
  if (email) return 'e:' + email;
  const tel = String(c.telefono || '').replace(/\D/g, '');
  return tel.length >= 7 ? 't:' + tel : '';
}
function suggestLoversPieces(order, orders, products, stock, vecs, n) {
  const key = loversSubscriberKey(order);
  const prevOrders = key ? (orders || []).filter(o => o && o.id !== order.id && isLoversBox(o) && loversSubscriberKey(o) === key) : [];
  const prevIds = new Set(prevOrders.flatMap(o => (o.productos || []).map(x => String(x && x.id)).filter(Boolean)));
  const curIds = new Set((order.productos || []).map(x => String(x && x.id)).filter(Boolean));
  const byId = new Map((products || []).map(p => [String(p.id), p]));
  const prevProds = [...prevIds].map(id => byId.get(id)).filter(Boolean), curProds = [...curIds].map(id => byId.get(id)).filter(Boolean);
  const prevCats = new Set(prevProds.map(p => p.category)), curCats = new Set(curProds.map(p => p.category));
  const qty = id => (stock ? stockOf(stock, id) : null);

        <span style={{ background: STATE_COLORS[estado] || '#E8508A', color: 'white', fontSize: 11, fontWeight: 700, padding: '4px 10px', borderRadius: 99 }}>{estado}</span>
      </div>
      {notice && <div role="alert" data-testid="orderNotice" style={{ fontSize: 12, fontWeight: 700, color: '#92400E', background: '#FEF3C7', borderRadius: 10, padding: '8px 10px' }}>{notice}</div>}
      {archived && <div data-testid="archivedBadge" style={{ fontSize: 12, fontWeight: 700, color: '#5B4A63', background: '#F3EFF5', borderRadius: 10, padding: '6px 10px' }}>Archivado{order.archivedBy ? ' por ' + String(order.archivedBy).split('.')[0] : ''}{order.archivedAt ? ' · ' + new Date(order.archivedAt).toLocaleDateString('es-EC', { day: '2-digit', month: 'short' }) : ''}</div>}
      <div style={{ fontSize: 12, color: '#7A6B85', display: 'flex', gap: 8, alignItems: 'center' }}>
        {order.numero && <span style={{ fontFamily: 'monospace', fontWeight: 700, color: '#7A5F8A', background: '#F3EFF5', padding: '2px 8px', borderRadius: 6 }}>#{order.numero}</span>}
        <span>{dateStr} · {order.pago || 'Sin método'}</span>
      </div>
      {!isLoversBox(order) && (() => {
        // Pago recibido / por cobrar (wave 1): Zelle y transferencias nacen "por cobrar".
        const pe = pagoEstadoOf(order);
        if (pe === 'reembolsado') return <div data-testid="pagoBadge" style={{ alignSelf: 'flex-start', fontSize: 12, fontWeight: 800, color: '#6D28D9', background: '#EDE9FE', borderRadius: 99, padding: '6px 12px' }}>Reembolsado</div>;
        const on = pe === 'recibido';
        const refund = Number(order.reembolsoCents) > 0 ? ' · reembolso ' + fmtUsd(order.reembolsoCents / 100) : '';
        return (
          <button type="button" data-testid="pagoToggle" aria-pressed={on} disabled={archived}
            onClick={() => { if (on) { if (window.confirm('¿Marcar el pedido' + orderRef + ' como "por cobrar"?')) onPagoChange && onPagoChange(order, 'pendiente'); } else onPagoChange && onPagoChange(order, 'recibido'); }}
            style={{ alignSelf: 'flex-start', minHeight: 36, padding: '0 14px', borderRadius: 99, fontSize: 12, fontWeight: 800, fontFamily: 'inherit', cursor: archived ? 'default' : 'pointer',
              background: on ? '#DCFCE7' : '#FEF3C7', color: on ? '#15803D' : '#92400E', border: '1.5px solid ' + (on ? '#86EFAC' : '#FCD34D') }}>
            {on ? '✓ Pago recibido' + refund : 'Por cobrar · marcar pago recibido'}
          </button>
        );
      })()}
      <div style={{ background: '#FAF7FB', borderRadius: 10, padding: '10px 12px' }}>
        {(order.productos || []).map((p, i) => (
          <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 6, fontSize: 13, color: '#1A1118', padding: '2px 0' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6, minWidth: 0 }}>
              {p.addedBy && productImageUrl(p) && <img src={productImageUrl(p)} alt="" style={{ width: 24, height: 24, borderRadius: 6, objectFit: 'cover', flexShrink: 0 }} />}
              {(() => { const cp = p.id != null && (products || []).find(x => String(x.id) === String(p.id)); return cp && cp.sku ? <SkuChip sku={normalizeSku(cp.sku)} /> : null; })()}
              <span>{p.name}{p.personalization ? <span style={{ color: '#E8508A' }}> "{p.personalization}"</span> : null}</span>
            </span>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0 }}>
              <span style={{ fontWeight: 700 }}>${p.price}</span>
              {p.addedBy && canLoadPieces && (
                <button type="button" onClick={() => removePiece(i, p)} disabled={removing != null}
                  aria-label={'Quitar ' + (p.name || 'pieza') + ' del pedido'} title="Quitar pieza"
                  style={{ width: 22, height: 22, borderRadius: '50%', border: 'none', background: '#FEE2E2', color: '#DC2626', fontSize: 11, cursor: 'pointer', lineHeight: 1 }}>
                  {removing === i ? '…' : '✕'}
                </button>
              )}
            </span>
          </div>
        ))}
        {canLoadPieces && !(order.productos || []).length && (
          <div style={{ fontSize: 12, color: '#7A6880', fontStyle: 'italic', padding: '2px 0' }}>Todavía sin piezas cargadas.</div>
        )}
        <div style={{ borderTop: '1px solid #EDE8EA', marginTop: 6, paddingTop: 6, display: 'flex', justifyContent: 'space-between', fontWeight: 800, fontSize: 14, color: '#1A1118' }}>
          <span>Total</span><span style={{ color: '#E8508A' }}>${order.total}</span>
        </div>
        {canLoadPieces && (
          <>
            <button type="button" onClick={() => { setPieceErr(''); setPiecePhoto(null); setPieceOpen(true); }}
              style={{ marginTop: 8, width: '100%', padding: '8px', background: '#F3EFF5', color: '#7A5F8A', border: '1.5px dashed #C9B8D3', borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>
              + Agregar pieza (etiqueta QR, código o foto)
            </button>
            <input ref={pieceInputRef} type="file" accept="image/*" aria-label="Foto de la pieza"
              style={{ display: 'none' }} onChange={handlePieceFile} />
            <div role="status" aria-live="polite" style={{ fontSize: 11, color: '#15803D', marginTop: pieceMsg ? 4 : 0 }}>{pieceMsg}</div>
            {pieceErr && <div role="alert" aria-live="assertive" style={{ fontSize: 11, color: '#DC2626', marginTop: 4 }}>{pieceErr}</div>}
          </>
        )}
      </div>
      {pieceOpen && (
        <AddPieceModal order={order} token={token} photo={piecePhoto} products={products} categories={categories} stock={stock}
          onRetake={() => pieceInputRef.current && pieceInputRef.current.click()}
          onClose={() => { setPieceOpen(false); setPiecePhoto(null); }}
          onAdded={(productos, name, opts) => {
            if (Array.isArray(productos)) onProductsChange && onProductsChange(order, productos, opts && opts.order);
            if (!(opts && opts.keepOpen)) { setPieceOpen(false); setPiecePhoto(null); }
            setPieceMsg('✓ Agregada: ' + (name || 'pieza'));
            onStockRefresh && onStockRefresh();
          }}
          onTeach={teachPiece} />
      )}
      {onPrintSlip && (
        <button type="button" onClick={() => onPrintSlip(order)} aria-label={'Hoja de preparación del pedido' + (order.numero ? ' #' + order.numero : '')}
          style={{ alignSelf: 'flex-start', fontSize: 12, fontWeight: 700, color: '#5B3F8A', background: '#F1EAFB', border: 'none', borderRadius: 99, padding: '5px 12px', cursor: 'pointer' }}>
          ▤ Hoja de preparación
        </button>
      )}
      {teachMsg && <div role="status" aria-live="polite" style={{ fontSize: 11, color: teachMsg.warn ? '#92400E' : '#5B3F8A', background: teachMsg.warn ? '#FEF3C7' : '#F1EAFB', borderRadius: 8, padding: '4px 8px' }}>{teachMsg.text}</div>}
      {order.lote && <div style={{ display: 'inline-block', fontSize: 11, fontWeight: 700, color: '#C0336E', background: '#FCE8F3', borderRadius: 99, padding: '2px 10px', width: 'fit-content' }}>♡ Lote Lovers {order.lote} · sale del 15 al 21</div>}
      {loversMissingPieces(order) > 0 && estado !== 'Cancelado' && (
        <div role="status" style={{ fontSize: 12, fontWeight: 600, color: '#92400E', background: '#FEF3C7', borderRadius: 8, padding: '6px 10px' }}>
          Faltan {loversMissingPieces(order)} de {LOVERS_PIECES_REQUIRED} joyas por cargar antes de enviar.
          <button type="button" onClick={suggestLovers} disabled={lovSug && lovSug.busy} data-testid="loversSuggest"
            style={{ marginLeft: 8, padding: '4px 10px', borderRadius: 99, border: 'none', background: '#1A1118', color: 'white', fontWeight: 700, fontSize: 11, cursor: 'pointer' }}>
            {lovSug && lovSug.busy ? 'Buscando…' : '✦ Sugerir ' + loversMissingPieces(order) + ' pieza' + (loversMissingPieces(order) === 1 ? '' : 's')}
          </button>
        </div>
      )}
      {lovSug && !lovSug.busy && (
        <div data-testid="loversPicks" style={{ background: '#F7F3FA', borderRadius: 10, padding: '8px 10px', display: 'flex', flexDirection: 'column', gap: 6 }}>
          {lovSug.error && <div role="alert" style={{ fontSize: 12, color: '#DC2626' }}>{lovSug.error}</div>}
          {(lovSug.notes || []).map((t, i) => <div key={i} style={{ fontSize: 11, color: '#92400E' }}>{t}</div>)}
          {lovSug.picks && !lovSug.picks.length && !lovSug.error && <div style={{ fontSize: 12, color: '#7A6880' }}>No hay piezas con stock para sugerir.</div>}
          {(lovSug.picks || []).map(x => (
            <div key={x.p.id} data-testid="loversPick" style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'white', borderRadius: 8, padding: 6 }}>
              <ZoomImg src={productImageUrl(x.p)} title={normalizeSku(x.p.sku)} sub={x.p.name} style={{ width: 44, height: 44, borderRadius: 8, objectFit: 'cover', flexShrink: 0 }} />
              <span style={{ flex: 1, minWidth: 0 }}>
                <span style={{ display: 'block', fontSize: 12, fontWeight: 700, color: '#1A1118' }}>{x.p.name} <SkuChip sku={normalizeSku(x.p.sku)} /></span>
                <span style={{ display: 'block', fontSize: 11, color: '#5B3F8A' }}>{x.line}</span>
              </span>
              <button type="button" onClick={() => addLoversPick(x.p)} disabled={!!lovAdding} aria-label={'Agregar ' + x.p.name + ' a la caja'}
                style={{ padding: '6px 12px', borderRadius: 99, border: 'none', background: 'linear-gradient(135deg,#E8508A,#9B5DE5)', color: 'white', fontWeight: 700, fontSize: 12, cursor: 'pointer', flexShrink: 0 }}>
                {lovAdding === String(x.p.id) ? '…' : 'Agregar'}
              </button>
            </div>
          ))}
        </div>
      )}
      {order.notas && <div style={{ fontSize: 12, color: '#7A6880', fontStyle: 'italic' }}>📝 {order.notas}</div>}

      {/* ── Tracking ── */}
      <div style={{ background: '#F0F7FF', borderRadius: 10, padding: '10px 12px' }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: '#3B82F6', letterSpacing: '.08em', marginBottom: 6 }}>📦 TRACKING DE ENVÍO</div>
        <div style={{ display: 'flex', gap: 6 }}>
          <input
            value={trackVal}
            onChange={e => setTrackVal(e.target.value)}
            onBlur={e => commitTracking(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commitTracking(e.currentTarget.value); e.currentTarget.blur(); } }}
            placeholder="Número o código de seguimiento…"
            style={{ flex: 1, padding: '7px 10px', border: '1.5px solid #BFDBFE', borderRadius: 8, fontSize: 12, outline: 'none', fontFamily: 'inherit', background: 'white' }}
          />
          <button onClick={() => scanInputRef.current && scanInputRef.current.click()}
            title="Escanear código de barras / QR"
            style={{ padding: '7px 10px', background: '#3B82F6', color: 'white', border: 'none', borderRadius: 8, fontSize: 14, cursor: 'pointer', flexShrink: 0 }}>
            📷
          </button>
          <input ref={scanInputRef} type="file" accept="image/*"
            style={{ display: 'none' }} onChange={handleScanFile} />
        </div>
        {scanErr && <div style={{ fontSize: 11, color: '#EF4444', marginTop: 4 }}>{scanErr}</div>}
        <select value={carrierVal} onChange={e => handleCarrierChange(e.target.value)}
          style={{ marginTop: 6, width: '100%', padding: '7px 10px', border: '1.5px solid #BFDBFE', borderRadius: 8, fontSize: 12, outline: 'none', fontFamily: 'inherit', background: 'white', color: carrierVal ? '#333' : '#9CA3AF', cursor: 'pointer' }}>
          <option value="">— Empresa de transporte (opcional) —</option>
          <option>USPS</option>
          <option>UPS</option>
          <option>FedEx</option>
          <option>DHL</option>
          <option>Amazon Logistics</option>
          <option>Correos del Ecuador</option>
          <option>Servientrega</option>
          <option>Tramaco</option>
          <option>PostNL (Europa)</option>
          <option>Royal Mail (Reino Unido)</option>
          <option>Correos (España)</option>
          <option>Otro</option>
        </select>
        {trackVal && <div style={{ fontSize: 11, color: '#6B7280', marginTop: 4 }}>Tracking y transportista se incluyen en el mensaje WA al notificar estado "Enviado".</div>}
        {isUsOrder && !order.tracking && (
          <button onClick={() => { if (loversMissingPieces(order)) { window.alert(loversBlockMsg(order)); return; } setShowLabelModal(true); }}
            style={{ marginTop: 8, width: '100%', padding: '8px', background: '#3B82F6', color: 'white', border: 'none', borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>
            📦 Envío USPS (cotizar / generar)
          </button>
        )}
        {(order.labelBase64 || order.labelStored) && (
          <button type="button" onClick={async () => {
              // El PDF ya no viaja en orders_cache (límite de 25 MB de KV): si no está
              // en memoria se pide aparte a /order/label.
              try {
                let b64 = order.labelBase64;
                if (!b64) b64 = (await apiCall('order/label', { token, orderId: order.id })).labelBase64;
                if (!b64) throw new Error('Guía no encontrada');
                openPdfBase64(b64);
              } catch (e) { alert('No se pudo abrir la guía: ' + e.message); }
            }}
            style={{ display: 'block', width: '100%', marginTop: 8, textAlign: 'center', padding: '8px', background: '#EFF6FF', color: '#3B82F6', border: 'none', borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>
            🖨️ Ver/imprimir guía USPS
          </button>
        )}
        {/* 22 oct: seguimiento en usps.com para cualquier pedido con tracking de USPS (también los
            de Click-N-Ship pegados a mano, que no tienen PDF en el panel). */}
        {(() => {
          const tn = String(order.tracking || '').replace(/\s+/g, '');
          const carrierUp = String(order.carrier || '').trim().toUpperCase();
          if (!tn || !(carrierUp === 'USPS' || (!carrierUp && /^9\d{19,21}$/.test(tn)))) return null;
          return (
            <a href={`https://tools.usps.com/go/TrackConfirmAction?tLabels=${encodeURIComponent(tn)}`} target="_blank" rel="noopener noreferrer"
              style={{ display: 'block', width: '100%', boxSizing: 'border-box', marginTop: 8, textAlign: 'center', padding: '8px', background: '#F3EFF5', color: '#5B4A63', borderRadius: 8, fontSize: 12, fontWeight: 700, textDecoration: 'none' }}>
              📍 Ver seguimiento en USPS
            </a>
          );
        })()}
        <UspsNotifyStatus order={order} token={token} />
      </div>
      {showLabelModal && (
        <UspsLabelModal
          order={order}
          token={token}
          uspsDefault={uspsDefault}
          onClose={() => setShowLabelModal(false)}
          onSuccess={data => {
            setShowLabelModal(false);
            onLabelGenerated && onLabelGenerated(order, data);
            // Desglose de lo que cobró USPS (franqueo + cada servicio extra).
            const c = data.costo;
            const money = v => (v == null ? '—' : '$' + Number(v).toFixed(2));
            const costoTxt = c
              ? '\n\nCosto USPS:\n• Franqueo: ' + money(c.postage) +
                (c.extras || []).map(x => '\n• ' + (x.name || 'Servicio extra') + ': ' + money(x.price)).join('') +
                '\n• TOTAL: ' + money(c.total) + (c.zone ? '  (zona ' + c.zone + ')' : '')
              : '';
            alert('Guía generada' + (data.tracking ? ': ' + data.tracking : '') + '.' + costoTxt);
            if (data.labelBase64) openPdfBase64(data.labelBase64);
          }}
        />
      )}

      {archived ? (
        <button type="button" data-testid="orderRestore" onClick={() => onRestore && onRestore(order)}
          style={{ minHeight: 44, borderRadius: 99, background: 'linear-gradient(135deg,#E8508A,#9B5DE5)', color: 'white', fontWeight: 800, fontSize: 13, border: 'none', cursor: 'pointer' }}>
          Restaurar pedido
        </button>
      ) : (
      <div style={{ display: 'flex', gap: 8, marginTop: 4, flexWrap: 'wrap' }}>
        {estado !== 'Entregado' && estado !== 'Cancelado' && (
          <button onClick={() => { if ((nextState === 'Enviado' || nextState === 'Entregado') && loversMissingPieces(order)) { window.alert(loversBlockMsg(order)); return; } onStatusChange(order, nextState); }}
            style={{ flex: 1, padding: '8px', background: STATE_COLORS[nextState] || '#E8508A', color: 'white', borderRadius: 99, fontSize: 12, fontWeight: 700, border: 'none', cursor: 'pointer' }}>
            → {nextState}
          </button>
        )}
        <button onClick={() => { if (window.confirm('¿Cancelar el pedido' + (order.numero ? ' #' + order.numero : '') + '?')) onStatusChange(order, 'Cancelado'); }}
          style={{ padding: '8px 12px', background: '#FEE2E2', color: '#DC2626', borderRadius: 99, fontSize: 12, fontWeight: 700, border: 'none', cursor: 'pointer' }} title="Cancelar">✕</button>
        {waStatusUrl && (() => {
          // Idioma del WhatsApp de esta clienta (22 oct): se ve cuál se va a usar y se cambia con un toque
          // (se guarda en el pedido). Tienda web = idioma en que compró; manual = por teléfono, default ES.
          const lang = orderLang(order);
          return (
            <button type="button" title={lang === 'en' ? 'El WhatsApp sale en inglés — toca para español' : 'El WhatsApp sale en español — toca para inglés'}
              onClick={() => onClienteUpdate && onClienteUpdate(order, { idioma: lang === 'en' ? 'es' : 'en' })}
              style={{ padding: '8px 10px', background: '#F3EFF5', color: '#5B4A63', borderRadius: 99, fontSize: 12, fontWeight: 800, border: 'none', cursor: 'pointer' }}>
              {lang === 'en' ? 'EN' : 'ES'}
            </button>
          );
        })()}
        {waStatusUrl && <a href={waStatusUrl} target="_blank" rel="noopener noreferrer" title="Notificar estado por WhatsApp"
          onClick={async e => {
            // 22 oct: con tracking de USPS (ya guardado), antes de abrir WhatsApp se consulta el estado
            // real del paquete en USPS y se agrega al mensaje. Si USPS no responde, va el mensaje normal.
            const tn = String(trackVal || '').replace(/\s+/g, '');
            const cu = String(carrierVal || '').trim().toUpperCase();
            const usps = !!tn && tn === String(order.tracking || '').replace(/\s+/g, '') && (cu === 'USPS' || (!cu && /^9\d{19,21}$/.test(tn)));
            if (!usps || (estado !== 'Enviado' && estado !== 'Entregado')) return;
            e.preventDefault();
            const w = window.open('', '_blank');
            if (w) { try { w.opener = null; } catch (_) {} }
            let u = null;
            try {
              const d = await Promise.race([apiCall('order/usps-status', { token, orderId: order.id }), new Promise(r => setTimeout(() => r(null), 8000))]);
              if (d && d.ok) u = d;
            } catch (_) {}
            const url = waLink(waNum, buildOrderStatusMsg(order, { estado, tracking: trackVal, carrier: carrierVal, usps: u }));
            if (w) w.location.href = url; else window.location.href = url;
          }}
          style={{ padding: '8px 12px', background: '#DCF8C6', color: '#128C7E', borderRadius: 99, fontSize: 12, fontWeight: 700, textDecoration: 'none', display: 'flex', alignItems: 'center', gap: 4 }}>💬 Notificar</a>}
        <button type="button" onClick={() => setMenuOpen(true)} aria-haspopup="dialog" aria-expanded={menuOpen} data-testid="orderMenu"
          aria-label={'Más acciones del pedido' + orderRef}
          style={{ minWidth: 40, padding: '8px 12px', background: '#F9F5F7', color: '#5B4A63', borderRadius: 99, fontSize: 16, fontWeight: 800, border: 'none', cursor: 'pointer', lineHeight: 1 }}>⋯</button>
      </div>
      )}
      {menuOpen && (
        <Modal onClose={() => setMenuOpen(false)} label={'Más acciones del pedido' + orderRef} boxStyle={{ maxWidth: 360 }}>
          <div data-testid="orderMenuSheet" style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <div style={{ fontWeight: 800, fontSize: 15, color: '#1A1118' }}>Pedido{orderRef} · {orderFullName(order.cliente) || 'Cliente'}</div>
            <button type="button" data-testid="orderArchive"
              onClick={() => { if (window.confirm('¿Archivar el pedido' + orderRef + '? Se oculta de las listas y se devuelve su stock. Lo puedes restaurar desde "Archivados".')) { setMenuOpen(false); onArchive && onArchive(order); } }}
              style={{ minHeight: 48, borderRadius: 12, background: '#FEF2F2', color: '#B91C1C', fontWeight: 800, fontSize: 14, border: '1.5px solid #FECACA', cursor: 'pointer' }}>Archivar pedido</button>
            <button type="button" onClick={() => setMenuOpen(false)}
              style={{ minHeight: 44, borderRadius: 12, background: 'white', color: '#5B3F8A', fontWeight: 700, fontSize: 13, border: '1.5px solid #E5DDEA', cursor: 'pointer' }}>Cerrar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── New Order Modal ────────────────────────────────────────────────────────
function NewOrderModal({ open, onClose, onSave }) {
  const [form, setForm] = useState({ nombre: '', telefono: '', ciudad: '', pago: 'Transferencia bancaria', notas: '', prodNombre: '', prodPersonal: '', prodPrecio: '', pagado: false });
  if (!open) return null;
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const inp = { border: '1.5px solid #e0e0e0', borderRadius: 10, padding: '9px 13px', fontSize: 13, width: '100%', outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' };
  // Diseño usa placeholder como única guía visual — labels visualmente ocultos
  // para lectores de pantalla, sin cambiar el look actual (ver auditoría a11y).
  const srOnly = { position: 'absolute', width: 1, height: 1, padding: 0, margin: -1, overflow: 'hidden', clip: 'rect(0,0,0,0)', whiteSpace: 'nowrap', border: 0 };
  const submit = e => {
    e.preventDefault();
    const order = {
      id: Date.now(), fecha: new Date().toISOString(),
      cliente: { nombre: form.nombre, telefono: form.telefono, ciudad: form.ciudad },
      productos: form.prodNombre ? [{ name: form.prodNombre, personalization: form.prodPersonal, price: Number(form.prodPrecio) || 0 }] : [],
      total: Number(form.prodPrecio) || 0,
      pago: form.pago, estado: 'Nuevo', notas: form.notas,
      pagoEstado: form.pagado ? 'recibido' : 'pendiente'
    };
    onSave(order);
    setForm({ nombre: '', telefono: '', ciudad: '', pago: 'Transferencia bancaria', notas: '', prodNombre: '', prodPersonal: '', prodPrecio: '', pagado: false });
    onClose();
  };
  return (
    <Modal onClose={onClose} labelledBy="newOrderModalTitle"
      overlayStyle={{ background: 'rgba(0,0,0,0.5)', zIndex: 300 }}
      boxStyle={{ maxWidth: 440, maxHeight: '90vh', overflowY: 'auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <div id="newOrderModalTitle" style={{ fontWeight: 800, fontSize: 18, color: '#1A1118' }}>Nuevo pedido manual</div>
          <button onClick={onClose} aria-label="Cerrar" style={{ width: 32, height: 32, borderRadius: '50%', background: '#F9F5F7', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#7A6880', border: 'none', cursor: 'pointer', fontSize: 16 }}>✕</button>
        </div>
        <form onSubmit={submit}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 11, color: '#7A6B85', letterSpacing: 1 }}>DATOS DEL CLIENTE</div>

// ── Editable list (categorías / materiales) ─────────────────────────────────
function ListEditor({ title, hint, items, onChange, onRename, usageCount, emptyOk }) {
  const [draft, setDraft] = useState('');
  const [editIdx, setEditIdx] = useState(-1);
  const [editVal, setEditVal] = useState('');
  const [err, setErr] = useState('');

  const add = () => {
    const v = draft.trim();
    if (!v) return;
    if (items.some(i => i.toLowerCase() === v.toLowerCase())) { setErr('Ya existe "' + v + '"'); return; }
    onChange([...items, v]); setDraft(''); setErr('');
  };
  const remove = idx => {
    const item = items[idx];
    const used = usageCount ? usageCount(item) : 0;
    if (used > 0) { setErr('"' + item + '" se usa en ' + used + ' producto(s). Cámbialos primero.'); return; }
    if (!emptyOk && items.length <= 1) { setErr('Debe quedar al menos uno.'); return; }
    onChange(items.filter((_, i) => i !== idx)); setErr('');
  };
  const startEdit = idx => { setEditIdx(idx); setEditVal(items[idx]); setErr(''); };
  const commitEdit = () => {
    const v = editVal.trim();
    if (!v) { setEditIdx(-1); return; }
    const old = items[editIdx];
    if (v !== old && items.some(i => i.toLowerCase() === v.toLowerCase())) { setErr('Ya existe "' + v + '"'); return; }
    const next = items.map((it, i) => i === editIdx ? v : it);
    onChange(next);
    if (onRename && v !== old) onRename(old, v);
    setEditIdx(-1); setErr('');
  };

  const inp = { padding: '9px 12px', border: '1.5px solid #e4e4e4', borderRadius: 9, fontSize: 14, outline: 'none', flex: 1, boxSizing: 'border-box' };
  return (
    <div style={{ background: 'white', borderRadius: 16, padding: '20px 22px', boxShadow: '0 1px 6px rgba(0,0,0,.06)', marginBottom: 16 }}>
      <div style={{ fontWeight: 800, fontSize: 15, color: '#1A1118', marginBottom: 4 }}>{title}</div>
      {hint && <div style={{ fontSize: 12, color: '#7A6B85', marginBottom: 14 }}>{hint}</div>}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 12 }}>
        {items.map((it, idx) => (
          <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#FAF7FB', borderRadius: 10, padding: '6px 8px 6px 12px' }}>
            {editIdx === idx ? (
              <input autoFocus value={editVal} onChange={e => setEditVal(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') commitEdit(); if (e.key === 'Escape') setEditIdx(-1); }}
                style={inp} />
            ) : (
              <span style={{ flex: 1, fontSize: 14, color: '#1A1118' }}>{it}{usageCount && <span style={{ color: '#7A6B85', fontSize: 12 }}> · {usageCount(it)}</span>}</span>
            )}
            {editIdx === idx ? (
              <button onClick={commitEdit} style={{ padding: '6px 12px', background: '#10B981', color: 'white', borderRadius: 8, fontSize: 12, fontWeight: 700, border: 'none', cursor: 'pointer' }}>✓</button>
            ) : (
              <button onClick={() => startEdit(idx)} style={{ padding: '6px 10px', background: 'white', color: '#7A6880', borderRadius: 8, fontSize: 13, border: '1px solid #EDE8EA', cursor: 'pointer' }} title="Renombrar">✏️</button>
            )}
            <button onClick={() => remove(idx)} style={{ padding: '6px 10px', background: '#FEE2E2', color: '#DC2626', borderRadius: 8, fontSize: 13, border: 'none', cursor: 'pointer' }} title="Eliminar">🗑</button>
          </div>
        ))}
      </div>
      <div style={{ display: 'flex', gap: 8 }}>
        <input value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={e => e.key === 'Enter' && add()}
          placeholder="Agregar nuevo…" style={{ ...inp, flex: 1, minWidth: 0 }} />
        <button onClick={add} style={{ padding: '9px 18px', background: 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', borderRadius: 9, fontWeight: 700, fontSize: 13, border: 'none', cursor: 'pointer', whiteSpace: 'nowrap' }}>+ Agregar</button>
      </div>
      {err && <div style={{ fontSize: 12, color: '#DC2626', fontWeight: 500, marginTop: 8 }}>{err}</div>}
    </div>
  );
}

// ── Selector de productos agrupados por categoría (acordeón) ──────────────────
// Usado por "Productos destacados" y "Carrusel del hero" — evita desplegar todos
// los productos de golpe; solo se ven los de la categoría que se abre.
function CategoryProductPicker({ products, selectedIds, onToggle, emptyMsg }) {
  const [openCat, setOpenCat] = React.useState(null);
  if (!products.length) {
    return <div style={{ fontSize: 13, color: '#ccc', textAlign: 'center', padding: '20px 0' }}>{emptyMsg}</div>;
  }
  const groups = {};
  products.forEach(p => { const c = p.category || 'Sin categoría'; (groups[c] = groups[c] || []).push(p); });
  const cats = Object.keys(groups).sort((a, b) => a.localeCompare(b));
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
      {cats.map(cat => {
        const prods   = groups[cat];
        const selCount= prods.filter(p => selectedIds.includes(p.id)).length;
        const isOpen  = openCat === cat;
        return (
          <div key={cat} style={{ border: '1.5px solid #eee', borderRadius: 12, overflow: 'hidden' }}>
            <div onClick={() => setOpenCat(isOpen ? null : cat)}
              role="button" tabIndex={0} aria-expanded={isOpen}
              onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpenCat(isOpen ? null : cat); } }}
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '11px 14px', cursor: 'pointer', background: isOpen ? '#FFF0F6' : '#FAFAFA' }}>
              <div style={{ fontWeight: 700, fontSize: 13, color: '#1A1118' }}>{cat} <span style={{ fontWeight: 400, color: '#7A6B85' }}>({prods.length})</span></div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                {selCount > 0 && <span style={{ fontSize: 11, fontWeight: 700, color: '#E85D8A', background: '#FFE3EE', padding: '2px 8px', borderRadius: 999 }}>{selCount} sel.</span>}
                <span style={{ display: 'inline-block', transform: isOpen ? 'rotate(180deg)' : 'none', transition: 'transform .15s', color: '#7A6B85' }}>▾</span>
              </div>
            </div>
            {isOpen && (
              <div style={{ padding: 8, display: 'flex', flexDirection: 'column', gap: 6, background: 'white' }}>
                {prods.map(p => {
                  const sel = selectedIds.includes(p.id);
                  return (
                    <div key={p.id} onClick={() => onToggle(p.id)}
                      role="checkbox" aria-checked={sel} tabIndex={0} aria-label={p.name}
                      onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onToggle(p.id); } }}
                      style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '9px 12px', borderRadius: 10, border: `2px solid ${sel ? '#E85D8A' : '#eee'}`, background: sel ? '#FFF0F6' : 'white', cursor: 'pointer', transition: 'all .15s' }}>
                      {p.imageUrl
                        ? <img src={p.imageUrl} style={{ width: 40, height: 40, objectFit: 'cover', borderRadius: 8, flexShrink: 0 }} alt="" />
                        : <div style={{ width: 40, height: 40, borderRadius: 8, background: 'linear-gradient(135deg,#FCE8F3,#EE6FA8)', flexShrink: 0 }} />}
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontWeight: 600, fontSize: 13, color: '#1A1118', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.name}</div>
                        <div style={{ fontSize: 11, color: '#7A6B85' }}>${p.price}</div>
                      </div>
                      <div style={{ width: 20, height: 20, borderRadius: '50%', border: `2px solid ${sel ? '#E85D8A' : '#ddd'}`, background: sel ? '#E85D8A' : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontSize: 12, flexShrink: 0 }}>
                        {sel && '✓'}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── Selector de UNA foto principal por categoría (acordeón, radio) ────────────
// Usado por "Foto principal de cada colección" — cada categoría solo muestra
// (y solo permite elegir entre) sus propios productos.
function CollectionPhotoPicker({ products, categories, selection, onSelect }) {
  const [openCat, setOpenCat] = React.useState(null);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
      {categories.map(cat => {
        const prods = products.filter(p => p.category === cat);
        const isOpen = openCat === cat;
        const selectedId = selection[cat];
        const selectedProd = prods.find(p => p.id === selectedId);
        return (
          <div key={cat} style={{ border: '1.5px solid #eee', borderRadius: 12, overflow: 'hidden' }}>
            <div onClick={() => setOpenCat(isOpen ? null : cat)}
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '11px 14px', cursor: 'pointer', background: isOpen ? '#FFF0F6' : '#FAFAFA' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
                {selectedProd?.imageUrl && <img src={selectedProd.imageUrl} style={{ width: 28, height: 28, objectFit: 'cover', borderRadius: 6, flexShrink: 0 }} alt="" />}
                <div style={{ fontWeight: 700, fontSize: 13, color: '#1A1118', whiteSpace: 'nowrap' }}>{cat} <span style={{ fontWeight: 400, color: '#7A6B85' }}>({prods.length})</span></div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                {selectedProd && <span style={{ fontSize: 11, fontWeight: 700, color: '#E85D8A', background: '#FFE3EE', padding: '2px 8px', borderRadius: 999, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 140 }}>{selectedProd.name}</span>}
                <span style={{ display: 'inline-block', transform: isOpen ? 'rotate(180deg)' : 'none', transition: 'transform .15s', color: '#7A6B85' }}>▾</span>
              </div>
            </div>
            {isOpen && (
              <div style={{ padding: 8, display: 'flex', flexDirection: 'column', gap: 6, background: 'white' }}>
                {prods.length === 0
                  ? <div style={{ fontSize: 12, color: '#ccc', textAlign: 'center', padding: '10px 0' }}>No hay productos con foto en esta categoría.</div>
                  : prods.map(p => {
                      const sel = selectedId === p.id;
                      return (
                        <div key={p.id} onClick={() => onSelect(cat, sel ? null : p.id)}
                          style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '9px 12px', borderRadius: 10, border: `2px solid ${sel ? '#E85D8A' : '#eee'}`, background: sel ? '#FFF0F6' : 'white', cursor: 'pointer', transition: 'all .15s' }}>
                          <img src={p.imageUrl} style={{ width: 40, height: 40, objectFit: 'cover', borderRadius: 8, flexShrink: 0 }} alt="" />
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontWeight: 600, fontSize: 13, color: '#1A1118', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.name}</div>
                            <div style={{ fontSize: 11, color: '#7A6B85' }}>${p.price}</div>
                          </div>
                          <div style={{ width: 20, height: 20, borderRadius: '50%', border: `2px solid ${sel ? '#E85D8A' : '#ddd'}`, background: sel ? '#E85D8A' : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontSize: 12, flexShrink: 0 }}>
                            {sel && '✓'}
                          </div>
                        </div>
                      );
                    })
                }
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── Settings tab ─────────────────────────────────────────────────────────────
// ── Landing Tab ────────────────────────────────────────────────────────────
function LandingTab({ home, setHome, products, setDirty, texts, setTexts }) {
  const setHomeField  = (k, v) => { setHome(h => ({ ...h, [k]: v })); setDirty(true); };
  const setStat       = (i, k, v) => { setHome(h => ({ ...h, stats: h.stats.map((s, j) => j === i ? { ...s, [k]: v } : s) })); setDirty(true); };
  const setPersonField= (k, v) => { setHome(h => ({ ...h, person: { ...h.person, [k]: v } })); setDirty(true); };
  const setStep       = (i, k, v) => { setHome(h => ({ ...h, person: { ...h.person, steps: h.person.steps.map((s, j) => j === i ? { ...s, [k]: v } : s) } })); setDirty(true); };
  const setFooterField= (k, v) => { setHome(h => ({ ...h, footer: { ...h.footer, [k]: v } })); setDirty(true); };
  const setTesti      = (i, k, v) => { setHome(h => ({ ...h, testimonials: h.testimonials.map((t, j) => j === i ? { ...t, [k]: v } : t) })); setDirty(true); };
  const addTesti      = () => { setHome(h => ({ ...h, testimonials: [...(h.testimonials || []), { t: '', n: '', l: '' }] })); setDirty(true); };
  const delTesti      = i => { setHome(h => ({ ...h, testimonials: h.testimonials.filter((_, j) => j !== i) })); setDirty(true); };
  const toggleFeatured= (id) => {
    const cur = home.featuredProductIds || [];
    setHomeField('featuredProductIds', cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id]);
  };
  const toggleHero    = (id) => {
    const cur = home.heroProductIds || [];
    setHomeField('heroProductIds', cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id]);
  };
  const setCollectionPhoto = (cat, id) => {
    const cur = { ...(home.collectionPhotoIds || {}) };
    if (id) cur[cat] = id; else delete cur[cat];
    setHomeField('collectionPhotoIds', cur);
  };
  // "Nuestra historia" (#storyImg2/#storyImg3): hasta 2 piezas; al elegir una 3ra se suelta la más vieja.
  const toggleStory = (id) => {
    const cur = Array.isArray(home.storyPhotoIds) ? home.storyPhotoIds : [];
    setHomeField('storyPhotoIds', cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id].slice(-2));
  };
  // Banda de Navidad: una foto por tarjeta (u30 = menos de $30, u60 = de $30 a $60, name = con su nombre).
  const setXmasPhoto = (key, id) => {
    const cur = { ...((home.xmasPhotoIds && typeof home.xmasPhotoIds === 'object') ? home.xmasPhotoIds : {}) };
    if (id && cur[key] !== id) cur[key] = id; else delete cur[key];
    setHomeField('xmasPhotoIds', cur);
  };

  const inp = { padding: '10px 13px', border: '1.5px solid #e4e4e4', borderRadius: 10, fontSize: 14, outline: 'none', width: '100%', boxSizing: 'border-box' };
  const lbl = { display: 'block', fontSize: 11, fontWeight: 600, color: '#777', letterSpacing: '.11em', textTransform: 'uppercase', marginBottom: 5 };

        <div style={{ fontWeight: 800, fontSize: 15, color: '#1A1118', marginBottom: 4 }}>⭐ Productos destacados en portada</div>

          Selecciona hasta 4 productos para mostrar en la portada de la web. Si no seleccionas ninguno, se muestran los primeros 4 disponibles automáticamente.

// ── Gift Cards Tab ───────────────────────────────────────────────────────────
function GiftCardsTab({ token }) {
  const [cards, setCards]         = useState(null);
  const [loading, setLoading]     = useState(true);
  const [amount, setAmount]       = useState('25');
  const [note, setNote]           = useState('');
  const [creating, setCreating]   = useState(false);
  const [createMsg, setCreateMsg] = useState('');
  const [copied, setCopied]       = useState('');
  const [adjustAmt, setAdjustAmt] = useState({}); // {code: string}
  const [adjustMsg, setAdjustMsg] = useState({}); // {code: string}

  // Las gift cards viven en KV (worker), nunca en Firebase ni en el navegador.
  const load = async () => {
    setLoading(true);
    try {
      const data = await apiCall('giftcard/list', { token });
      setCards(Array.isArray(data.cards) ? data.cards : []);
    } catch(_) { setCards([]); }
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const create = async () => {
    const amt = parseFloat(amount);
    if (!amt || amt <= 0) { setCreateMsg('❌ Ingresa un monto válido.'); return; }
    setCreating(true); setCreateMsg('');
    try {
      const data = await apiCall('giftcard/create', { token, amount: amt, note: note.trim() });
      if (!data.card) throw new Error('write_failed');
      setCards(prev => [data.card, ...(prev||[])]);
      setCreateMsg(`✅ Creada: ${data.card.code}`);
      setNote('');
    } catch(_) { setCreateMsg('❌ Error al crear. Intenta de nuevo.'); }
    setCreating(false);
  };

  const deactivate = async code => {
    if (!confirm(`¿Desactivar la tarjeta ${code}?`)) return;
    try {
      await apiCall('giftcard/deactivate', { token, code });
      setCards(prev => prev.map(c => c.code===code ? {...c,active:false} : c));
    } catch(_) { alert('Error al desactivar'); }
  };

  const copyCode = code => {
    navigator.clipboard.writeText(code).catch(()=>{});
    setCopied(code);
    setTimeout(()=>setCopied(''),2000);
  };

  const adjust = async code => {
    const used = parseFloat(adjustAmt[code] || '');
    if (!used || used <= 0) { setAdjustMsg(m => ({...m, [code]: '❌ Monto inválido'})); return; }
    try {
      const data = await apiCall('giftcard/adjust', { token, code, usedAmount: used });
      if (!data.card) throw new Error();
      setCards(prev => prev.map(c => c.code === code ? data.card : c));
      setAdjustMsg(m => ({...m, [code]: `✅ Saldo: $${data.card.balance.toFixed(2)}`}));
      setAdjustAmt(a => ({...a, [code]: ''}));
    } catch(_) { setAdjustMsg(m => ({...m, [code]: '❌ Error al ajustar'})); }
  };

  const inp  = { padding:'10px 13px', border:'1.5px solid #e4e4e4', borderRadius:10, fontSize:14, outline:'none', background:'white' };
  const amounts = ['10','25','50','100'];

  return (
    <div style={{ maxWidth:640, margin:'0 auto', paddingBottom:40 }}>
      {/* Create form */}
      <div style={{ background:'white', borderRadius:16, padding:'20px 22px', marginBottom:20, boxShadow:'0 2px 12px rgba(0,0,0,.06)' }}>
        <div style={{ fontSize:13, fontWeight:700, color:'#7A6880', letterSpacing:'.1em', textTransform:'uppercase', marginBottom:14 }}>🎁 Nueva tarjeta de regalo</div>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:12 }}>
          {amounts.map(a => (
            <button key={a} onClick={() => setAmount(a)}
              style={{ padding:'8px 18px', borderRadius:99, border:'1.5px solid', borderColor:amount===a?'#E85D8A':'#ddd', background:amount===a?'#FFF0F7':'white', color:amount===a?'#E85D8A':'#555', fontWeight:700, fontSize:14, cursor:'pointer' }}>
              ${a}
            </button>
          ))}
          <input value={amount} onChange={e=>setAmount(e.target.value)} type="number" min="1" step="1"
            placeholder="Otro monto" style={{ ...inp, width:120 }} />
        </div>
        <input value={note} onChange={e=>setNote(e.target.value)} placeholder="Nota (ej: Para María García — cumpleaños)"
          style={{ ...inp, width:'100%', boxSizing:'border-box', marginBottom:12 }} />
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <button onClick={create} disabled={creating}
            style={{ padding:'11px 28px', background:'linear-gradient(135deg,#C0336E,#9B5DE5)', color:'white', border:'none', borderRadius:99, fontSize:14, fontWeight:700, cursor:'pointer', opacity:creating?.6:1 }}>
            {creating ? '⏳ Creando…' : '+ Crear tarjeta de regalo'}
          </button>
          {createMsg && <span role="status" aria-live="polite" style={{ fontSize:13, fontWeight:600, color:createMsg.startsWith('✅')?'#065F46':'#DC2626' }}>{createMsg}</span>}
        </div>
      </div>

      {/* Cards list */}
      <div style={{ background:'white', borderRadius:16, padding:'20px 22px', boxShadow:'0 2px 12px rgba(0,0,0,.06)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
          <div style={{ fontSize:13, fontWeight:700, color:'#7A6880', letterSpacing:'.1em', textTransform:'uppercase' }}>Tarjetas emitidas</div>
          <button onClick={load} style={{ fontSize:12, color:'#9B5DE5', fontWeight:600, cursor:'pointer', background:'none', border:'none' }}>↺ Recargar</button>
        </div>
        {loading && <div style={{ textAlign:'center', padding:'24px 0', color:'#767676', fontSize:13 }}>Cargando…</div>}
        {!loading && (!cards || cards.length===0) && <div style={{ textAlign:'center', padding:'24px 0', color:'#767676', fontSize:13 }}>No hay tarjetas emitidas aún</div>}
        {!loading && cards && cards.map(c => (
          <div key={c.code} style={{ display:'flex', gap:12, alignItems:'center', padding:'12px 0', borderBottom:'1px solid #f3f0f5', flexWrap:'wrap' }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                <code style={{ fontSize:13, fontWeight:700, color:'#333', letterSpacing:'.05em', background:'#F5F0FF', padding:'2px 8px', borderRadius:6 }}>{c.code}</code>
                <span style={{ fontSize:12, fontWeight:700, padding:'2px 9px', borderRadius:99, background:c.active&&c.balance>0?'#DCFCE7':'#F3F4F6', color:c.active&&c.balance>0?'#166534':'#6B7280' }}>
                  {c.active&&c.balance>0 ? `✓ $${(c.balance||0).toFixed(2)} disponible` : 'Agotada / inactiva'}
                </span>
              </div>
              <div style={{ fontSize:11, color:'#767676', marginTop:4 }}>
                Valor original: ${(c.amount||0).toFixed(2)} · {c.createdAt||''}
                {c.note ? ` · ${c.note}` : ''}
              </div>
            </div>
            <div style={{ display:'flex', gap:6, flexShrink:0 }}>
              <button onClick={()=>copyCode(c.code)}
                style={{ padding:'6px 12px', borderRadius:8, border:'1.5px solid #e0e0e0', background:'white', fontSize:12, fontWeight:600, cursor:'pointer', color:copied===c.code?'#059669':'#555' }}>
                {copied===c.code ? '✓ Copiado' : '📋 Copiar'}
              </button>
              {c.active && (
                <button onClick={()=>deactivate(c.code)}
                  style={{ padding:'6px 12px', borderRadius:8, border:'1.5px solid #FFB3C1', background:'white', fontSize:12, fontWeight:600, cursor:'pointer', color:'#DC2626' }}>
                  Desactivar
                </button>
              )}
            </div>
            {c.active && c.balance > 0 && (
              <div style={{ width:'100%', display:'flex', alignItems:'center', gap:8, marginTop:6, flexWrap:'wrap' }}>
                <span style={{ fontSize:11, color:'#7A6880', fontWeight:600 }}>Registrar uso (después de confirmar pago):</span>
                <input type="number" min="0.01" step="0.01" placeholder="$0.00"
                  value={adjustAmt[c.code]||''}
                  onChange={e => setAdjustAmt(a => ({...a, [c.code]: e.target.value}))}
                  style={{ width:80, padding:'4px 8px', border:'1.5px solid #e0e0e0', borderRadius:6, fontSize:12, outline:'none' }} />
                <button onClick={()=>adjust(c.code)}
                  style={{ padding:'4px 14px', borderRadius:6, border:'1.5px solid #9B5DE5', background:'#F5F0FF', fontSize:12, fontWeight:700, cursor:'pointer', color:'#9B5DE5' }}>
                  Confirmar
                </button>
                {adjustMsg[c.code] && <span role="status" aria-live="polite" style={{ fontSize:11, fontWeight:600, color:adjustMsg[c.code].startsWith('✅')?'#065F46':'#DC2626' }}>{adjustMsg[c.code]}</span>}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Marketing por correo (13 oct) ────────────────────────────────────────────
// Campañas a los registros del popup del 10% y/o a las suscriptoras de Lovers. Salen por
// el mismo Gmail de los pedidos, en tandas (ver handleMktSendBatch en admin-worker.js):
// este componente pide una tanda tras otra mientras la pestaña está abierta; si se cierra,
// "Continuar envío" en el historial retoma desde donde quedó. Cada correo lleva link de
// baja y la dirección postal (MKT_POSTAL_ADDRESS en Cloudflare).
const MKT_EMPTY = { subject: '', preheader: '', title: '', body: '', imageUrl: '', ctaText: '', ctaUrl: '' };
function MarketingTab({ token, products }) {
  const [aud, setAud] = useState({ leads: true, lovers: ['activas'] });
  const [audInfo, setAudInfo] = useState(null);
  const [audErr, setAudErr] = useState('');
  const [es, setEs] = useState(MKT_EMPTY);
  const [conEn, setConEn] = useState(false);
  const [en, setEn] = useState(MKT_EMPTY);
  const [prodIds, setProdIds] = useState([]);
  const [prodQ, setProdQ] = useState('');
  const [previewLang, setPreviewLang] = useState('es');
  const [preview, setPreview] = useState(null);
  const [previewing, setPreviewing] = useState(false);
  const [testTo, setTestTo] = useState(() => { try { return localStorage.getItem('cacusa-mkt-test') || ''; } catch (_) { return ''; } });
  const [busy, setBusy] = useState('');
  const [msg, setMsg] = useState(null);
  const [sending, setSending] = useState(null); // resumen de la campaña en curso
  const [campaigns, setCampaigns] = useState(null);
  const stopRef = useRef(false);

  const payload = () => ({ es, en: conEn ? en : undefined, productIds: prodIds });
  const loadCampaigns = () => apiCall('marketing/campaigns', { token }).then(d => setCampaigns(d.campaigns || [])).catch(() => setCampaigns([]));
  useEffect(() => { loadCampaigns(); return () => { stopRef.current = true; }; }, []);
  useEffect(() => {
    setAudErr('');
    apiCall('marketing/audience', { token, audiencia: aud }).then(setAudInfo).catch(e => { setAudInfo(null); setAudErr(e.message); });
  }, [aud.leads, aud.lovers.join(',')]);

  const toggleLovers = g => setAud(a => ({ ...a, lovers: a.lovers.includes(g) ? a.lovers.filter(x => x !== g) : [...a.lovers, g] }));
  const doPreview = async (lang = previewLang) => {
    setPreviewing(true);
    try { setPreview(await apiCall('marketing/preview', { token, ...payload(), lang })); }
    catch (e) { setPreview({ error: e.message }); }
    setPreviewing(false);
  };
  const doTest = async () => {
    setBusy('test'); setMsg(null);
    try {
      await apiCall('marketing/test', { token, ...payload(), to: testTo, lang: previewLang });
      try { localStorage.setItem('cacusa-mkt-test', testTo); } catch (_) {}
      setMsg({ ok: true, text: `✓ Prueba enviada a ${testTo}. Revisa tu correo (también Promociones/Spam).` });
    } catch (e) { setMsg({ ok: false, text: e.message }); }
    setBusy('');
  };
  // Pide tandas hasta terminar, llegar al tope diario, o que Gmail frene.
  const runBatches = async (camp) => {
    stopRef.current = false;
    let c = camp, esperas = 0;
    setSending(c);
    while (!stopRef.current && c && !c.done) {
      let d;
      try { d = await apiCall('marketing/send-batch', { token, id: c.id }); }
      catch (e) { setMsg({ ok: false, text: `Se detuvo el envío: ${e.message}. Puedes continuarlo desde el historial.` }); break; }
      c = d.campaign; setSending(c);
      if (d.ocupado) {
        // Otra pestaña está mandando esta misma campaña: esperar y volver a mirar.
        if (++esperas > 20) { setMsg({ ok: false, text: 'Otra pestaña está enviando esta campaña. Déjala terminar allá.' }); break; }
        await new Promise(r => setTimeout(r, 3000)); continue;
      }
      esperas = 0;
      if (d.topeDiario && !c.done) { setMsg({ ok: false, text: `Se llegó al tope de ${audInfo ? audInfo.topeDiario : 400} correos de marketing por hoy (para no frenar los correos de pedidos). Mañana toca "Continuar envío" en el historial.` }); break; }
      if (d.frenado) { setMsg({ ok: false, text: `Gmail pidió una pausa (${d.frenado}). Prueba "Continuar envío" en un rato.` }); break; }
    }
    if (c && c.done) setMsg({ ok: true, text: `✓ Campaña enviada: ${c.sent} correo(s)${c.skipped ? `, ${c.skipped} se dieron de baja antes` : ''}${c.errores ? `, ${c.errores} con error` : ''}.` });
    setSending(null);
    loadCampaigns();
  };
  const doSend = async () => {
    if (!audInfo || !audInfo.total) return;
    if (!confirm(`¿Enviar "${es.subject}" a ${audInfo.total} persona(s)? No se puede deshacer.\n\nAntes, mándate una prueba y revísala.`)) return;
    setBusy('send'); setMsg(null);
    try {
      const d = await apiCall('marketing/campaign', { token, ...payload(), audiencia: aud });
      setBusy('');
      await runBatches(d.campaign);
    } catch (e) { setMsg({ ok: false, text: e.message }); setBusy(''); }
  };

  const inp = { padding: '9px 12px', borderRadius: 8, border: '1.5px solid #e0e0e0', fontSize: 13, width: '100%', boxSizing: 'border-box', fontFamily: 'inherit' };
  const lbl = { fontSize: 12, fontWeight: 700, color: '#4A3550', display: 'block', marginBottom: 4, marginTop: 12 };
  const card = { background: 'white', borderRadius: 12, border: '1px solid #EDE8EA', padding: 18, marginBottom: 16 };
  const btn = (primary, disabled) => ({ padding: '10px 18px', borderRadius: 999, border: primary ? 'none' : '1.5px solid #C0336E', background: primary ? '#C0336E' : 'white', color: primary ? 'white' : '#C0336E', fontWeight: 700, fontSize: 13, cursor: disabled ? 'default' : 'pointer', opacity: disabled ? .55 : 1, fontFamily: 'inherit' });
  const fmt = iso => { try { return new Date(iso).toLocaleString('es-EC', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch { return iso; } };
  const editor = (v, set, sufijo, idp) => (
    <div>
      <label style={lbl} htmlFor={idp + 'subj'}>Asunto{sufijo}</label>
      <input id={idp + 'subj'} style={inp} maxLength={150} value={v.subject} onChange={e => set({ ...v, subject: e.target.value })} placeholder="Ej: Llegó la colección de otoño ✦" />
      <label style={lbl} htmlFor={idp + 'pre'}>Texto de vista previa{sufijo} <span style={{ fontWeight: 400, color: '#7A6B85' }}>(lo que se ve junto al asunto en la bandeja)</span></label>
      <input id={idp + 'pre'} style={inp} maxLength={200} value={v.preheader} onChange={e => set({ ...v, preheader: e.target.value })} />
      <label style={lbl} htmlFor={idp + 'tit'}>Título{sufijo}</label>
      <input id={idp + 'tit'} style={inp} maxLength={150} value={v.title} onChange={e => set({ ...v, title: e.target.value })} />
      <label style={lbl} htmlFor={idp + 'body'}>Texto{sufijo} <span style={{ fontWeight: 400, color: '#7A6B85' }}>(línea en blanco = párrafo nuevo)</span></label>
      <textarea id={idp + 'body'} style={{ ...inp, minHeight: 130, resize: 'vertical' }} maxLength={5000} value={v.body} onChange={e => set({ ...v, body: e.target.value })} />
      <label style={lbl} htmlFor={idp + 'img'}>Imagen{sufijo} (link https://, opcional)</label>
      <input id={idp + 'img'} style={inp} value={v.imageUrl} onChange={e => set({ ...v, imageUrl: e.target.value })} placeholder="https://cacusabytaitus.com/ui_kits/store/images/…" />
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 10 }}>
        <div>
          <label style={lbl} htmlFor={idp + 'cta'}>Texto del botón{sufijo}</label>
          <input id={idp + 'cta'} style={inp} maxLength={60} value={v.ctaText} onChange={e => set({ ...v, ctaText: e.target.value })} placeholder="Ver la tienda" />
        </div>
        <div>
          <label style={lbl} htmlFor={idp + 'ctau'}>Link del botón{sufijo}</label>
          <input id={idp + 'ctau'} style={inp} value={v.ctaUrl} onChange={e => set({ ...v, ctaUrl: e.target.value })} placeholder="https://cacusabytaitus.com/ui_kits/store/" />
        </div>
      </div>
    </div>
  );
  const q = prodQ.trim().toLowerCase();
  const prodMatches = q ? (products || []).filter(p => String(p.name || '').toLowerCase().includes(q) && !prodIds.includes(String(p.id))).slice(0, 8) : [];
  const prodById = id => (products || []).find(p => String(p.id) === String(id));
  const enCurso = (campaigns || []).filter(c => !c.done);

  return (
    <div style={{ maxWidth: 820 }}>
      <div style={{ fontWeight: 800, fontSize: 18, color: '#1A1118', marginBottom: 4 }}>✉ Marketing por correo</div>
      <div style={{ fontSize: 13, color: '#7A6B85', marginBottom: 18 }}>Correos de promociones a quienes se registraron en el popup del 10% y a las suscriptoras de Lovers. Salen desde facturacioncacusa@gmail.com, cada uno con su link de baja. Primero mándate una prueba.</div>

      {audInfo && !audInfo.direccionPostal && (
        <div role="alert" style={{ ...card, background: '#FFF4E5', borderColor: '#F5C27A', color: '#7A4A00', fontSize: 13 }}>
          <strong>Falta la dirección postal del negocio.</strong> La ley de EE.UU. exige ponerla en cada correo de promoción. Cárgala en Cloudflare → cacusa-admin → Settings → Variables and secrets → <code>MKT_POSTAL_ADDRESS</code> (tipo Text; ej. "PO Box 123, Clearwater, FL 33755"). Hasta entonces puedes ver la vista previa y mandarte pruebas, pero no enviar la campaña.
        </div>
      )}

      {enCurso.length > 0 && !sending && (
        <div style={{ ...card, background: '#FCE8F3', borderColor: '#F3C1DA' }}>
          {enCurso.map(c => (
            <div key={c.id} style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', fontSize: 13 }}>
              <span style={{ flex: 1 }}>Envío sin terminar: <strong>{c.subject}</strong> — {c.next} de {c.total}</span>
              <button style={btn(true, false)} onClick={() => runBatches(c)}>Continuar envío</button>
            </div>
          ))}
        </div>
      )}

      <fieldset style={{ ...card, margin: '0 0 16px' }}>
        <legend style={{ fontWeight: 800, fontSize: 14, color: '#1A1118', padding: '0 6px' }}>1. ¿A quién?</legend>

    apiCall('lead/list', { token })
      .then(d => setLeads(Array.isArray(d.leads) ? d.leads.filter(l => l.source !== 'cart_checkout_start') : []))

      {loading && <div style={{ textAlign: 'center', padding: '32px 0', color: '#767676', fontSize: 13 }}>Cargando…</div>}
