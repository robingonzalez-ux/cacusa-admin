// ── Utils ──────────────────────────────────────────────────────────────────
const sha256 = async str => {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
};
function strToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
  return btoa(bin);
}
function b64ToStr(b64) {
  const bin = atob(b64.replace(/\n/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

// ── Backend API (Cloudflare Worker) ──────────────────────────────────────────
async function apiCall(endpoint, payload) {
  const r = await fetch(`${ADMIN_API}/${endpoint}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload || {})
  });
  let data = {};
  try { data = await r.json(); } catch (_) {}
  if (!r.ok) { const e = new Error(data.error || `Error ${r.status}`); e.status = r.status; e.data = data; throw e; }

    const data = await res.json();

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

function PushSection({ token }) {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const supported = 'serviceWorker' in navigator && 'PushManager' in window;
  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

  const [permission, setPermission] = React.useState(() => (typeof Notification !== 'undefined' ? Notification.permission : 'denied'));
  const [subscribed, setSubscribed] = React.useState(false);
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState('');

  React.useEffect(() => {
    if (!supported) return;
    navigator.serviceWorker.ready
      .then(reg => reg.pushManager.getSubscription())
      .then(sub => {
        setSubscribed(!!sub);
        // Re-sincroniza con el servidor por si el POST de /push/subscribe falló la vez
        // pasada (el navegador ya tiene la suscripción, pero el Worker nunca la guardó).
        if (sub) apiCall('push/subscribe', { token, subscription: sub.toJSON() }).catch(() => {});
      })
      .catch(() => {});
  }, []);

  const activate = async () => {
    setBusy(true); setMsg('');
    try {
      const perm = await Notification.requestPermission();
      setPermission(perm);
      if (perm !== 'granted') { setMsg('No se concedió el permiso de notificaciones.'); setBusy(false); return; }
      const reg = await navigator.serviceWorker.ready;
      // Si ya existe una suscripción (ej. de un par de llaves VAPID viejo), hay que darla
      // de baja ANTES de volver a suscribirse — si no, varios navegadores devuelven la
      // MISMA suscripción vieja sin error, ignorando la applicationServerKey nueva, y el
      // botón "Activar" queda mintiendo éxito mientras el push real sigue roto (bug real
      // encontrado 20 sep: VapidPkHashMismatch en Cloudflare, sin ningún error visible acá).
      const existing = await reg.pushManager.getSubscription();
      if (existing) await existing.unsubscribe();
      // Se pide siempre fresca al servidor (nunca hardcodeada acá) — es la única forma
      // de que esta llave y la que firma admin-worker.js NUNCA puedan desincronizarse.
      const { publicKey } = await apiCall('pub/vapid-key', {});
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(publicKey) });
      await apiCall('push/subscribe', { token, subscription: sub.toJSON() });
      setSubscribed(true);
      setMsg('✅ Notificaciones push activadas en este dispositivo.');
    } catch (e) {
      setMsg('Error al activar: ' + e.message);
    }
    setBusy(false);
  };

  const test = async () => {
    setBusy(true); setMsg('');
    try {
      const r = await apiCall('push/test', { token });
      if (!r.total) {
        setMsg('⚠️ El servidor no tiene ninguna suscripción guardada — toca "Activar" de nuevo.');
      } else if (r.sent > 0) {
        setMsg(`Enviado a ${r.sent} de ${r.total} dispositivo(s) — debería llegar en unos segundos.`);
      } else {
        setMsg(`⚠️ Había ${r.total} suscripción(es) pero ninguna recibió el envío (${r.failed} con error, ${r.cleaned} revocada(s)). Vuelve a tocar "Activar".`);
      }
    } catch (e) {
      setMsg('Error al probar: ' + e.message);
    }
    setBusy(false);
  };

  const iosInstallNotice = isIOS && !isStandalone && (
    <div style={{ background: '#FEF3C7', borderRadius: 12, padding: '12px 14px', fontSize: 12.5, color: '#92400E', lineHeight: 1.5 }}>
      En iPhone, Safari solo permite notificaciones si este panel está instalado en tu
      pantalla de inicio. Toca <strong>Compartir → Agregar a inicio</strong> y abre la
      app desde ese ícono nuevo (no desde la pestaña de Safari) para poder activarlas.
    </div>
  );

  // En iOS/iPadOS Safari sin instalar como app, WebKit no expone PushManager en
  // absoluto — `supported` da false justo en el caso para el que existe este
  // aviso. Antes el `return null` cortaba acá mismo, así que en un iPhone sin
  // instalar Tita/Robin no veían ni el botón ni la explicación de qué hacer.
  if (!supported) {
    if (!iosInstallNotice) return null;
    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 18, paddingBottom: 18, borderBottom: '1.5px solid #F3EFF5' }}>
        <div style={{ fontSize: 13, color: '#1A1118', fontWeight: 700 }}>📲 Notificación nativa (recomendado)</div>
        {iosInstallNotice}
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 18, paddingBottom: 18, borderBottom: '1.5px solid #F3EFF5' }}>
      <div style={{ fontSize: 13, color: '#1A1118', fontWeight: 700 }}>📲 Notificación nativa (recomendado)</div>

      {iosInstallNotice}

      {(!isIOS || isStandalone) && !subscribed && (
        <button onClick={activate} disabled={busy}
          style={{ padding: '11px', background: 'linear-gradient(135deg,#E8508A,#9B5DE5)', color: 'white', borderRadius: 99, fontWeight: 700, fontSize: 13, border: 'none', cursor: busy ? 'default' : 'pointer', opacity: busy ? .6 : 1 }}>
          {busy ? 'Activando…' : 'Activar notificaciones push'}
        </button>
      )}

      {subscribed && (
        <>
          <div style={{ background: '#F0FDF4', borderRadius: 12, padding: '12px 14px', fontSize: 13, color: '#065F46', display: 'flex', gap: 8 }}>
            <span>✅</span>
            <span>Este dispositivo recibirá notificaciones nativas con cada pedido nuevo.</span>
          </div>
          <button onClick={test} disabled={busy}
            style={{ padding: '10px', background: '#F3EFF5', color: '#7A5F8A', borderRadius: 99, fontWeight: 700, fontSize: 12.5, border: 'none', cursor: busy ? 'default' : 'pointer', opacity: busy ? .6 : 1 }}>
            {busy ? 'Enviando…' : 'Probar notificación'}
          </button>
          {/* subscribed solo indica que el navegador tiene ALGUNA suscripción guardada —
              no que siga siendo válida contra las llaves VAPID actuales. Sin esto, si
              "Probar notificación" falla (ej. rotaste las llaves VAPID), no había forma

              cuando subscribed es false, y activate() ya se ocupa de dar de baja la
              suscripción vieja antes de pedir una nueva (ver comentario en activate()). */}
          <button onClick={activate} disabled={busy}
            style={{ padding: '9px', background: 'none', color: '#9B5DE5', borderRadius: 99, fontWeight: 700, fontSize: 12, border: '1.5px solid #E5DCF0', cursor: busy ? 'default' : 'pointer', opacity: busy ? .6 : 1 }}>
            {busy ? 'Reactivando…' : '🔄 Reactivar (si dejaste de recibir avisos)'}
          </button>
        </>
      )}

      {permission === 'denied' && (
        <div style={{ fontSize: 12, color: '#92400E' }}>
          Bloqueaste las notificaciones para este sitio — actívalas desde Ajustes del
          navegador para poder usarlas.
        </div>
      )}

      {msg && <div style={{ fontSize: 12, color: '#4B5563' }}>{msg}</div>}
    </div>
  );
}

    document.addEventListener('keydown', onKeydown);
    const items = getFocusable();
    if (items.length) items[0].focus();
    return () => {
      document.removeEventListener('keydown', onKeydown);
      const i = _modalStack.indexOf(me); if (i > -1) _modalStack.splice(i, 1);
      if (prevFocused && prevFocused.focus) prevFocused.focus();
    };
  }, []);
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(26,17,36,.65)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20, ...overlayStyle }}
      onClick={e => closeOnOverlayClick && e.target === e.currentTarget && onClose()}>
      <div ref={boxRef} role="dialog" aria-modal="true" aria-label={label} aria-labelledby={labelledBy}
        style={{ background: 'white', borderRadius: 20, padding: 28, width: '100%', maxWidth: 400, boxShadow: '0 24px 60px rgba(0,0,0,.3)', animation: 'fadeIn .2s ease', ...boxStyle }}
        onClick={e => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

function compressImage(file, maxPx = 900) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    // Guarda de tiempo: si la imagen no se puede decodificar (p.ej. HEIC del iPhone en
    // Chrome/Windows), img.onload/onerror pueden no dispararse — no dejar el subir colgado.
    const timer = setTimeout(() => { try { URL.revokeObjectURL(url); } catch(_){}
      reject(new Error('La imagen tardó demasiado o no se pudo leer. Si es una foto HEIC del iPhone, cámbiala a JPG/PNG.')); }, 20000);
    img.onerror = () => {
      clearTimeout(timer); try { URL.revokeObjectURL(url); } catch(_){}
      reject(new Error('No se pudo leer la imagen. Si es HEIC del iPhone, guárdala/tómala como JPG o PNG.'));
    };
    img.onload = () => {
      clearTimeout(timer);
      try {
        let { width: w, height: h } = img;
        if (w > maxPx || h > maxPx) {
          if (w >= h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else        { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        const done = blob => {
          if (!blob) { reject(new Error('No se pudo procesar la imagen.')); return; }
          const fr = new FileReader();
          fr.onload = e => resolve(e.target.result.split(',')[1]);
          fr.onerror = () => reject(new Error('No se pudo leer la imagen procesada.'));
          fr.readAsDataURL(blob);
        };
        // Safari (iPhone/Mac) no sabe codificar WebP: toBlob('image/webp') devuelve en
        // silencio un PNG sin comprimir (~1 MB por foto — 45 fotos del catálogo eran PNG
        // con nombre .webp, auditoría SEO 27 sep). En ese caso se re-codifica como JPEG,
        // que Safari sí comprime; el navegador lo muestra igual aunque el archivo se
        // llame .webp (las imágenes se detectan por contenido, no por extensión).
        cv.toBlob(blob => {
          if (blob && blob.type !== 'image/webp') cv.toBlob(done, 'image/jpeg', 0.85);
          else done(blob);
        }, 'image/webp', 0.82);
      } catch (err) { try { URL.revokeObjectURL(url); } catch(_){} reject(err); }
    };
    img.src = url;
  });
}

// ── Login ──────────────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [username, setUsername] = useState('tita.jaramillo');
  const [password, setPassword] = useState('');
  const [error, setError]       = useState('');
  const [loading, setLoading]   = useState(false);
  const [waAvail, setWaAvail]   = useState(false);
  const [pendingSess, setPending] = useState(null); // sesión esperando activar Face ID

  React.useEffect(() => {
    setWaAvail(_waSupported() && _waHasCred(username));
  }, [username]);

  // Login condicional (21 sep) — pedido en segundo plano una sola vez al montar la
  // pantalla, no ligado a ningún click. Si hay una passkey discoverable disponible, el
  // navegador la sugiere directo en el campo de usuario; si el usuario la elige, esto
  // resuelve solo y entra sin haber tocado el botón "Ingresar con Face ID". Se cancela
  // si la pantalla se desmonta (ya se entró por contraseña o por el botón de siempre).
  React.useEffect(() => {
    const ctrl = new AbortController();
    _waConditionalLogin(ctrl.signal)
      .then(data => { if (data) onLogin({ username: data.user, name: USERS[data.user].name, token: data.token }); })
      .catch(() => {}); // cancelado, sin passkey discoverable, o el usuario cerró la sugerencia — no es un error a mostrar
    return () => ctrl.abort();
  }, []);

  const submit = async e => {
    e.preventDefault(); setLoading(true); setError('');
    try {
      const data = await apiLogin(username, password);
      const sess = { username, name: USERS[username].name, token: data.token };
      if (_waSupported() && !_waHasCred(username)) {
        setPending(sess); // ofrecer activar Face ID
      } else {
        onLogin(sess);
      }
    } catch (e) {
      setError(e.status === 401 ? 'Usuario o contraseña incorrectos.' : (e.message || 'No se pudo conectar con el servidor.'));
    } finally { setLoading(false); }
  };

  const loginFaceId = async (restore = false) => {
    setLoading(true); setError('');
    try {
      const data = await _waLogin(username);
      if (restore) localStorage.setItem(`cacusa_wa:${username}`, '1');
      onLogin({ username, name: USERS[username].name, token: data.token });
    } catch (e) {
      localStorage.removeItem(`cacusa_wa:${username}`);
      if (e.name === 'NotAllowedError') setError('Face ID cancelado. Ingresa con contraseña para re-activar.');
      else setError('No se encontró el acceso biométrico. Ingresa con contraseña — la app te pedirá activar Face ID de nuevo.');
    } finally { setLoading(false); }
  };

  const activarFaceId = async () => {
    setLoading(true);
    try { await _waRegister(pendingSess.token, pendingSess.username, password); } catch (_) {}
    onLogin(pendingSess);
  };

  const inp = { padding: '11px 14px', border: '1.5px solid #e0e0e0', borderRadius: 10, fontSize: 14, outline: 'none', width: '100%', boxSizing: 'border-box' };
  const lbl = { display: 'block', fontSize: 11, fontWeight: 600, color: '#777', letterSpacing: '.12em', textTransform: 'uppercase', marginBottom: 6 };
  const card = { width: 400, background: 'white', borderRadius: 28, padding: '44px 40px', boxShadow: '0 32px 80px rgba(0,0,0,.45)', animation: 'fadeIn .4s ease' };
  const wrap = { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg,#1A1124 0%,#2D1B2E 55%,#1A1124 100%)' };

  if (pendingSess) return (
    <div style={wrap}>
      <div style={{ ...card, textAlign: 'center' }}>
        <div style={{ fontSize: 52, marginBottom: 12 }}>🔐</div>
        <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 8 }}>Activar acceso biométrico</div>
        <div style={{ fontSize: 14, color: '#666', marginBottom: 28 }}>¿Usar Face ID o huella la próxima vez?</div>
        <button onClick={activarFaceId} disabled={loading}
          style={{ width:'100%', padding:14, background:'linear-gradient(135deg,#C0336E,#9B5DE5)', color:'white', borderRadius:99, fontWeight:700, fontSize:15, marginBottom:10, opacity:loading?.7:1, border:'none', cursor:'pointer' }}>
          {loading ? 'Configurando…' : 'Activar Face ID'}
        </button>
        <button onClick={() => onLogin(pendingSess)}
          style={{ width:'100%', padding:12, background:'none', border:'1.5px solid #e0e0e0', borderRadius:99, fontWeight:500, fontSize:14, color:'#888', cursor:'pointer' }}>
          Ahora no
        </button>
      </div>
    </div>
  );

  return (
    <div style={wrap}>
      <div style={card}>
        <div style={{ textAlign: 'center', marginBottom: 36 }}>
          <div style={{ fontFamily: 'Georgia,serif', fontSize: 34, fontWeight: 900, letterSpacing: '.15em', background: 'linear-gradient(135deg,#E85D8A,#9B5DE5)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>CACUSA</div>
          <div style={{ fontFamily: 'Georgia,serif', fontSize: 13, color: '#767676', fontStyle: 'italic', marginTop: 3 }}>Panel de Administración</div>
        </div>
        <form onSubmit={submit}>
          <div style={{ marginBottom: 16 }}>
            <label htmlFor="loginUsername" style={lbl}>Usuario</label>
            {/* Botones de elegir-de-una-lista (como el <select> de antes) — solo hay 2
                cuentas reales y nunca va a haber más, así que un toque directo es más
                cómodo que escribir. En iOS Safari el <datalist> de abajo no se ve bien
                (WebKit nunca le dio soporte visual decente), así que esto es lo que de
                verdad reemplaza al selector viejo ahí. */}
            <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
              {Object.entries(USERS).map(([k, v]) => (
                <button key={k} type="button" onClick={() => setUsername(k)}
                  style={{
                    flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
                    padding: '11px 10px', borderRadius: 10, cursor: 'pointer', fontSize: 13, fontWeight: 700, fontFamily: 'inherit',
                    border: username === k ? '1.5px solid #9B5DE5' : '1.5px solid #e0e0e0',
                    background: username === k ? 'linear-gradient(135deg,#F3EEFF,#FBEFF5)' : 'white',
                    color: username === k ? '#5a3fa0' : '#555',
                  }}>
                  <span style={{ fontSize: 16 }}>{v.avatar}</span> {v.name}
                </button>
              ))}
            </div>
            {/* Input real de texto (nunca <select>) — necesario para que el navegador
                pueda sugerir la passkey acá (Conditional UI, ver _waConditionalLogin);
                los botones de arriba lo llenan solo con un toque, así que en el uso
                normal nunca hace falta tocarlo. */}
            <input id="loginUsername" list="loginUsernameOptions" autoComplete="username webauthn"
              value={username} onChange={e => setUsername(e.target.value)} placeholder="Usuario" style={inp} />
            <datalist id="loginUsernameOptions">
              {Object.entries(USERS).map(([k, v]) => <option key={k} value={k}>{v.avatar} {v.name}</option>)}
            </datalist>
          </div>
          <div style={{ marginBottom: 16 }}>
            <label style={lbl}>Contraseña</label>
            <input type="password" autoComplete="current-password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Contraseña" required style={inp} />
          </div>
          <div style={{ marginBottom: 8 }} />
          {error && <div style={{ background: '#FEE2E2', color: '#DC2626', borderRadius: 10, padding: '10px 14px', fontSize: 13, marginBottom: 16, fontWeight: 500 }}>{error}</div>}
          <button type="submit" disabled={loading}
            style={{ width: '100%', padding: 14, background: 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', borderRadius: 99, fontWeight: 700, fontSize: 15, letterSpacing: '.04em', boxShadow: '0 4px 20px rgba(155,93,229,.4)', opacity: loading ? .7 : 1, transition: 'opacity .2s', border: 'none', cursor: 'pointer' }}>
            {loading ? 'Verificando…' : 'Ingresar →'}
          </button>
        </form>
        {waAvail && (
          <button onClick={() => loginFaceId(false)} disabled={loading}
            style={{ width:'100%', padding:13, marginTop:12, background:'#F8F8FF', border:'1.5px solid #e8e0ff', borderRadius:99, fontWeight:600, fontSize:14, color:'#5a3fa0', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
            <span style={{ fontSize:20 }}>🔐</span> Ingresar con Face ID
          </button>
        )}
        {!waAvail && _waSupported() && username && (
          <div style={{ textAlign:'center', marginTop:14 }}>
            <button onClick={() => loginFaceId(true)} disabled={loading}
              style={{ background:'none', border:'none', cursor:'pointer', fontSize:12, color:'#9B5DE5', textDecoration:'underline', fontFamily:'inherit', opacity: loading ? .5 : 1 }}>
              Recuperar acceso con Face ID
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// Historial de stock de UNA pieza (wave 1): últimos movimientos guardados por el Worker
// (/stock/history): cuándo, quién, cuánto, por qué y con cuánto quedó.
function StockHistory({ token, productId }) {
  const [st, setSt] = React.useState(null); // null | 'loading' | { items } | { error }
  const load = async () => {
    setSt('loading');
    try { const r = await apiCall('stock/history', { token, id: String(productId) }); setSt({ items: r.items || [], unavailable: !!r.unavailable }); }
    catch (e) { setSt({ error: e && e.status === 404 ? 'El servidor todavía no tiene el historial (falta actualizar el Worker).' : 'No se pudo cargar el historial.' }); }

    <details data-testid="stockHistory" onToggle={e => { if (e.currentTarget.open && st === null) load(); }}

// ── Código de producto / SKU (19 nov) ──────────────────────────────────────────
// Formato: 2 letras de la categoría + 3 dígitos (AN001). Vive en data/products.json (`sku`).
// Prefijos fijos para las categorías conocidas; una categoría nueva usa las 2 primeras letras
// de su nombre normalizado (sin tildes, en mayúsculas). Si esas 2 letras ya son de otra
// categoría (fija o ya usada en el catálogo) se prueba 1ra letra + 3ra, 1ra + 4ta…, después
// 1ra + A..Z y por último cualquier par libre. Una categoría nueva que ya tiene piezas con
// código reusa el prefijo de esas piezas.
// Los códigos son estables: si una pieza cambia de categoría conserva su código. Un número
// nunca se reusa: se guarda el último número entregado por prefijo en config.skuSeq (así,
// borrar la pieza más nueva no hace que la siguiente herede su código).
const SKU_PREFIXES = { 'anillos': 'AN', 'aretes': 'AR', 'cadenas': 'CA', 'pulseras': 'PU', 'parejas': 'PA', 'hombres': 'HO', 'hand chain': 'HC', 'ear cuff': 'EC', 'juegos': 'JU' };
const SKU_RE = /^[A-Z]{2}\d{3,}$/;

function normalizeSku(s) { return String(s || '').trim().toUpperCase().replace(/[\s-]+/g, ''); }
function skuPrefixFor(category, products) {
  const k = skuCatKey(category);
  if (SKU_PREFIXES[k]) return SKU_PREFIXES[k];
  const fixed = Object.values(SKU_PREFIXES);
  const same = (products || []).find(p => skuCatKey(p.category) === k && SKU_RE.test(normalizeSku(p.sku)) && !fixed.includes(normalizeSku(p.sku).slice(0, 2)));
  if (same) return normalizeSku(same.sku).slice(0, 2);
  const letters = k.toUpperCase().replace(/[^A-Z]/g, '');
  const taken = new Set(fixed);
  (products || []).forEach(p => { const s = normalizeSku(p.sku); if (SKU_RE.test(s) && skuCatKey(p.category) !== k) taken.add(s.slice(0, 2)); });
  const AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', first = letters[0] || 'X', cands = [];
  if (letters.length >= 2) cands.push(letters.slice(0, 2));
  for (let i = 2; i < letters.length; i++) cands.push(first + letters[i]);
  for (const c of AZ) cands.push(first + c);
  for (const a of AZ) for (const b of AZ) cands.push(a + b);

}
function skuMaxNumber(prefix, products, seq) {

  return mx;
}
function formatSku(prefix, n) { return prefix + String(n).padStart(3, '0'); }
// Próximo código libre para la categoría (sin reservarlo; solo para mostrarlo).
function nextSkuFor(category, products, seq) {
  const prefix = skuPrefixFor(category, products);
  return formatSku(prefix, skuMaxNumber(prefix, products, seq) + 1);
}
// Asigna código a las piezas que no tienen (por id ascendente = la más antigua primero).
// Devuelve { products, seq, assigned }: mismo orden, las que ya tienen código no se tocan.
function assignMissingSkus(products, seq) {
  const nextSeq = { ...(seq || {}) };
  let list = (products || []).slice(), assigned = 0;
  const missing = list.filter(p => !SKU_RE.test(normalizeSku(p.sku))).sort((a, b) => Number(a.id) - Number(b.id));
  for (const m of missing) {
    const prefix = skuPrefixFor(m.category, list);
    const n = skuMaxNumber(prefix, list, nextSeq) + 1;
    const sku = formatSku(prefix, n);
    nextSeq[prefix] = n;
    list = list.map(p => String(p.id) === String(m.id) ? { ...p, sku } : p);
    assigned++;
  }
  return { products: list, seq: nextSeq, assigned };
}
function findBySku(products, code) {
  const c = normalizeSku(code);
  if (!c) return null;
  return (products || []).find(p => normalizeSku(p.sku) === c) || null;
}
// Búsqueda de productos del panel: nombre, descripción, código (AN001 / an001 / "an 001") o id.
function productMatchesSearch(p, q) {
  const s = String(q || '').trim().toLowerCase();
  if (!s) return true;
  const code = normalizeSku(s);
  return String(p.name || '').toLowerCase().includes(s) || String(p.description || '').toLowerCase().includes(s)
    || (!!code && !!p.sku && normalizeSku(p.sku).includes(code)) || String(p.id) === s;
}

// ── Fotos reales aprendidas por pieza (19 nov) ──
// Cuántas referencias guarda el Worker por producto (/identify/refs, máx. 10: el Worker descarta
// la más vieja). Un solo pedido por sesión, compartido por la lista de productos, "Registrar
// fotos", el modal del producto y "Agregar pieza"; cada foto que se guarda actualiza el número.
const REFS_PER_PRODUCT = 10;
const _refStore = { counts: null, promise: null, subs: new Set() };
function _refNotify() { _refStore.subs.forEach(f => { try { f(); } catch (_) {} }); }
function loadRefCounts(token, force) {
  if (_refStore.promise && !force) return _refStore.promise;
  _refStore.promise = apiCall('identify/refs', { token }).then(r => {
    const out = {};
    for (const [id, list] of Object.entries((r && r.refs) || {})) out[String(id)] = Array.isArray(list) ? list.length : 0;
    _refStore.counts = out; _refStore.error = ''; _refNotify();
    return { counts: out, refs: (r && r.refs) || {} };
  }).catch(e => { _refStore.promise = null; _refStore.error = pieceErrMsg(e); if (!_refStore.counts) _refStore.counts = null; _refNotify(); throw e; });
  return _refStore.promise;
}
function setRefCount(id, n) { _refStore.counts = { ...(_refStore.counts || {}), [String(id)]: n }; _refNotify(); }
function refCountOf(id) { return (_refStore.counts && _refStore.counts[String(id)]) || 0; }
function useRefCounts(token) {
  const [, bump] = useState(0);
  useEffect(() => {
    const f = () => bump(x => x + 1);
    _refStore.subs.add(f);
    return () => { _refStore.subs.delete(f); };
  }, []);
  useEffect(() => {
    if (token && !_refStore.counts && !_refStore.promise) loadRefCounts(token).catch(() => {});
  }, [token]);
  return _refStore.counts; // null = todavía sin cargar
}
// Guarda una foto de la joya como referencia, sin bloquear la pantalla. Fuente: un archivo de
// la cámara o el dataUrl de una foto ya tomada. Nunca se usan los cuadros del escáner QR (esos
// muestran la etiqueta, no la joya). Devuelve una promesa con el nuevo total de la pieza.
async function teachPieceFromPhoto(token, pid, src) {
  const dataUrl = src && src.dataUrl ? src.dataUrl : (await photoToJpegBase64(src, 640, 0.8)).dataUrl;
  const q = await embedQueryPhoto(dataUrl);
  const r = await apiCall('identify/ref/add', { token, id: String(pid), vector: learnedRefVector(q) });
  const n = r && Number.isInteger(r.count) ? r.count : Math.min(REFS_PER_PRODUCT, refCountOf(pid) + 1);
  setRefCount(pid, n);

}
// Aviso único al estrenar una versión nueva del identificador (RECOG_VERSION, 22 nov: v2) si el
// Worker ya tiene fotos reales aprendidas: se calcularon con la huella anterior y no se pueden
// comparar con la nueva (el Worker no guarda la versión). Nunca se borran solas: el botón es
// opcional. Mientras sigan ahí, el panel las usa como si fueran de la versión actual.
const RECOG_SEEN_KEY = 'cacusa-recog-version-seen';
function RecogUpgradeNotice({ token, counts }) {
  const [seen, setSeen] = useState(() => { try { return localStorage.getItem(RECOG_SEEN_KEY) === String(RECOG_VERSION); } catch (_) { return true; } });
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const ids = counts ? Object.keys(counts).filter(id => counts[id] > 0) : [];
  const total = ids.reduce((a, id) => a + counts[id], 0);
  const markSeen = () => { try { localStorage.setItem(RECOG_SEEN_KEY, String(RECOG_VERSION)); } catch (_) {} setSeen(true); };
  useEffect(() => { if (!seen && counts && !total) markSeen(); }, [seen, counts, total]); // nada que avisar
  if (seen || !counts || !total) return null;
  const clearAll = async () => {
    if (!window.confirm('¿Borrar las ' + total + ' fotos reales aprendidas (' + ids.length + ' pieza' + (ids.length === 1 ? '' : 's') + ')? Después puedes volver a registrarlas con "Registrar fotos".')) return;
    setBusy(true); setMsg('');
    let okN = 0;
    for (const id of ids) {
      try { await apiCall('identify/ref/clear', { token, id: String(id) }); setRefCount(id, 0); okN++; }
      catch (e) { setMsg('No se pudieron borrar todas (' + pieceErrMsg(e) + '). Borradas: ' + okN + ' de ' + ids.length + ' piezas.'); setBusy(false); return; }
    }
    setBusy(false); markSeen();
  };
  return (
    <div role="status" aria-live="polite" data-recog-notice style={{ borderRadius: 12, padding: '12px 16px', marginBottom: 14, fontSize: 13, background: '#EEF2FF', color: '#3730A3', border: '1px solid #C7D2FE' }}>
      <div style={{ fontWeight: 800, marginBottom: 4 }}>◇ El identificador por foto se mejoró</div>
      <div style={{ lineHeight: 1.45 }}>Ahora reconoce las piezas con mucha más precisión. {total === 1 ? 'La foto real que ya le habías enseñado se guardó' : 'Las ' + total + ' fotos reales que ya le habías enseñado se guardaron'} con la versión anterior y {total === 1 ? 'puede' : 'pueden'} confundirlo: lo mejor es {total === 1 ? 'borrarla y volver a tomarla' : 'borrarlas y volver a tomarlas'} con "Registrar fotos". No se borra nada si no lo pides.</div>
      {msg && <div role="alert" style={{ color: '#DC2626', fontWeight: 700, marginTop: 6 }}>{msg}</div>}
      <div style={{ display: 'flex', gap: 8, marginTop: 10, flexWrap: 'wrap' }}>
        <button onClick={clearAll} disabled={busy} style={{ padding: '8px 14px', borderRadius: 99, border: 'none', background: '#3730A3', color: 'white', fontWeight: 700, fontSize: 12, cursor: busy ? 'default' : 'pointer', opacity: busy ? .7 : 1 }}>{busy ? 'Borrando…' : 'Borrar fotos viejas'}</button>
        <button onClick={markSeen} disabled={busy} style={{ padding: '8px 14px', borderRadius: 99, border: '1px solid #A5B4FC', background: 'white', color: '#3730A3', fontWeight: 700, fontSize: 12, cursor: 'pointer' }}>Mantenerlas</button>
      </div>
    </div>
  );
}

// ── Foto del producto: vista previa con el encuadre de la tienda (focal + zoom) ──

    onTouchMove: e => { moveDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); },

// "doce noventa y nueve" → "12 99"; "un anillo" no se toca (un/una/uno solo antes de unidad/dólar).
function spokenNumbersToDigits(text) {
  const toks = deaccent(text).replace(/(\d),(\d)/g, '$1.$2').replace(/\$\s*/g, ' dolares_pre ').replace(/[^a-z0-9.\s_]/g, ' ').split(/\s+/).filter(Boolean);
  const out = [];
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    const isNumWord = w => w in ES_UNITS || w in ES_TENS || w in ES_HUNDREDS || w === 'mil';
    if (!isNumWord(t)) { out.push(t); continue; }
    if ((t === 'un' || t === 'una' || t === 'uno') && !/^(unidad|pieza|par|dolar|dolares|centavo)/.test(toks[i + 1] || '') && !(i > 0 && /^(con|y|cantidad|stock|costo|precio)$/.test(toks[i - 1]))) { out.push(t); continue; }
    let total = 0, cur = 0, j = i;
    while (j < toks.length) {
      const w = toks[j];
      if (w in ES_HUNDREDS) cur += ES_HUNDREDS[w];
      else if (w in ES_TENS) { cur += ES_TENS[w]; if (toks[j + 1] === 'y' && toks[j + 2] in ES_UNITS && ES_UNITS[toks[j + 2]] < 10) { cur += ES_UNITS[toks[j + 2]]; j += 2; } }
      else if (w in ES_UNITS) cur += ES_UNITS[w];
      else if (w === 'mil') { total += (cur || 1) * 1000; cur = 0; }
      else break;
      j++;
      // "doce noventa": dos números seguidos sin "y" → números distintos (dólares y centavos)
      const nx = toks[j];
      if (nx && (nx in ES_UNITS || nx in ES_TENS) && !(toks[j - 1] in ES_HUNDREDS) && !(toks[j - 1] === 'mil')) break;
    }
    out.push(String(total + cur));
    i = j - 1;
  }
  return out.join(' ').replace(/dolares_pre\s+(\d+(?:\.\d+)?)/g, '$1 dolares');
}
// Monto después de una palabra clave: "12.99", "12 99", "12 con 99", "12 dolares con 50 centavos", "12 y 50".
function amountAfter(s, keys) {
  const re = new RegExp('(?:' + keys + ')\\s+(?:(?:de|a|en|es|son|por|unitario|cada uno|cada una|me costo|venta)\\s+)*(\\d+(?:\\.\\d{1,2})?)(?:\\s*dolar(?:es)?)?(?:\\s+(?:con\\s+|y\\s+)?(\\d{1,2})(?:\\s*centavos?)?(?=\\s|$))?');
  const m = re.exec(s);
  if (!m) return null;
  let v = parseFloat(m[1]);
  if (m[2] && !m[1].includes('.')) v += parseInt(m[2], 10) / (m[2].length === 1 ? 10 : 100);
  return Math.round(v * 100) / 100;
}
const DICT_KEYS = /^(cantidad|stock|unidad|unidades|piezas?|par|pares|dolar|dolares|costo|costo unitario|me costo|costo de|cuesta|precio|precio de venta|venderlo|vender|venta|talla|medida|tamano|color)\b/;
function parseDictation(text) {
  const raw = String(text || '').trim();
  const s = spokenNumbersToDigits(raw);
  const out = {};
  let m = /(?:cantidad|stock)\s+(?:de\s+)?(\d+)/.exec(s) || /(\d+)\s+(?:unidad(?:es)?|piezas?|par(?:es)?)\b/.exec(s);
  if (m) out.qty = Math.min(9999, parseInt(m[1], 10));
  const cost = amountAfter(s, 'costo unitario|costo|me costo|costaron|costo de compra|cuesta|compre a|comprado a');
  if (cost != null) out.cost = cost;
  const price = amountAfter(s, 'precio de venta|precio|vender a|venderlo a|venderla a|venta a|venta');
  if (price != null) out.price = price;
  m = /(?:talla|medida|tamano)\s+(?:de\s+)?(\d+(?:\.\d+)?(?:\s*(?:cm|centimetros|mm|milimetros|pulgadas))?|pequen[ao]|median[ao]|grande|unica|ajustable|[a-z]{1,2}\b(?!\s*\d))/.exec(s);
  if (m) out.size = m[1].replace(/^pequen([ao])$/, 'pequeñ$1').replace(/^unica$/, 'única').replace(/centimetros/, 'cm').replace(/milimetros/, 'mm').trim().replace(/^(s|m|l|xs|xl)$/i, x => x.toUpperCase());
  const ds = deaccent(raw);
  m = /\bcolor\s+([a-z]+(?:\s+rosa)?)/.exec(ds);
  const colorWord = m ? m[1] : (ES_COLORS.find(([w]) => new RegExp('\\b' + w + '\\b').test(ds)) || [])[0];
  if (colorWord) { const c = ES_COLORS.find(([w]) => w === colorWord || colorWord.startsWith(w)); out.color = c ? c[1] : colorWord; }
  // Nombre: lo que se dijo antes de la primera palabra clave (o después de "nombre"/"se llama").
  let nameSrc = raw;
  const nm = /\b(?:nombre|se llama)\s*:?\s*(.+)/i.exec(raw);
  if (nm) nameSrc = nm[1];
  const words = nameSrc.split(/\s+/), keep = [];
  const numWord = dw => /^\d/.test(dw) || dw in ES_TENS || dw in ES_HUNDREDS || (dw in ES_UNITS && !/^(un|una|uno)$/.test(dw)) || dw === 'mil';
  for (const w of words) {
    const dw = deaccent(w).replace(/[^a-z0-9]/g, '');
    if (DICT_KEYS.test(dw) || (numWord(dw) && keep.length)) break;
    keep.push(w);
  }
  let name = keep.join(' ').replace(/[.,;:]+$/, '').replace(/^(un|una|el|la)\s+/i, '');
  for (let k = 0; k < 3; k++) name = name.replace(/[\s,]+(de|a|en|con|y|un|una)$/i, '').replace(/[.,;:]+$/, '').trim();
  if (name && !/^\d+$/.test(name)) out.name = name.charAt(0).toUpperCase() + name.slice(1);
  return out;
}

// ── Revisión antes de publicar (gratis) ──
const COLOR_EMOJI_RE = /[\p{Extended_Pictographic}\u{FE0F}]/u;
function hasColorEmoji(s) { return [...String(s || '')].some(ch => COLOR_EMOJI_RE.test(ch) && !/[©®™]/.test(ch)); }
function median(xs) { const a = xs.filter(x => Number.isFinite(x)).sort((x, y) => x - y); if (!a.length) return null; const h = a.length >> 1; return a.length % 2 ? a[h] : (a[h - 1] + a[h]) / 2; }
// Precio de referencia: mediana de las piezas parecidas (huella de pieza, si el identificador ya preparó
// el catálogo en esta sesión: nunca fuerza la descarga); si no, de las de la misma categoría y material.
function referencePrice(p, products, pieceItems) {
  const id = String(p.id);
  if (pieceItems) {
    const me = pieceItems.find(it => String(it.p.id) === id);
    const v = me && me.piece && me.piece.anchor;
    if (v) {
      const close = rankPiece(v, pieceItems.filter(it => String(it.p.id) !== id), 7).filter(x => x.score >= SUGGEST_MIN);
      const pr = close.map(x => Number(x.p.price)).filter(x => x > 0);
      if (pr.length >= 2) return { median: median(pr), n: pr.length, by: 'parecidas' };
    }
  }
  const same = (products || []).filter(x => String(x.id) !== id && x.available !== false && x.category === p.category && (x.material || '') === (p.material || '') && Number(x.price) > 0);
  if (same.length >= 3) return { median: median(same.map(x => Number(x.price))), n: same.length, by: 'misma categoría y material' };
  return null;
}
// → [{ p, isNew, warnings: [texto] }] solo de los productos nuevos o cambiados que tienen algo.
function prePublishWarnings({ products, baseProds, stock, pendingStock, pieceItems }) {
  const out = [];
  for (const p of products || []) {
    const id = String(p.id), before = baseProds ? baseProds.get(id) : undefined;
    if (before != null && before === JSON.stringify(p)) continue;
    // Solo cambió "similar" (Actualizar recomendaciones / al publicar): no es una edición de la ficha.
    if (before != null) { try { const b = JSON.parse(before); delete b.similar; const { similar, ...rest } = p; if (JSON.stringify(b) === JSON.stringify(rest)) continue; } catch (_) {} }
    const isNew = before == null, w = [];
    if (!String(p.name_en || '').trim() || !String(p.description_en || '').trim()) w.push('Falta el texto en inglés' + (!String(p.name_en || '').trim() ? ' (nombre)' : ' (descripción)') + ': se traducirá solo al publicar; revísalo.');
    if (hasColorEmoji(p.name) || hasColorEmoji(p.description) || hasColorEmoji(p.name_en) || hasColorEmoji(p.description_en)) w.push('Tiene emojis de color en el nombre o la descripción (usa solo ♡ ✦ ◇ ✧ ✓ ✕).');
    if (!String(p.imageUrl || '').trim()) w.push('No tiene foto principal.');
    const price = Number(p.price), ref = price > 0 ? referencePrice(p, products, pieceItems) : null;
    if (ref && ref.median > 0 && (price > 2 * ref.median || price < 0.5 * ref.median)) w.push(`Precio $${price} lejos de las piezas ${ref.by} (mediana $${Math.round(ref.median)} de ${ref.n}).`);
    const qty = pendingStock && pendingStock[id] != null ? pendingStock[id] : (stock && Number.isInteger(stock[id]) ? stock[id] : null);
    if (isNew && qty === 0) w.push('Producto nuevo con stock 0 (saldrá agotado).');
    if (w.length) out.push({ p, isNew, warnings: w });
  }
  return out;
}

// ── Stock de productos nuevos (todavía sin publicar) ──
// /stock/set solo acepta productos que ya están en el catálogo publicado (la tienda tarda 1–2 min),
// así que la cantidad de una pieza nueva queda pendiente en este teléfono y se manda después de
// publicar (se reintenta al cargar el stock hasta que entre).
const PENDING_STOCK_KEY = 'cacusa-admin-pending-stock';
function pendingStockRead() { try { const o = JSON.parse(localStorage.getItem(PENDING_STOCK_KEY) || '{}'); return o && typeof o === 'object' ? o : {}; } catch (_) { return {}; } }
function pendingStockWrite(o) { try { if (Object.keys(o).length) localStorage.setItem(PENDING_STOCK_KEY, JSON.stringify(o)); else localStorage.removeItem(PENDING_STOCK_KEY); } catch (_) {} }

// Factura → piezas del lote: palabras en común (raíz de 4 letras, sin tildes) entre la línea y el nombre.
const INV_SYN = { earring: 'aret', ring: 'anil', necklace: 'cade', chain: 'cade', bracelet: 'puls', collar: 'cade', argolla: 'aret', topo: 'aret', topos: 'aret', dije: 'dije', pendant: 'dije' };
function invTokens(s) {
  return new Set(deaccent(s).split(/[^a-z0-9]+/).filter(w => w.length >= 3 && !/^(con|del|las|los|para|una|uno|unid|und|pcs|par)$/.test(w)).map(w => INV_SYN[w] || w.slice(0, 4)));
}
function invoiceMatch(lines, groups) {
  const gt = groups.map(g => invTokens(g.label));
  const pairs = [];
  lines.forEach((l, i) => { const lt = invTokens(l.description); gt.forEach((t, j) => { let n = 0; for (const w of lt) if (t.has(w)) n++; if (n) pairs.push({ i, j, s: n / Math.sqrt(lt.size * t.size || 1) }); }); });
  pairs.sort((a, b) => b.s - a.s);
  const li = new Map(), used = new Set();
  for (const x of pairs) if (!li.has(x.i) && !used.has(x.j) && x.s >= 0.25) { li.set(x.i, x.j); used.add(x.j); }
  return lines.map((_, i) => li.has(i) ? li.get(i) : -1);
}

// "Contar unidades con foto" (/product/count, Haiku, tope 100/día): una foto → número → Robin confirma.
function CountPhotoButton({ token, hint, onUse, testid = 'countBtn', small }) {
  const ref = useRef();
  const [st, setSt] = useState(null); // { busy } | { count, by_color, draft } | { err }
  const pick = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    setSt({ busy: true });
    try {
      const cv = await fileToCanvas(f, 1280);
      const b64 = canvasJpegB64(cv, 1024, 290 * 1024);
      const r = await apiCall('product/count', { token, image: b64, mediaType: 'image/jpeg', hint: hint || undefined });
      setSt({ count: r.count, by_color: r.by_color || [], draft: String(r.count) });
    } catch (e2) {
      setSt({ err: e2 && e2.status === 429 ? 'Se alcanzó el límite de conteos de hoy: cuéntalas a mano.' : e2 && e2.status === 503 ? 'Contar con IA no está activado todavía.' : 'No se pudo contar: ' + ((e2 && e2.message) || 'error') });
    }
  };
  const n = st && st.draft != null ? Number(st.draft) : NaN;
  return (
    <>
      <input ref={ref} type="file" accept="image/*" onChange={pick} style={{ display: 'none' }} aria-label="Foto para contar unidades" />
      <button type="button" data-testid={testid} onClick={() => ref.current.click()} disabled={st && st.busy} aria-busy={!!(st && st.busy)}
        style={{ minHeight: small ? 36 : 44, padding: '0 12px', borderRadius: 99, border: '1.5px solid #D9C9EE', background: 'white', color: '#5B3F8A', fontWeight: 700, fontSize: 12, cursor: 'pointer', whiteSpace: 'nowrap' }}>
        {st && st.busy ? 'Contando…' : '✦ Contar unidades con foto'}
      </button>
      {st && !st.busy && (
        <Modal onClose={() => setSt(null)} labelledBy="countTitle" boxStyle={{ maxWidth: 360 }}>
          <h3 id="countTitle" style={{ fontSize: 17, fontWeight: 800, marginBottom: 10 }}>Contar unidades</h3>
          {st.err ? <div role="alert" style={{ fontSize: 13, color: '#B91C1C' }}>{st.err}</div> : (
            <div data-testid="countResult">
              <div role="status" style={{ fontSize: 14, color: '#1A1118', marginBottom: 8 }}>Conté <b>{st.count}</b> unidad{st.count === 1 ? '' : 'es'}{st.by_color.length ? ': ' + st.by_color.map(c => c.color + ' ' + c.count).join(', ') : ''}.</div>
              <label htmlFor="countDraft" style={{ fontSize: 12, fontWeight: 700, color: '#5B4A63' }}>Revisa o corrige el número</label>
              <input id="countDraft" type="number" inputMode="numeric" min={0} max={9999} value={st.draft} onChange={e => setSt(s => ({ ...s, draft: e.target.value }))}
                style={{ display: 'block', width: 120, marginTop: 4, padding: '8px 10px', border: '1.5px solid #E5DDEA', borderRadius: 8, fontSize: 15 }} />
            </div>
          )}
          <div style={{ display: 'flex', gap: 8, marginTop: 16 }}>
            <button type="button" onClick={() => setSt(null)} style={{ flex: 1, minHeight: 44, borderRadius: 99, border: '1.5px solid #ddd', background: 'white', fontWeight: 700 }}>Cancelar</button>
            {!st.err && <button type="button" data-testid="countUse" disabled={!(Number.isInteger(n) && n >= 0 && n <= 9999)} onClick={() => { onUse(n); setSt(null); }}
              style={{ flex: 2, minHeight: 44, borderRadius: 99, border: 'none', background: 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', fontWeight: 800 }}>Usar {Number.isInteger(n) ? n : ''} como stock</button>}
          </div>
        </Modal>
      )}
    </>
  );
}

// Dictado por voz (solo si el navegador tiene Web Speech API). onResult(texto, campos).
function DictateButton({ onResult }) {
  const [on, setOn] = useState(false);
  const [msg, setMsg] = useState('');
  const recRef = useRef(null);
  if (!speechSupported()) return null;
  const start = () => {
    if (on) { try { recRef.current && recRef.current.stop(); } catch (_) {} return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR(); recRef.current = rec;
    rec.lang = speechLang(); rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onresult = e => {
      const text = Array.from(e.results || []).map(r => r[0] && r[0].transcript).filter(Boolean).join(' ');
      const f = parseDictation(text);
      setMsg('Escuché: "' + text + '"');
      onResult(text, f);
    };
    rec.onerror = e => setMsg(e && e.error === 'not-allowed' ? 'Permite el micrófono para dictar.' : 'No se entendió, intenta de nuevo.');
    rec.onend = () => setOn(false);
    try { rec.start(); setOn(true); setMsg('Escuchando… di por ejemplo: "anillo corazón dorado, cantidad 12, costo 2,50, precio 25, talla 7"'); } catch (_) { setOn(false); }
  };
  return (
    <div style={{ marginBottom: 14 }}>
      <button type="button" data-testid="dictateBtn" onClick={start} aria-pressed={on}
        style={{ minHeight: 44, padding: '0 16px', borderRadius: 99, border: '1.5px solid ' + (on ? '#C0336E' : '#D9C9EE'), background: on ? '#FCE7F0' : 'white', color: on ? '#C0336E' : '#5B3F8A', fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>
        {on ? '● Escuchando… (toca para terminar)' : '◉ Dictar datos'}
      </button>
      {msg && <div role="status" aria-live="polite" data-testid="dictateMsg" style={{ fontSize: 11.5, color: '#5B4A63', marginTop: 6 }}>{msg}</div>}
    </div>
  );
}

// Margen de "precio sugerido = costo × margen" (Ajustes). Privado: se guarda en el Worker (/cost/set).
function MarginSetting({ token, margin, onSaved }) {
  const [draft, setDraft] = useState(String(margin || MARGIN_DEFAULT));
  const [st, setSt] = useState('');
  useEffect(() => { setDraft(String(margin || MARGIN_DEFAULT)); }, [margin]);
  const save = async () => {
    const m = Number(String(draft).replace(',', '.'));
    if (!(m >= 1 && m <= 20)) { setSt('Usa un número entre 1 y 20'); return; }
    setSt('Guardando…');
    try { const r = await apiCall('cost/set', { token, margin: m }); onSaved(r.margin || m); setSt('✓ Guardado'); }
    catch (e) { setSt('No se guardó (' + ((e && e.message) || 'error') + ')'); }
  };
  return (
    <section data-testid="marginSetting" style={{ background: 'white', borderRadius: 14, padding: 16, boxShadow: '0 1px 6px rgba(0,0,0,.06)', marginTop: 16, maxWidth: 560 }}>
      <h3 style={{ fontSize: 15, fontWeight: 800, marginBottom: 4 }}>Margen para el precio sugerido</h3>
      <p style={{ fontSize: 12, color: '#7A6880', marginBottom: 10 }}>Precio sugerido = costo × margen, redondeado como los precios de tu catálogo. El costo y el margen son privados: nunca salen en la tienda.</p>
      <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
        <label htmlFor="marginInput" style={{ fontSize: 13, fontWeight: 700, color: '#5B4A63' }}>Margen ×</label>
        <input id="marginInput" type="number" inputMode="decimal" min={1} max={20} step={0.1} value={draft} onChange={e => setDraft(e.target.value)}
          style={{ width: 90, padding: '8px 10px', border: '1.5px solid #E5DDEA', borderRadius: 8, fontSize: 15 }} />
        <button type="button" onClick={save} style={{ minHeight: 40, padding: '0 16px', borderRadius: 99, border: 'none', background: 'linear-gradient(135deg,#C0336E,#9B5DE5)', color: 'white', fontWeight: 800 }}>Guardar</button>
        <span role="status" aria-live="polite" style={{ fontSize: 12, color: st.startsWith('✓') ? '#15803D' : '#7A6880' }}>{st}</span>
      </div>
    </section>
  );
}

// ── Ingreso por lote (27 nov) ──
// Robin elige muchas fotos de la galería (p. ej. 40 fotos de 15 piezas). En el teléfono: huella de
// cada foto (foto entera + solo la pieza), aviso de calidad, grupos de fotos de la misma pieza
// (clusterPhotos) y, por grupo, "¿ya existe?" (mismos umbrales DUP_* de Nuevo producto) → "sumar
// al stock", o borrador con "Sugerir datos" (Haiku /product/describe, como mucho BATCH_AI_MAX por
// lote y siempre dentro del tope diario de 40 del Worker; al llegar al tope sigue con la sugerencia
// básica). Todo en orden, una foto a la vez, cediendo la pantalla entre foto y foto. Nada se crea
// solo: cada grupo se aprueba (o "Aprobar todo") y entonces sube las fotos y crea el producto igual
// que "Nuevo producto" (principal + galería, código de su categoría, stock).
const BATCH_AI_MAX = 40, BATCH_MAX_PHOTOS = 80;
let _batchSeq = 0;
const batchId = () => 'b' + (++_batchSeq) + '_' + Date.now().toString(36);
const yieldUi = () => new Promise(r => setTimeout(r, 0));

async function batchEmbedPhoto(eng, cv) {
  const r = eng.kind === 'v3' ? await embedV3Both(eng, cv, null) : null;
  const q = { emb: r ? r.all : await embedPhoto(eng, cv, 'base'), embRef: r ? r.ref : null, color: colorDescriptor(cv), kind: eng.kind, cw: eng.cw, margin: eng.margin, pct: eng.pct };
  let box;
  if (pieceAvailable(eng)) {
    try { const pc = await pieceCanvas(eng, cv); box = pc.box || null; if (pc.cv) { q.piece = (await embedV3Both(eng, pc.cv, null)).all; q.pieceOk = pc.ok; } } catch (e) { console.warn('lote, pieza:', e && e.message); }
  }
  return { q, quality: photoQualityCheck(cv, box) };
}
// Mejores candidatas del catálogo para un grupo: "¿ya existe?" con cada foto, máximo por producto.
async function batchMatch(photos, items) {
  const best = new Map();
  for (const ph of photos) {
    let ranked = [];
    try { ranked = await dupCandidates(ph.q, items); } catch (_) {}
    for (const r of ranked) { const id = String(r.p.id), b = best.get(id); if (!b || r.score > b.score) best.set(id, { p: r.p, score: r.score }); }
  }
  const list = [...best.values()].sort((a, b) => b.score - a.score);
  const top = list.length ? list[0].score : -1;
  const level = top >= DUP_HIGH ? 'high' : top >= DUP_MEDIUM ? 'medium' : null;
  if (!level) return null;
  return { level, cands: list.filter(r => r.score >= (level === 'high' ? DUP_HIGH : DUP_MEDIUM)).slice(0, 3), idx: 0 };
}
function groupLabel(g) { return (g.action === 'stock' && g.match ? g.match.cands[g.match.idx].p.name : g.fields.name) || ''; }

function BatchIntakeModal({ token, products, categories, materials, costs, margin, onCreate, onStockAdded, onCostsSaved, onPendingStock, onClose }) {
  const cats = (categories && categories.length) ? categories : DEFAULT_CATEGORIES;
  const mats = (materials && materials.length) ? materials : DEFAULT_MATERIALS;
  const fileRef = useRef(), invRef = useRef(), retakeRef = useRef(), retakeFor = useRef(null);
  const cancelRef = useRef(false), cvRef = useRef(new Map()), catRef = useRef(null);
  const [phase, setPhase] = useState('pick'); // pick | work | review
  const [photos, setPhotos] = useState([]);   // { id, file, url, q, quality, name }
  const [groups, setGroups] = useState([]);   // ver newGroup
  const [prog, setProg] = useState({ label: '', i: 0, n: 0 });
  const [msg, setMsg] = useState('');
  const [aiInfo, setAiInfo] = useState({ used: 0, cap: false });
  const [inv, setInv] = useState(null);       // { busy } | { lines, assign } | { err }
  const [busyAll, setBusyAll] = useState(false);
  const photoById = id => photos.find(p => p.id === id);
  const style = catalogPriceStyle(products);
  useEffect(() => () => { cancelRef.current = true; photos.forEach(p => { try { URL.revokeObjectURL(p.url); } catch (_) {} }); }, []);

  const newGroup = (photoIds, extra) => ({ id: batchId(), photoIds, action: 'new', match: null, fields: { name: '', name_en: '', description: '', description_en: '', category: cats[0], material: mats[0], price: '', color: 'rose' },
    tags: {}, note: '', neighbors: [], nbPrice: null, qty: photoIds.length ? 1 : 1, qtyTouched: false, cost: '', currency: 'USD', status: 'pending', err: '', result: null, drafted: false, ...extra });
  const setGroup = (gid, fn) => setGroups(gs => gs.map(g => g.id === gid ? { ...g, ...(typeof fn === 'function' ? fn(g) : fn) } : g));

  // Borrador de un grupo (vecinas + IA si se permite). Devuelve el parche de campos.
  const draftFor = async (g, phs, useAi) => {
    const rep = phs.find(p => !p.quality.issues.length && p.q.pieceOk !== false) || phs[0];
    const img = cvRef.current.get(rep.id);
    const items = catRef.current ? catRef.current.items : [];
    const r = await suggestCore({ img, q: rep.q, items, cats, mats, token, useAi });
    const tpl = templateProductText(r.sug, r.category, r.material);
    const text = k => (r.ai && String(r.ai[k] || '').trim()) ? [String(r.ai[k]).trim(), 'ia'] : [tpl[k], 'local'];
    const fields = { ...g.fields }, tags = {};
    for (const k of ['name', 'name_en', 'description', 'description_en']) { const [v, t] = text(k); fields[k] = v; tags[k] = t; }
    if (cats.includes(r.category)) { fields.category = r.category; tags.category = r.catAi ? 'ia' : 'local'; }
    if (mats.includes(r.material)) { fields.material = r.material; tags.material = r.matAi ? 'ia' : 'local'; }
    if (r.hasClose && r.sug.price) { fields.price = String(r.sug.price); tags.price = 'local'; }
    if (r.hasClose && r.sug.color && COLORS[r.sug.color]) fields.color = r.sug.color;
    const note = r.note + (r.hasClose ? '' : (r.note ? '. ' : '') + 'Diseño nuevo: revisa el precio');
    return { patch: { fields, tags, note, drafted: true, nbPrice: r.hasClose ? r.sug.price : null, neighbors: r.close.slice(0, 3).map(x => ({ id: String(x.p.id), sku: normalizeSku(x.p.sku) || x.p.name, img: productImageUrl(x.p) })) }, aiStatus: r.aiStatus };
  };

  const analyze = async files => {
    const list = files.filter(f => f && /^image\//.test(f.type || 'image/')).slice(0, BATCH_MAX_PHOTOS);
    if (!list.length) return;
    cancelRef.current = false; setPhase('work'); setMsg(files.length > BATCH_MAX_PHOTOS ? `Se usan las primeras ${BATCH_MAX_PHOTOS} fotos.` : '');
    try {
      setProg({ label: _prewarmState === 'done' ? 'Preparando el reconocimiento…' : 'Cargando el reconocimiento (la primera vez descarga ~55 MB; conviene wifi)…', i: 0, n: list.length });
      const eng = await loadRecognitionModel();
      const cat = await prepareCatalogShared(products); catRef.current = cat;
      setProg({ label: 'Preparando el catálogo…', i: 0, n: list.length });
      await preparePieceItems(cat.items).catch(() => false);
      const phs = [];
      for (let i = 0; i < list.length; i++) {
        if (cancelRef.current) return;
        setProg({ label: `Analizando foto ${i + 1} de ${list.length}…`, i, n: list.length });
        await yieldUi();
        const f = list[i];
        try {
          const cv = await fileToCanvas(f, 1024);
          const { q, quality } = await batchEmbedPhoto(eng, cv);
          q.t = await exifCaptureTime(f);
          const id = batchId(); cvRef.current.set(id, cv);
          phs.push({ id, file: f, url: URL.createObjectURL(f), q, quality, name: f.name || 'foto ' + (i + 1) });
        } catch (e) { setMsg(m => (m ? m + ' ' : '') + `No se pudo leer ${f.name || 'una foto'}.`); }
      }
      if (cancelRef.current || !phs.length) { if (!phs.length) setPhase('pick'); return; }
      setPhotos(phs);
      const idx = clusterPhotos(phs.map(p => p.q));
      let gs = idx.map(ix => newGroup(ix.map(i => phs[i].id)));
      let used = 0, cap = false;
      for (let k = 0; k < gs.length; k++) {
        if (cancelRef.current) return;
        setProg({ label: `Revisando pieza ${k + 1} de ${gs.length}…`, i: k, n: gs.length });
        await yieldUi();
        const g = gs[k], gph = g.photoIds.map(id => phs.find(p => p.id === id));
        g.qty = 1;
        g.match = await batchMatch(gph, cat.items);
        if (g.match && g.match.level === 'high') { g.action = 'stock'; continue; }
        const allowAi = !cap && used < BATCH_AI_MAX;
        try {
          const d = await draftFor(g, gph, allowAi);
          Object.assign(g, d.patch);
          if (allowAi && d.aiStatus !== 'skip') used++;
          if (d.aiStatus === 'cap' || d.aiStatus === 'off') cap = true;
        } catch (e) { g.note = 'No se pudo sugerir: ' + ((e && e.message) || 'error'); }
      }
      setAiInfo({ used, cap });
      setGroups(gs); setPhase('review');
    } catch (e) {
      setMsg('No se pudo analizar el lote: ' + ((e && e.message) || 'error')); setPhase('pick');
    }
  };

  // ── Edición de grupos ──
  const movePhoto = (pid, toGid) => setGroups(gs => {
    let out = gs.map(g => ({ ...g, photoIds: g.photoIds.filter(x => x !== pid) }));
    if (toGid === '__new') out.push(newGroup([pid], { note: 'Grupo nuevo: toca "✦ Sugerir datos" o escribe los datos.' }));
    else out = out.map(g => g.id === toGid ? { ...g, photoIds: [...g.photoIds, pid] } : g);
    return out.filter(g => g.photoIds.length || g.status === 'done');
  });
  const mergeInto = (fromGid, toGid) => setGroups(gs => {
    const from = gs.find(g => g.id === fromGid); if (!from) return gs;
    return gs.filter(g => g.id !== fromGid).map(g => g.id === toGid ? { ...g, photoIds: [...g.photoIds, ...from.photoIds] } : g);
  });
  const resuggest = async gid => {
    const g = groups.find(x => x.id === gid); if (!g) return;
    setGroup(gid, { busy: true });
    try {
      const d = await draftFor(g, g.photoIds.map(photoById), !aiInfo.cap);
      if (!aiInfo.cap && d.aiStatus !== 'skip') setAiInfo(a => ({ used: a.used + 1, cap: a.cap || d.aiStatus === 'cap' || d.aiStatus === 'off' }));
      setGroup(gid, x => ({ ...d.patch, fields: { ...d.patch.fields, ...Object.fromEntries(Object.entries(x.fields).filter(([k]) => x.touched && x.touched[k])) }, busy: false }));
    } catch (e) { setGroup(gid, { busy: false, note: 'No se pudo sugerir: ' + ((e && e.message) || 'error') }); }
  };
  const setField = (gid, k, v) => setGroup(gid, g => ({ fields: { ...g.fields, [k]: v }, tags: { ...g.tags, [k]: undefined }, touched: { ...(g.touched || {}), [k]: true } }));
  const retake = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    const pid = retakeFor.current; retakeFor.current = null;
    if (!f || !pid) return;
    try {
      const eng = await loadRecognitionModel(), cv = await fileToCanvas(f, 1024);
      const { q, quality } = await batchEmbedPhoto(eng, cv);
      cvRef.current.set(pid, cv);
      setPhotos(ps => ps.map(p => { if (p.id !== pid) return p; try { URL.revokeObjectURL(p.url); } catch (_) {} return { ...p, file: f, url: URL.createObjectURL(f), q, quality, name: f.name || p.name }; }));
    } catch (e2) { setMsg('No se pudo leer la foto nueva: ' + ((e2 && e2.message) || 'error')); }
  };

  // ── Aprobar ──
  const groupProblem = g => {
    if (!g.photoIds.length) return 'Sin fotos';
    const q = Number(g.qty);
    if (!Number.isInteger(q) || q < (g.action === 'stock' ? 1 : 0) || q > 9999) return g.action === 'stock' ? 'Unidades a sumar: entero de 1 a 9999' : 'Cantidad: entero de 0 a 9999';
    if (g.cost !== '' && !(Number(g.cost) >= 0)) return 'Costo inválido';
    if (g.action === 'new' && !String(g.fields.name || '').trim()) return 'Falta el nombre';
    if (g.action === 'new' && !(Number(g.fields.price) > 0)) return 'Falta el precio';
    return '';
  };
  const approve = async gid => {
    const g = groups.find(x => x.id === gid);
    if (!g || g.status === 'done' || g.status === 'saving') return true;
    const prob = groupProblem(g);
    if (prob) { setGroup(gid, { err: prob }); return false; }
    setGroup(gid, { status: 'saving', err: '' });
    const gph = g.photoIds.map(photoById).filter(Boolean);
    try {
      if (g.action === 'stock') {
        const c = g.match.cands[g.match.idx], id = String(c.p.id);
        const mv = await stockAddRelative(token, id, Number(g.qty), 'Ingreso por lote');
        const cur = mv.from != null ? mv.from : 0, next = mv.to != null ? mv.to : cur + Number(g.qty);
        // Las fotos del taller sirven como fotos reales aprendidas de esa pieza (como "Sí, es el mismo").
        for (const ph of gph.slice(0, 3)) if (ph.q.kind === RECOG_KIND && ph.q.embRef) apiCall('identify/ref/add', { token, id, vector: learnedRefVector(ph.q) }).then(r => { if (r && Number.isInteger(r.count)) setRefCount(id, r.count); }).catch(() => {});
        if (g.cost !== '') { try { const r = await apiCall('cost/set', { token, items: [{ id, cost: Number(g.cost), currency: g.currency }] }); onCostsSaved && onCostsSaved(r); } catch (_) {} }
        onStockAdded && onStockAdded(c.p, cur, next);
        setGroup(gid, { status: 'done', result: `Stock ${normalizeSku(c.p.sku) || c.p.name}: ${cur} → ${next}` });
        return true;
      }
      const urls = [];
      for (let i = 0; i < gph.length; i++) {
        setGroup(gid, { result: `Subiendo foto ${i + 1} de ${gph.length}…` });
        const b64 = await compressImage(gph[i].file);
        const slug = (gph[i].name || 'foto').replace(/[^a-z0-9]+/gi, '_').toLowerCase().substring(0, 40) || 'foto';
        const fname = `${Date.now()}_${slug}.webp`;
        const res = await apiUpload(token, `${IMAGES_PATH}/${fname}`, b64, `Imagen: ${fname}`);
        urls.push(res.url);
      }
      const f = g.fields;
      const created = onCreate({ name: f.name.trim(), name_en: String(f.name_en || '').trim(), description: f.description || '', description_en: String(f.description_en || '').trim(), category: f.category, material: f.material,
        price: Number(f.price), oldPrice: null, img: 'collar', color: f.color || 'rose', tag: null, personalized: false, available: true, imageUrl: urls[0], images: urls.slice(1), focalX: 50, focalY: 50, zoom: 1, promo: null });
      const qty = Number(g.qty);
      if (qty !== 1) onPendingStock && onPendingStock(created.id, qty);
      if (g.cost !== '') { try { const r = await apiCall('cost/set', { token, items: [{ id: String(created.id), cost: Number(g.cost), currency: g.currency }] }); onCostsSaved && onCostsSaved(r); } catch (e) { setGroup(gid, { err: 'El producto se creó pero el costo no se guardó (' + ((e && e.message) || 'error') + ').' }); } }
      setGroup(gid, { status: 'done', result: `Creado ${created.sku} · stock ${qty}${qty !== 1 ? ' (se guarda al publicar)' : ''}` });
      return true;
    } catch (e) {
      setGroup(gid, { status: 'pending', result: null, err: (e && e.status === 401 ? 'Sesión expirada: vuelve a entrar.' : 'No se pudo aprobar: ' + ((e && e.message) || 'error')) });
      return false;
    }
  };
  const approveAll = async () => {
    if (busyAll) return;
    setBusyAll(true);
    let okN = 0, bad = 0;
    for (const g of groups) { if (g.status === 'done') continue; (await approve(g.id)) ? okN++ : bad++; await yieldUi(); }
    setBusyAll(false);
    setMsg(`✓ ${okN} aprobada${okN === 1 ? '' : 's'}` + (bad ? ` · ${bad} con algo por corregir (marcadas en rojo)` : '') + '. Los productos nuevos se suben a la tienda con "Publicar cambios".');
  };

  // ── Factura del proveedor ──
  const readInvoice = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    setInv({ busy: true });
    try {
      const cv = await fileToCanvas(f, 2000);
      const b64 = canvasJpegB64(cv, 1600, 590 * 1024);
      const r = await apiCall('product/invoice', { token, image: b64, mediaType: 'image/jpeg' });
      const lines = r.lines || [];
      const open = groups.filter(g => g.status !== 'done');
      const asg = invoiceMatch(lines, open.map(g => ({ label: groupLabel(g) })));
      setInv({ lines, assign: asg.map(j => j >= 0 ? open[j].id : '') });
    } catch (e2) {
      setInv({ err: e2 && e2.status === 429 ? 'Se alcanzó el límite de facturas de hoy: escribe el costo a mano.' : e2 && e2.status === 503 ? 'Leer facturas con IA no está activado todavía.' : 'No se pudo leer la factura: ' + ((e2 && e2.message) || 'error') });
    }
  };
  const applyInvoice = () => {
    const by = new Map();
    inv.lines.forEach((l, i) => { const gid = inv.assign[i]; if (gid) by.set(gid, l); });
    setGroups(gs => gs.map(g => {
      const l = by.get(g.id); if (!l) return g;
      const cost = l.unit_cost > 0 ? String(l.unit_cost) : g.cost;
      const fields = { ...g.fields };
      const sp = l.unit_cost > 0 && l.currency === 'USD' ? priceFromCost(l.unit_cost, margin, products) : null;
      const tags = { ...g.tags };
      if (sp && g.action === 'new' && !(g.touched && g.touched.price) && !(Number(fields.price) > 0)) { fields.price = String(sp); tags.price = 'local'; }
      return { ...g, cost, currency: l.currency || 'USD', qty: l.quantity > 0 ? l.quantity : g.qty, fields, tags, invoiceLine: l.description };
    }));
    setMsg(`✓ Factura aplicada a ${by.size} pieza${by.size === 1 ? '' : 's'}: costo y cantidad. Revísalos antes de aprobar.`);
    setInv(null);
  };

  const inp = { padding: '9px 11px', border: '1.5px solid #e4e4e4', borderRadius: 10, fontSize: 15, outline: 'none', width: '100%', boxSizing: 'border-box', background: 'white' };
  const lbl = { display: 'block', fontSize: 11, fontWeight: 700, color: '#6B5A73', letterSpacing: '.06em', textTransform: 'uppercase', marginBottom: 4 };
  const pill = { minHeight: 40, padding: '0 14px', borderRadius: 99, border: '1.5px solid #D9C9EE', background: 'white', color: '#5B3F8A', fontWeight: 700, fontSize: 12.5, cursor: 'pointer' };
  const pending = groups.filter(g => g.status !== 'done');
  const Tag = ({ g, k }) => g.tags && g.tags[k] ? <span style={{ marginLeft: 6, fontSize: 10, fontWeight: 700, color: '#7C3AED', background: '#F1EAFB', borderRadius: 99, padding: '1px 7px', textTransform: 'none', letterSpacing: 0 }}>{g.tags[k] === 'ia' ? 'sugerido (IA)' : 'sugerido'}</span> : null;

  const tryClose = () => { if (phase === 'review' && pending.length && !confirm('¿Cerrar el lote? Las piezas sin aprobar se pierden.')) return; cancelRef.current = true; onClose(); };
  return (
    <Modal onClose={tryClose}
      labelledBy="batchTitle" overlayStyle={{ alignItems: 'flex-start', overflowY: 'auto', padding: 10 }} boxStyle={{ maxWidth: 640, padding: '18px 14px 14px', marginTop: 6, borderRadius: 20 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, marginBottom: 10 }}>
        <h2 id="batchTitle" style={{ fontSize: 19, fontWeight: 800 }}>Ingreso por lote</h2>
        <button type="button" onClick={tryClose} aria-label="Cerrar" style={{ width: 40, height: 40, borderRadius: '50%', background: '#f0f0f0', color: '#666', fontSize: 18, border: 'none' }}>✕</button>
      </div>
      <input ref={fileRef} type="file" accept="image/*" multiple onChange={e => { const fs = Array.from(e.target.files || []); e.target.value = ''; analyze(fs); }} style={{ display: 'none' }} aria-label="Fotos del lote" data-testid="batchFiles" />
      <input ref={retakeRef} type="file" accept="image/*" onChange={retake} style={{ display: 'none' }} aria-label="Foto de reemplazo" data-testid="batchRetakeFile" />
      <input ref={invRef} type="file" accept="image/*" onChange={readInvoice} style={{ display: 'none' }} aria-label="Foto de la factura" data-testid="invoiceFile" />

      {phase === 'pick' && (
        <div>
          <p style={{ fontSize: 13.5, color: '#3F3346', marginBottom: 10, lineHeight: 1.45 }}>Elige de tu galería todas las fotos de las piezas nuevas (puedes poner 2 o 3 fotos de cada una). Las agrupo por pieza, te digo cuáles ya existen para sumar stock y preparo un borrador para las demás. Nada se crea hasta que lo apruebes.</p>
          <PhotoTip style={{ marginBottom: 12 }} />
          <button type="button" data-testid="batchPick" onClick={() => fileRef.current.click()} style={{ width: '100%', minHeight: 52, borderRadius: 99, border: 'none', background: 'linear-gradient(135deg,#E8508A,#9B5DE5)', color: 'white', fontWeight: 800, fontSize: 15 }}>Elegir fotos</button>
          {msg && <div role="status" style={{ fontSize: 12.5, color: '#92400E', marginTop: 10 }}>{msg}</div>}
        </div>
      )}

      {phase === 'work' && (
        <div data-testid="batchWork" style={{ padding: '18px 4px' }}>
          <div role="status" aria-live="polite" style={{ fontSize: 14, fontWeight: 700, color: '#5B3F8A', marginBottom: 10 }}>{prog.label}</div>
          <div role="progressbar" aria-valuemin={0} aria-valuemax={prog.n || 1} aria-valuenow={prog.i} aria-label="Avance del lote" style={{ height: 8, background: '#EFE7F5', borderRadius: 99, overflow: 'hidden' }}>
            <div style={{ height: '100%', width: (prog.n ? Math.round(100 * prog.i / prog.n) : 5) + '%', background: 'linear-gradient(90deg,#E8508A,#9B5DE5)', transition: 'width .2s' }} />
          </div>
          <p style={{ fontSize: 12, color: '#7A6880', marginTop: 10 }}>Puedes dejar el teléfono: trabaja una foto a la vez. Las sugerencias con IA usan como mucho {BATCH_AI_MAX} del cupo diario.</p>
          {msg && <div role="status" style={{ fontSize: 12, color: '#92400E', marginTop: 6 }}>{msg}</div>}
          <button type="button" onClick={() => { cancelRef.current = true; setPhase('pick'); }} style={{ ...pill, marginTop: 12 }}>Cancelar</button>
        </div>
      )}

      {phase === 'review' && (
        <div>
          <div role="status" aria-live="polite" data-testid="batchSummary" style={{ fontSize: 13, color: '#3F3346', marginBottom: 8, lineHeight: 1.4 }}>
            {photos.length} fotos → <b>{groups.length} pieza{groups.length === 1 ? '' : 's'}</b>: {groups.filter(g => g.action === 'stock').length} para sumar stock, {groups.filter(g => g.action === 'new').length} nueva{groups.filter(g => g.action === 'new').length === 1 ? '' : 's'}.
            {aiInfo.cap ? ' Se llegó al límite de IA de hoy: algunos borradores usan la sugerencia básica.' : aiInfo.used ? ` IA usada en ${aiInfo.used} borrador${aiInfo.used === 1 ? '' : 'es'}.` : ''}
          </div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 10 }}>
            <button type="button" data-testid="invoiceBtn" onClick={() => invRef.current.click()} disabled={inv && inv.busy} style={pill}>{inv && inv.busy ? 'Leyendo factura…' : 'Leer factura (opcional)'}</button>
          </div>
          {inv && !inv.busy && (
            <div data-testid="invoicePanel" style={{ background: '#F7F3FA', borderRadius: 12, padding: 12, marginBottom: 12 }}>

                  </div>
                  <div style={{ display: 'flex', gap: 8, overflowX: 'auto', paddingBottom: 4 }}>
                    {gph.map(ph => (
                      <div key={ph.id} data-testid="batchPhoto" data-name={ph.name} style={{ width: 92, flexShrink: 0 }}>
                        <ZoomImg src={ph.url} title={'Pieza ' + (gi + 1)} sub={ph.name} alt={'Foto de la pieza ' + (gi + 1)} style={{ width: 92, height: 92, objectFit: 'cover', borderRadius: 10, display: 'block', border: ph.quality.issues.length ? '2px solid #FDBA74' : '1px solid #eee' }} />
                        {ph.quality.issues.length > 0 && <div data-testid="photoQWarn" style={{ fontSize: 10, color: '#9A3412', marginTop: 2, lineHeight: 1.2 }}>◇ {qualityText(ph.quality.issues)}</div>}
                        {!done && (
                          <>
                            {ph.quality.issues.length > 0 && <button type="button" onClick={() => { retakeFor.current = ph.id; retakeRef.current.click(); }} style={{ fontSize: 11, fontWeight: 700, color: '#9A3412', background: 'none', border: 'none', padding: '2px 0', textDecoration: 'underline' }}>Repetir foto</button>}
                            <label htmlFor={'mv' + ph.id} style={SR_ONLY}>Mover esta foto a</label>
                            <select id={'mv' + ph.id} data-testid="movePhoto" value="" onChange={e => e.target.value && movePhoto(ph.id, e.target.value)} style={{ width: '100%', fontSize: 11, padding: '4px 2px', borderRadius: 6, border: '1px solid #E5DDEA', marginTop: 2, background: 'white' }}>
                              <option value="">Mover a…</option>
                              {others.map(o => <option key={o.id} value={o.id}>Pieza {groups.indexOf(o) + 1}</option>)}
                              {gph.length > 1 && <option value="__new">Pieza nueva (separar)</option>}

                      </div>
                    ))}
                  </div>
                  {!done && (
                    <>
                      {g.match && (
                        <div data-testid="groupMatch" data-level={g.match.level} style={{ marginTop: 8, background: g.match.level === 'high' ? '#FFF7ED' : '#F7F3FA', border: '1px solid ' + (g.match.level === 'high' ? '#FDBA74' : '#E2D4F5'), borderRadius: 12, padding: 10 }}>
                          <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 6 }}>{g.match.level === 'high' ? '◇ Parece que ya existe' : '◇ Se parece a'} {g.match.cands.length > 1 && <span style={{ fontWeight: 600, fontSize: 11, color: '#7A6880' }}>({g.match.idx + 1} de {g.match.cands.length})</span>}</div>
                          <div style={{ display: 'flex', gap: 8 }}>
                            <figure style={{ margin: 0, flex: 1, minWidth: 0 }}><ZoomImg src={gph[0] && gph[0].url} title="Tu foto" alt="Tu foto" style={{ width: '100%', aspectRatio: '1', objectFit: 'cover', borderRadius: 10, display: 'block' }} /><figcaption style={{ fontSize: 10, color: '#7A6880' }}>Tu foto</figcaption></figure>

                      {g.action === 'new' && (
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 10 }}>

                          <div style={{ gridColumn: 'span 2' }}>

                          </div>
                          <div>
                            <label htmlFor={'bc' + g.id} style={lbl}>Categoría<Tag g={g} k="category" /></label>
                            <select id={'bc' + g.id} value={g.fields.category} onChange={e => setField(g.id, 'category', e.target.value)} style={inp}>{cats.map(x => <option key={x}>{x}</option>)}</select>
                          </div>
                          <div>
                            <label htmlFor={'bm' + g.id} style={lbl}>Material<Tag g={g} k="material" /></label>
                            <select id={'bm' + g.id} value={g.fields.material} onChange={e => setField(g.id, 'material', e.target.value)} style={inp}>{mats.map(x => <option key={x}>{x}</option>)}</select>
                          </div>
                          <div>
                            <label htmlFor={'bp' + g.id} style={lbl}>Precio USD *<Tag g={g} k="price" /></label>
